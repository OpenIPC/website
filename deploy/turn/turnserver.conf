# coturn for camera sharing links: the relay a guest's browser falls back to
# when its network and the camera's cannot reach each other directly.
#
# Installed by deploy/turn/install.sh, which fills in @IP@ (the host's public
# IPv4) and @SECRET@ (shared by every TURN host and the share role's
# SHARE_TURN_SECRET). Written for coturn 4.5.2 and later, which is what
# Debian 11 carries; nothing below needs anything newer.

listening-ip=@IP@
relay-ip=@IP@
listening-port=3478
min-port=49160
max-port=49999

# Credentials are minted by the share role for one page of one live share and
# expire minutes later (TURN REST, "<expiry>:<share id>"). There are no static
# users, and nothing else can mint one.
use-auth-secret
static-auth-secret=@SECRET@
realm=share.openipc.org
fingerprint
stale-nonce=600

# UDP and TCP to this server, UDP relayed out: the camera end is always UDP.
no-tls
no-dtls
no-tcp-relay
no-cli
no-multicast-peers

# What one page, and the whole host, may take. A page allocates once per URL
# it was given, so the per-user quota is a small multiple of that. max-bps is
# bytes per second per allocation: 2 MB/s carries a 4K stream.
user-quota=12
total-quota=300
max-bps=2000000
max-allocate-lifetime=3600

# A relay must only ever reach a camera on the Internet -- never this host,
# its neighbours, or any private network behind it.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=@IP@

syslog
simple-log
no-stdout-log
