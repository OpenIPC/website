# Owner reports and the Club's send form, with the origin's limits rather than
# the server's 1m: a report carries photos, documents and a flash backup, and
# the origin takes it up to 300m with five minutes to arrive
# (sites-available/org.openipc, `location = /api/v1/reports` and
# `location ^~ /api/v1/club/`). Without this a 16 MB backup sent here was
# refused with a 413 before it left this host (2026-10-09), and the origin
# never saw it. Unbuffered, so a large body streams through instead of being
# spooled to this host's disk first. openipc.ru carries the same location
# (mirrors/ru.openipc.snippet).
location ~ ^/api/v1/(?:reports$|club/) {
    include snippets/openipc-reports-proxy.conf;
    client_max_body_size 300m;
}
