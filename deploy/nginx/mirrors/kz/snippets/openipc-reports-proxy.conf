# The proxy behind both report locations (openipc-reports.conf for HTTPS,
# openipc-reports-plain.conf for port 80): to the origin over verified TLS,
# with the origin's limits for a report.

proxy_pass https://openipc.org;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_ssl_server_name         on;
proxy_ssl_name                openipc.org;
proxy_ssl_verify              on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_verify_depth        3;
# One failed verify, cached onto a reused TLS session, fails every later
# handshake until nginx reloads; on openipc.ru that answered every report 502
# (2026-10-09). A report is rare enough to afford a full handshake.
proxy_ssl_session_reuse       off;
proxy_http_version 1.1;
proxy_hide_header Strict-Transport-Security;

client_max_body_size 300m;
client_body_timeout 300;
proxy_request_buffering off;
proxy_read_timeout 300;
proxy_send_timeout 300;
