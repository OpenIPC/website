# TLS for the mirror's names. Certificates are certbot's, under
# /etc/letsencrypt/live/<name>/, and each server block names its own.
#
# No DHE ciphers and therefore no dhparam.pem: every cipher here is ECDHE,
# which takes its parameters from the curve rather than from a file. openipc.ru
# still carries the DHE suites and the 2019-era dhparam that goes with them;
# there is nothing left that needs them, and a missing dhparam.pem is the kind
# of thing that stops a host reloading months later.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;
