# Stock camera firmware's plain HTTP, in a port 80 server block before its
# `location / { return 301 https://...; }`. A camera on stock firmware has no
# TLS, so the redirect to HTTPS is a dead end for it; ipctool and its report
# are served here instead, as on the origin's own port 80 and on openipc.ru
# (mirrors/ru.openipc.snippet). The size check comes before the redirect, so
# without this a backup sent with `ipctool upload --host openipc.kz` was
# refused 413 here (2026-10-09).

# From the origin's port 80, because that is the only place it is served:
# over HTTPS /ipctool is a redirect to the project on GitHub.
location ~ ^/(?:ipctool|ipctool-mips32|ipctool-arm64)$ {
    proxy_pass http://openipc.org;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_hide_header Strict-Transport-Security;
}

# Only the upload and identify, as on the origin's port 80. The Club is not
# answered over plain HTTP: its session cookie would cross the wire in clear.
location = /api/v1/reports {
    include snippets/openipc-reports-proxy.conf;
    client_max_body_size 300m;
}

# ipctool's output and nothing else, so the origin's own limit for it
# (sites-available/org.openipc, `location = /api/v1/boards/identify`), not
# the report's.
location = /api/v1/boards/identify {
    include snippets/openipc-reports-proxy.conf;
    client_max_body_size 256k;
}
