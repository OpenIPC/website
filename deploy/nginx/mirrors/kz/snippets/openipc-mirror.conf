# What a mirror is: everything goes to openipc.org, carrying the reader's own
# address, and the origin decides everything else.
#
# Shared by both names on this host because the difference between them is one
# redirect, not a different proxy. Anything that has to match the origin --
# the body limit, the forwarded headers, the upgrade -- is here once, so the
# two vhosts cannot drift apart the way `rf.openipc` drifted from `ru.openipc`
# on natrium and spent months sending anonymous traffic (#145).

# The Open Wall's frame channel. Separate from `location /` only because a
# socket needs three things an ordinary proxied request does not, and a prefix
# location inherits nothing from a sibling.
location ^~ /api/v1/wall/ {
    proxy_pass https://openipc.org;

    # Without these the handshake degrades in silence: nginx forwards the
    # request over HTTP/1.0, which cannot carry an `Upgrade`, so the origin
    # answers an ordinary 404 and the reader gets a wall of test cards with
    # nothing in any log to say why. That was the state of this mirror from
    # the day the wall started using a channel until this host replaced it.
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_ssl_server_name         on;
    proxy_ssl_name                openipc.org;
    proxy_ssl_verify              on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth        3;

    # A socket is idle most of its life: the frames arrive in a burst and then
    # nothing. The default 60s read timeout would close it mid-session and the
    # reader would lose the rest with no error.
    proxy_buffering    off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    # One header, not two. The origin sends its own HSTS on the responses it
    # generates; the server block below adds one for the responses this host
    # generates, and browsers are entitled to be confused by a request that
    # carries both.
    proxy_hide_header Strict-Transport-Security;
}

location / {
    proxy_pass https://openipc.org/;

    # Who actually arrived. `$proxy_add_x_forwarded_for` appends rather than
    # overwrites, which is what makes the chain trustworthy at the other end:
    # a forged `X-Forwarded-For: 8.8.8.8` arrives as "8.8.8.8, <real address>"
    # and the origin's `real_ip_recursive on` walks past every address it
    # trusts to the first it does not.
    #
    # The origin must also list this host in `set_real_ip_from`
    # (deploy/nginx/nginx.conf) or none of this is read: every reader behind
    # this mirror collapses onto one address, in the logs and in every rate
    # limit.
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The origin hosts several sites on one address, so it needs the name in
    # the TLS handshake, and its certificate is checked rather than assumed.
    proxy_ssl_server_name         on;
    proxy_ssl_name                openipc.org;
    proxy_ssl_verify              on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_verify_depth        3;

    # nginx talks HTTP/1.0 upstream by default, which costs a connection per
    # request and breaks anything streamed.
    proxy_http_version 1.1;

    proxy_hide_header Strict-Transport-Security;
}
