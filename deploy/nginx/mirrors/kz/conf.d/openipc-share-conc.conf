# The share names' connection budget (sites-available/cloud.openipc.share).
#
# Every camera with a live share holds one socket to the relay for as long as
# it has one, and every guest page holds one while it sets up. Each is two of
# nginx's connections, one each way, and this host has one worker with
# worker_connections 768 for everything it serves -- the openipc.kz and
# openipc.cloud mirrors too. So the share names get a bound of their own that
# fits here: 250 sockets in all (500 connections, leaving the rest for the
# mirrors), and 50 from any one address, which a site with many cameras behind
# one NAT stays under. The origin's budget for the same names is larger
# because its host has the room; it is not this host's.
limit_conn_zone $binary_remote_addr zone=share_perip:10m;
limit_conn_zone $server_name zone=share_total:1m;
