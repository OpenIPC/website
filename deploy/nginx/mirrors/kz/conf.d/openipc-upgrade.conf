# The WebSocket upgrade map, for the Open Wall's frame channel.
#
# `Connection` is a hop-by-hop header: a proxy is supposed to consume it, not
# relay it, so nginx needs telling. This map sends `Connection: upgrade` when
# the client asked for one and `Connection: close` otherwise -- passing a bare
# `$http_upgrade` through would put an empty `Connection:` on every ordinary
# request.
#
# It lives at http level because a map cannot be declared inside a server, and
# in conf.d because Ubuntu's nginx.conf already carries
# `include /etc/nginx/conf.d/*.conf;`.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The same, for an upstream that keeps its connections: an ordinary request
# sends no `Connection` header at all, so the pooled connection to the origin
# stays open for the next one. `close` there would cost every request a new
# TCP and TLS handshake to the origin -- measured from this host at 0.26 s
# before the request is even sent, on each of the share page's requests.
map $http_upgrade $connection_upgrade_keepalive {
    default upgrade;
    ''      "";
}
