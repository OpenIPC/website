user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	# Stock Debian, and weaker than what is actually served: each vhost sets
	# `ssl_protocols TLSv1.2 TLSv1.3` of its own, which replaces this for every
	# server block on the host. Tightening it here would change nothing today
	# and is a decision of its own.
	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	# Everything below this line is ours; the rest of this file is Debian's
	# stock nginx.conf.
	#
	# `limit_conn per_subnet 20` is at http level, so it INHERITS into every
	# location that does not declare a limit_conn of its own. On openipc.org
	# that is /wall/, /assets|fonts/, /dl/, /images/, /protected-files/ and the
	# acme-challenge block; the four locations that do declare one -- site_conc,
	# media_conc, snapshot_conc -- replace it rather than add to it.
	#
	# It counts CONNECTIONS, not HTTP/2 streams, which is why a browser pulling
	# eighteen thumbnails over one multiplexed connection counts as one and is
	# never shed by it. What it does catch is a client opening tens of parallel
	# connections. Checked on 2026-09-20: of 3,723 /wall/ requests in four
	# hours, the 292 that were shed came from five addresses taking 45-86 each,
	# and a real page load of sixteen images fetched in parallel returned 200
	# sixteen times.
	#
	# The key is a /20, i.e. 4,096 addresses, so the three mirrors each count as
	# one client. They took no 429s in that window.
	limit_conn_zone $binary_remote_addr zone=perip:10m;
	limit_conn_zone $binary_remote_addr/20 zone=per_subnet:10m;
	limit_conn per_subnet 20;
	limit_conn_status 429; # 429 Too Many Requests

	# Defined and never used: nothing references per_subnet_rate, here or in any
	# vhost. Left in place rather than removed -- the zone costs 10m of shared
	# memory and is the obvious handle for the per-IP rate limit issue #147
	# wants on firmware assembly, which cannot be written until the mirrors send
	# X-Forwarded-For (#145) and $binary_remote_addr stops meaning "a mirror".
	limit_req_zone $binary_remote_addr/16 zone=per_subnet_rate:10m rate=10r/s;
	limit_req_status 429;


	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}


