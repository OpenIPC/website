user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
	# Raised from Debian's stock 768 for the Open Wall's frame channel
	# (2026-09-23). A proxied WebSocket costs TWO slots per worker -- one to
	# the client, one to Puma -- and it holds them for the life of the
	# connection rather than the life of a request, which is what everything
	# else here was sized for.
	#
	# Peak concurrency on the wall is three readers, measured, so this is not
	# about today's numbers: it is that the old ceiling was 384 simultaneous
	# sockets per worker and the failure at that ceiling is nginx refusing
	# connections site-wide, not just on the wall.
	worker_connections 4096;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	# Stock Debian, and weaker than what is actually served: each vhost sets
	# `ssl_protocols TLSv1.2 TLSv1.3` of its own, which replaces this for every
	# server block on the host. Tightening it here would change nothing today
	# and is a decision of its own.
	ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3; # Dropping SSLv3, ref: POODLE
	ssl_prefer_server_ciphers on;

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;
	error_log /var/log/nginx/error.log;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	# Everything below this line is ours; the rest of this file is Debian's
	# stock nginx.conf.
	#
	# THE KEY IS PER ADDRESS, NOT PER SUBNET, despite the zone name. nginx does
	# no CIDR masking in a limit_conn_zone key: `$binary_remote_addr/20` is the
	# binary address with the literal characters "/20" appended, so every address
	# gets its own counter and the suffix is decoration. The names are kept only
	# because renaming a zone is a change to what runs; read them as per_addr.
	#
	# CONCURRENT HTTP/2 STREAMS EACH TAKE A SLOT. They are not one connection for
	# this purpose. Measured against production on 2026-09-20 with transfers held
	# open: 12 concurrent -> 0 shed, 20 -> 0 shed, 30 -> 9 shed. The cap binds at
	# about twenty in-flight requests from one address.
	#
	# That is why /wall/ and /assets|fonts/ below declare limits of their own.
	# The Open Wall renders sixteen thumbnails, and with stylesheets, fonts and
	# the favicon a cold first visit is close enough to twenty that a browser
	# could shed its own images -- static files served by sendfile, competing for
	# slots meant to bound how many expensive renders Rails is asked for at once.
	# A location that declares a limit_conn REPLACES this one rather than adding
	# to it, which is how those two escape.
	# Recover the real client address from the mirrors (#145).
	#
	# openipc.ru and openipc.kz proxy to this origin, so without this every
	# visitor behind one of them arrives as the mirror's own address: on
	# 2026-09-19, when openipc.eu was still a proxy too, that was 33,253
	# requests from three addresses. Logging,
	# Snapshot#ip_address, the credentials.ip.whitelisted bypass and every
	# limit_conn above were all keyed on "a mirror" rather than on a person.
	#
	# Both send X-Forwarded-For with $proxy_add_x_forwarded_for, which
	# APPENDS. Verified end to end by sending a request through each and reading
	# what arrived here, including one carrying a forged header: a client that
	# sends `X-Forwarded-For: 8.8.8.8` reaches us as "8.8.8.8, <its real
	# address>", because the mirror appends what it actually saw. The forged
	# part is never last, which is what makes trusting this safe.
	#
	# recursive ON, not off. The mirrors proxy to each other -- 2,555 requests
	# through openipc.ru on 2026-09-19 carried openipc.eu's address and 2,534
	# carried openipc.kz's -- so the last entry is often another mirror. With
	# recursive on, nginx walks right to left skipping addresses that are
	# themselves trusted and takes the first that is not, which is the person.
	# With it off we would faithfully record one mirror as the client of
	# another. Where the whole chain is trusted, nothing is untrusted to find
	# and $remote_addr stays the mirror, which is the honest answer.
	#
	# This runs in the post-read phase, before the limit_conn directives below,
	# so those now bound a real client instead of a whole country.
	set_real_ip_from 194.58.109.202;   # openipc.ru, опенипц.рф
	set_real_ip_from 194.238.42.216;   # openipc.kz, openipc.cloud
	set_real_ip_from 87.199.131.93;    # openipc.kz, openipc.cloud -- retiring
	#
	# Two addresses for the same two names on purpose: 194.238.42.216 is the
	# host taking them over (deploy/nginx/mirrors/kz/) and 87.199.131.93 is the
	# one being left behind. The new address is trusted BEFORE the A records
	# move, because a mirror whose X-Forwarded-For is not read collapses every
	# reader behind it onto one address in the logs and in every limit_conn --
	# the exact fault #145 was filed to fix, and it would arrive the instant
	# the switch happened. The old line comes out once nothing proxies from
	# there, by the rule below, and not a moment earlier.
	#
	# 2.29.12.216 was the third entry until 2026-09-21: the openipc.eu edge.
	# That name was folded onto this host -- sites-available/eu.openipc answers
	# it here -- and the edge's own vhost now returns a 301 instead of
	# proxying, so it sends no X-Forwarded-For at all. Measured over 150
	# seconds immediately after that change: 15 requests from it, every one its
	# own collectd monitoring with xff="-", not one proxied client. The line
	# went with the last of them, and deliberately not before -- while it was
	# still proxying, dropping it would have collapsed every visitor behind it
	# onto one address and one limit_conn bucket, which is the fault #145 was
	# filed to fix.
	#
	# The general rule it leaves behind: a trusted address that no longer
	# proxies for us is an address whose X-Forwarded-For we would believe from
	# whoever holds it next, so the line comes out the moment the proxying
	# stops, and never while it continues.
	real_ip_header   X-Forwarded-For;
	real_ip_recursive on;

	limit_conn_zone $binary_remote_addr zone=perip:10m;
	limit_conn_zone $binary_remote_addr/20 zone=per_subnet:10m;
	limit_conn per_subnet 20;
	limit_conn_status 429; # 429 Too Many Requests

	# The status every limit_req in conf.d and the vhosts answers with. The
	# zones themselves live next to the thing they protect: see
	# conf.d/openipc-firmware-rate.conf, which is the first and so far only
	# user of limit_req on this host.
	#
	# A per_subnet_rate zone sat here unreferenced for a while, kept as the
	# handle #147 would eventually need. It is gone: 10r/s was never the right
	# rate for firmware assembly, and its /16 suffix was string concatenation
	# rather than a netmask, so it was per address anyway.
	limit_req_status 429;


	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}


