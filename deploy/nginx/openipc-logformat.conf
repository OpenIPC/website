# Access log format for openipc.org and its siblings (2026-09-19, issue #143).
#
# Stock `combined` records nothing about caching or timing, so "what is the hit
# ratio on /" and "how long did Rails actually take" could not be answered from
# the log at all -- which made every later change in the migration epic
# unmeasurable. The 2026-09-19 front-page 429 incident had to be diagnosed by
# counting statuses by hand for exactly this reason.
#
# The four added fields are APPENDED and LABELLED, never inserted. Existing awk
# over this log keys on position -- $1 remote_addr, $7 path, $9 status, $10
# body_bytes_sent -- and that must keep working across the change, because a
# day's log spans both formats on the day it lands. Anything past field 10 was
# already unparseable by column ($http_referer and $http_user_agent are quoted
# and contain spaces), so the new fields carry key= labels and are read with
# `grep -oP`, not by field number.
#
# xff is quoted because X-Forwarded-For is a comma-separated list, and urt
# because $upstream_response_time is "0.001, 0.002" when a request touches more
# than one upstream. cache= and rt= are single tokens and need no quoting.
#
# xff also settles an open question from the 2026-08-25 mirror analysis: whether
# openipc.ru / openipc.kz / openipc.eu send X-Forwarded-For at all. Until that
# is known set_real_ip_from cannot be written, and no per-IP rule can be
# targeted at anything but a whole mirror (see #145).
log_format openipc '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                   'xff="$http_x_forwarded_for" cache=$upstream_cache_status '
                   'rt=$request_time urt="$upstream_response_time"';
