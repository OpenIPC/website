# The board catalogue's search (/api/v1/boards/search, firmware#659). Each
# query scans every U-Boot console and note line by line -- cheap at a few
# thousand lines, but a script asking for every three-letter string is not a
# reader. The page waits for typing to pause, so a person stays far below
# one a second.
limit_req_zone $binary_remote_addr zone=boards_search:5m rate=60r/m;

# The board files' own concurrency cap. The gallery asks for about eighty
# thumbnails at once; counted in per_subnet, like everything else, they left
# no room for the page's fonts, which /fonts/ caps at that zone's 20 -- found
# on dev as a 429 on ibm-plex-sans-latin-500-normal.woff2. A location that
# declares a limit_conn replaces the inherited one, so /board-files/ counts
# here and nowhere else.
limit_conn_zone $binary_remote_addr zone=board_files:10m;
