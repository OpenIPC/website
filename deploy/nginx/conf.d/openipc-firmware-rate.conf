# Rate limits for firmware assembly (#147).
#
# `download_full_image` is the most expensive request on this site. On a cache
# miss it reads two release tarballs and writes an 8-32MB image into
# /srv/www/shared/files -- about a second of CPU and a disk write -- and until
# now nothing bounded how often one address could ask for it. A cache hit is
# cheap, and so is every error: of the 1,695 requests in the fifteen days to
# 2026-09-20, 297 were redirects away from a firmware that does not exist and
# built nothing at all.
#
# Legitimate volume is 113 requests a day.
#
# The numbers below come from that log rather than from the shape of the
# problem, because the obvious limit is the wrong one here. Only 882 of those
# 1,695 requests were a plain 200; 389 were 206 and 68 were 304. A 16-32MB
# image over a slow link gets resumed and fetched in parallel chunks, and every
# single minute in which one address made more than six requests turned out to
# be one URL being ranged -- worst case 30 requests for one file in one minute,
# 28 of them 206. The 6r/m this issue originally proposed would have answered
# 24 of those with 429 and broken the download.
#
# So the limit is in two parts.

# fw_start counts only requests that arrive WITHOUT a Range header: the ones
# that can start a download, and the ones an enumerator would send. 99.4% of
# the real minutes in that fortnight carry at most four. An empty key is not
# accounted by limit_req, which is how the range requests opt out.
map $http_range $firmware_start {
    ""      $binary_remote_addr;
    default "";
}
limit_req_zone $firmware_start zone=fw_start:1m rate=12r/m;

# fw_all counts everything, ranges included, and exists so that setting a Range
# header is not a way round fw_start. It sits above every minute real traffic
# has ever produced: the 30-request resume above fits inside its burst, and a
# client would have to beat the busiest minute in fifteen days to feel it.
limit_req_zone $binary_remote_addr zone=fw_all:1m rate=60r/m;

# Neither of these bounds disk growth, and they should not be read as if they
# did. 60 misses a minute is still ~1GB of images a minute, against 40GB free
# and a prune that runs nightly at -mtime +14. What they bound is Rails: one
# address can no longer occupy the workers that assemble firmware. The disk
# needs a cap on the cache itself, which is not this change.
