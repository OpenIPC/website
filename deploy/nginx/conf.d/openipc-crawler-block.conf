# Crawlers refused at the edge (#234).
#
# The test is not "is it a bot" -- Googlebot is a bot and is welcome. It is
# whether a crawler has ever sent a reader. Measured over the fourteen days of
# log the host retains, referrals against requests:
#
#              requests   referrals          requests   referrals
#   Google        --       18,166     Ahrefs     1,012        0
#   Yandex        --          813     Semrush    1,477        0
#   bing          --          649     MJ12bot    2,284        0
#   Baidu         --          576     DotBot       224        0
#   DuckDuckGo    --          437     SofyaBot     610        0
#                                     Velen         96        0
#
# The left column is why robots.txt and #179's search-console work exist. The
# right column is five thousand requests for nothing, from tools that sell
# backlink reports to other people.
#
# Nothing here is a judgement about a crawler's purpose. A crawler that starts
# sending readers should come out of this map, and the referral column is how
# that is checked.
map $http_user_agent $openipc_blocked_crawler {
    default 0;

    # meta-externalagent (Meta AI-training) crawled the Open Wall in violation
    # of robots.txt at >50% of all traffic during the 2026-08/09 scrape wave.
    # facebookexternalhit (link previews) is a different agent and stays
    # allowed.
    ~*meta-externalagent 1;

    # SEO backlink tools. They index the site to sell a report about it to
    # somebody else; the visitor who reads that report never arrives here.
    ~*AhrefsBot          1;
    ~*SemrushBot         1;
    ~*MJ12bot            1;
    ~*DotBot             1;
    ~*SofyaBot           1;
    ~*VelenPublicWebCrawler 1;

    # The Open Wall scraper, which is the largest of the lot and the only one
    # that is not a crawler at all.
    #
    # 2,795 distinct addresses share this one user agent in a single day, and
    # what they fetch is ActiveStorage snapshot representations -- the exact
    # traffic #146 moved to plain files, still arriving at the old URLs. A
    # residential-proxy population, so no address-based rule reaches it, and
    # the agent string is the only thing they have in common.
    #
    # Anchored. `~*crawler` alone would also match ClaudeBot, PetalBot and
    # anything else with the word in it, which is a decision this map is
    # deliberately not making here.
    "~*^Mozilla/5\.0 \(compatible; crawler\)$" 1;
}

# Deliberately NOT blocked, and each for its own reason.
#
# HeadlessChrome. 2,636 requests in a day from 62.238.81.167 -- which is the
# project's own build host. These are our Playwright checks and screenshot
# runs (tools/whatnext-check.mjs, tools/shot.mjs and the rest), loading real
# pages with their assets exactly as a reader's browser would. #234 lists "a
# headless Chrome at 2,568" among the crawlers worth naming; it is us.
#
# The LLM crawlers -- Anthropic (1,006/day), OpenAI (591), Perplexity (785).
# They do send some traffic back: chatgpt.com already appears as a referrer
# here and on the wiki. The trade is real in both directions and belongs to
# whoever owns the project's position on it, not to this file. Adding any of
# them is one line.
#
# The Chinese crawlers -- YisouSpider (7,944 over fourteen days), Sogou
# (3,508), Bytespider (3,160), PetalBot (1,640). By the referral test they
# belong in the map: 5, 2 and 1 referrals between them. But Chinese is the
# largest locale by traffic on this site, these are the search engines that
# audience uses, and blocking them forecloses a market the project has barely
# entered. Baidu is kept for exactly that reason and it does send readers, so
# the mechanism works there. Same shape of decision as the LLM crawlers, and
# named here rather than taken.
