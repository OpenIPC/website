# Which process answers each application surface, and whether the camera
# upload is frozen (#287, #304).
#
#   upload        POST /snapshots                     -- the cameras' frozen contract
#   wall          /api/v1/wall/*.json                 -- the wall's pages as data, and their grants
#   firmware      .../download_full_image             -- full flash images and their stats
#   availability  /api/v1/hardware/availability.json  -- what upstream publishes per SoC
#   socket        /api/v1/wall/socket                 -- the frame socket
#
# All five are the Go service's: Rails, which answered them until #287 moved
# them one by one, is gone (#304). What is left of the switch is the upload's
# `freeze` -- cameras are answered 503 and retry on their next cron -- for the
# minute of a database restore or a migration that must not race an upload.
#
# The state lives in /etc/nginx/openipc-routes/, one file per environment,
# written only by `openipc-route` (deploy/route.sh) and never by push-nginx.sh.
# Each file defines $openipc_route_<env>_<surface>; any value but `freeze` means
# the Go process, so a state file written before Rails was deleted -- `rails`,
# `shadow` -- routes to Go rather than to a port nothing listens on.

include /etc/nginx/openipc-routes/*.conf;


# --- prod: Go web on 3002, Go firmware on 3003 ---

map $openipc_route_prod_upload $openipc_up_prod_upload {
    default 127.0.0.1:3002;
}
map $openipc_route_prod_upload $openipc_by_prod_upload {
    freeze  nginx;
    default go;
}
map $openipc_route_prod_wall $openipc_up_prod_wall {
    default 127.0.0.1:3002;
}
map $openipc_route_prod_wall $openipc_by_prod_wall {
    freeze  nginx;
    default go;
}
map $openipc_route_prod_firmware $openipc_up_prod_firmware {
    default 127.0.0.1:3003;
}
map $openipc_route_prod_firmware $openipc_by_prod_firmware {
    freeze  nginx;
    default go;
}
map $openipc_route_prod_availability $openipc_up_prod_availability {
    default 127.0.0.1:3003;
}
map $openipc_route_prod_availability $openipc_by_prod_availability {
    freeze  nginx;
    default go;
}
map $openipc_route_prod_socket $openipc_up_prod_socket {
    default 127.0.0.1:3002;
}
map $openipc_route_prod_socket $openipc_by_prod_socket {
    freeze  nginx;
    default go;
}
map $openipc_route_prod_upload $openipc_freeze_prod_upload {
    freeze  1;
    default "";
}

# --- dev: Go web on 3012, Go firmware on 3013 ---

map $openipc_route_dev_upload $openipc_up_dev_upload {
    default 127.0.0.1:3012;
}
map $openipc_route_dev_upload $openipc_by_dev_upload {
    freeze  nginx;
    default go;
}
map $openipc_route_dev_wall $openipc_up_dev_wall {
    default 127.0.0.1:3012;
}
map $openipc_route_dev_wall $openipc_by_dev_wall {
    freeze  nginx;
    default go;
}
map $openipc_route_dev_firmware $openipc_up_dev_firmware {
    default 127.0.0.1:3013;
}
map $openipc_route_dev_firmware $openipc_by_dev_firmware {
    freeze  nginx;
    default go;
}
map $openipc_route_dev_availability $openipc_up_dev_availability {
    default 127.0.0.1:3013;
}
map $openipc_route_dev_availability $openipc_by_dev_availability {
    freeze  nginx;
    default go;
}
map $openipc_route_dev_socket $openipc_up_dev_socket {
    default 127.0.0.1:3012;
}
map $openipc_route_dev_socket $openipc_by_dev_socket {
    freeze  nginx;
    default go;
}
map $openipc_route_dev_upload $openipc_freeze_dev_upload {
    freeze  1;
    default "";
}
