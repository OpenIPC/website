# Which process answers each surface that is moving off Rails (#287).
#
# Three surfaces, per environment:
#
#   upload    POST /snapshots             -- the cameras' frozen contract
#   wall      /api/v1/wall/*.json         -- NOT /api/v1/wall/cable, which stays on Rails
#   firmware  .../download_full_image     -- full flash images and their stats
#
# Each one is `rails` or `go`, and the upload has two more states: `freeze`
# answers cameras 503 for the minute of a cutover (they retry on their next
# cron), and `shadow` keeps Rails answering while nginx mirrors every upload to
# the shadow Go process, which decides the same request into its own database
# so the two sets of decisions can be compared (deploy/shadow-report.sh).
#
# The state is NOT in this repository. It lives in /etc/nginx/openipc-routes/,
# one file per environment, written only by `openipc-route` (deploy/route.sh):
# flipping a surface, and rolling it back, is that command -- one file, nginx -t,
# a reload, about a second -- not a pull request. push-nginx.sh never touches
# those files and creates them, all-Rails, if they are missing.
#
# Each state file defines $openipc_route_<env>_<surface>; everything below
# derives from it, so the vhosts never name a port for these surfaces.

include /etc/nginx/openipc-routes/*.conf;

# --- production: Rails on 3000, Go web on 3002, Go firmware on 3003 --------

map $openipc_route_prod_upload $openipc_up_prod_upload {
    go      127.0.0.1:3002;
    default 127.0.0.1:3000;
}
map $openipc_route_prod_upload $openipc_by_prod_upload {
    go      go;
    freeze  nginx;
    default rails;
}
map $openipc_route_prod_upload $openipc_freeze_prod_upload {
    freeze  1;
    default "";
}
map $openipc_route_prod_upload $openipc_shadow_prod_upload {
    shadow  1;
    default "";
}
map $openipc_route_prod_wall $openipc_up_prod_wall {
    go      127.0.0.1:3002;
    default 127.0.0.1:3000;
}
map $openipc_route_prod_wall $openipc_by_prod_wall {
    go      go;
    default rails;
}
map $openipc_route_prod_firmware $openipc_up_prod_firmware {
    go      127.0.0.1:3003;
    default 127.0.0.1:3000;
}
map $openipc_route_prod_firmware $openipc_by_prod_firmware {
    go      go;
    default rails;
}

# --- dev: Rails on 3001, Go web on 3012, Go firmware on 3013 ---------------

map $openipc_route_dev_upload $openipc_up_dev_upload {
    go      127.0.0.1:3012;
    default 127.0.0.1:3001;
}
map $openipc_route_dev_upload $openipc_by_dev_upload {
    go      go;
    freeze  nginx;
    default rails;
}
map $openipc_route_dev_upload $openipc_freeze_dev_upload {
    freeze  1;
    default "";
}
map $openipc_route_dev_wall $openipc_up_dev_wall {
    go      127.0.0.1:3012;
    default 127.0.0.1:3001;
}
map $openipc_route_dev_wall $openipc_by_dev_wall {
    go      go;
    default rails;
}
map $openipc_route_dev_firmware $openipc_up_dev_firmware {
    go      127.0.0.1:3013;
    default 127.0.0.1:3001;
}
map $openipc_route_dev_firmware $openipc_by_dev_firmware {
    go      go;
    default rails;
}

# The primary's decision on each upload, written only while shadowing, keyed by
# the request id both backends were given. $upstream_status is what Rails
# answered -- even when the camera hung up and nginx logs 499 -- and is "-"
# when nginx answered itself (408, 413) and no backend saw the request. The
# Location names the row Rails stored, so deploy/shadow-report.sh can compare
# it with the shadow's.
log_format openipc_upload_decision '$time_iso8601 $request_id $upstream_status $upstream_http_location';
