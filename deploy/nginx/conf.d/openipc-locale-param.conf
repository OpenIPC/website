# `?locale=ru` and `?locale=zh` on a page, sent to the page in that language.
#
# The Rails site named the language in a parameter, and the search engines
# still hold those addresses: on 2026-10-08 Google had 110 of openipc.org's
# 671 URLs with impressions carrying a query string, and
# /cameras/vendors/sigmastar/socs/ssc30kq?locale=ru alone earned 35 clicks in
# four weeks. The bundle ignores the parameter, so every one of those readers
# got the English page, and its canonical told the engine the English page
# was the one to keep. The home page's script has always turned `/?locale=ru`
# into `/ru` (frontend/apps/site/src/pages/index.astro); this does the same
# for every page, before a byte of the wrong language is sent.
#
# Only a read, only a language the site publishes, only an address without a
# language of its own, and only a page: a name with a dot is a file. Anything
# else on the query string goes along. Behind openipc.ru the Location is
# rewritten by the mirror like every other redirect, so a reader there stays
# there.
#
# Built from $request_uri and $args, never $uri: $uri is decoded, and a
# decoded %0d%0a in a Location header is a header of the requester's choosing.
#
# The Open Wall's own `?locale=` is conf.d/openipc-wall-shell.conf's, in
# locations of its own; this is applied in the seam's `location /` only.

# The path to localise: "/" for the home page, the path for any other page,
# and empty for an address that already names its language or is a file.
# Regexes are tried in order, so the home page is decided first.
map $request_uri $openipc_lp_path {
    default                             "";
    "~^/(?:\?.*)?$"                     "/";
    "~^/(?:ru|zh)(?:[/?]|$)"            "";
    "~^[^?]*\."                         "";
    "~^(?<openipc_lp_p>/[^?]*)"         $openipc_lp_p;
}

# The query string without `locale`, with its `?`, or nothing at all.
map $args $openipc_lp_args {
    default                                         "?$args";
    ""                                              "";
    "~^locale=[^&]*$"                               "";
    "~^locale=[^&]*&(?<openipc_lp_rest>.+)$"        "?$openipc_lp_rest";
    "~^(?<openipc_lp_pre>.*?)&locale=[^&]*(?<openipc_lp_post>&.*)?$"  "?$openipc_lp_pre$openipc_lp_post";
}

# Only where the route map (conf.d/openipc-redirects.conf) has nothing of its
# own to say: a page, or an address nothing claims. An address it redirects or
# retires is answered by it first, and a `?locale=` the redirect carries along
# is honoured on the next request -- /about?locale=zh goes to
# /community?locale=zh and from there to /zh/community.
map $openipc_route_action $openipc_lp_routable {
    default     "";
    page        1;
    catchall    1;
}

map "$request_method:$openipc_lp_routable:$arg_locale:$openipc_lp_path" $openipc_locale_param_target {
    default                                                             "";
    "~^(?:GET|HEAD):1:(?<openipc_lp_l>ru|zh):/$"                        "/$openipc_lp_l$openipc_lp_args";
    "~^(?:GET|HEAD):1:(?<openipc_lp_l>ru|zh):(?<openipc_lp_q>/.+)$"     "/$openipc_lp_l$openipc_lp_q$openipc_lp_args";
}
