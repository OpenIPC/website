# Which shell file answers an Open Wall address (#165).
#
# Every wall address except `/open-wall` itself carries an id that changes by
# the hour -- a page of the gallery, a camera permalink, a snapshot, its
# archive, its slideshow -- so none of them can be a file at its own address.
# They are served from one shell per locale instead, and the island on it reads
# `location.pathname` to learn which page it is.
#
# A map rather than a capture in the location, because `try_files` takes a path
# and the locale has to be chosen before it: nginx has no way to say "the shell
# next to whatever prefix matched" inside try_files itself.
#
# The default is the English shell, which is also what an unprefixed address
# gets. There are three locales and the two prefixed ones are named; anything
# else has no locale prefix by definition.
map $uri $wall_shell {
    default     /_shell/wall/index.html;
    ~^/ru/      /ru/_shell/wall/index.html;
    ~^/zh/      /zh/_shell/wall/index.html;
}

# And the gallery, which IS a page of its own in the bundle -- but cannot be
# reached by the catch-all, because a regex location beats a prefix one and the
# Rails wall location below claims `/open-wall` too. So it is named here for the
# same reason and served the same way.
map $uri $wall_gallery {
    default     /open-wall/index.html;
    ~^/ru/      /ru/open-wall/index.html;
    ~^/zh/      /zh/open-wall/index.html;
}

# And only for a read.
#
# `try_files` serves a file to whatever method asked for it: nginx's static
# handler answers POST as readily as GET. On these addresses that would take a
# POST that Rails has always answered -- with a redirect, or with the upload
# route one character away -- and hand it a page instead, silently. So a method
# that is not a read is pointed at a path that cannot exist, misses, and falls
# through to @fallback, which is where it went before any of this.
#
# A sentinel rather than an empty string: an empty try_files element tests the
# root directory, which is a directory rather than a file and therefore misses
# too, but by accident and not on purpose.
map $request_method $wall_shell_read {
    default   /_shell/never;
    GET       $wall_shell;
    HEAD      $wall_shell;
}

map $request_method $wall_gallery_read {
    default   /_shell/never;
    GET       $wall_gallery;
    HEAD      $wall_gallery;
}

# The gallery's older address (#165).
#
# `/open-wall` is what the navbar, the footer and the sitemap use; `/snapshots`
# is an alias for the same page and is still fetched 656 times a day. A 301
# retires it for a reader without a render, and leaves one canonical address
# rather than two that answer alike.
map $uri $snapshots_alias {
    default     /open-wall;
    ~^/ru/      /ru/open-wall;
    ~^/zh/      /zh/open-wall;
}

# `?locale=` names the language when the path does not, and it is the older
# contract -- Rails answers /snapshots?locale=ru with the Russian page. Keyed
# before the path, or a reader following one of those links lands on the
# English gallery permanently. Anything that is not a language this site
# serves leaves the path to decide, which is what the page itself does with an
# unserved `?locale=`.
map $arg_locale $snapshots_alias_asked {
    default     "";
    en          /open-wall;
    ru          /ru/open-wall;
    zh          /zh/open-wall;
}

map $snapshots_alias_asked $snapshots_target {
    default     $snapshots_alias_asked;
    ""          $snapshots_alias;
}

# And only for a read. POST /snapshots is how a camera uploads a frame: a
# location that redirected every method would 301 the upload away, and the
# camera -- firmware in the field, not upgradable -- would follow it to a page.
# Anything that is not a read gets no alias and falls through to Rails, which
# is where the upload has always been handled.
map $request_method $snapshots_alias_read {
    default     "";
    GET         $snapshots_target;
    HEAD        $snapshots_target;
}
