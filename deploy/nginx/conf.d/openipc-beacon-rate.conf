# Rate limit for the analytics beacon (#181).
#
# The beacon is the one endpoint on this site a flood can reach without
# executing JavaScript: it is a plain GET with a query string, so anything that
# can read the page source can replay it.
#
# GoatCounter enforces its own per-address limit of 4 counts a second and
# answers 429 itself -- measured, not assumed: a burst of twelve arriving in
# one second came back with eight 429s carrying urt="0.002", meaning they
# reached the Go process and it refused them. So this zone is not what keeps a
# replayer honest, and it is deliberately looser than GoatCounter's limit
# rather than tighter. Its job is to stop a flood reaching the process at all,
# because 2ms of Go per request is still a core at a few thousand a second.
#
# 120r/m with a burst of 20: twice what a person clicking through pages can
# sustain, and twenty in hand for someone comparing SoC pages quickly, so this
# never becomes the thing that loses a real page view. Anything above it is
# already past GoatCounter's own gate.
limit_req_zone $binary_remote_addr zone=beacon:5m rate=120r/m;

# The dashboard vhost (analytics.openipc.org). Separate from the beacon zone
# above because they protect different things: that one keeps a flood off the
# counting endpoint, this one fronts a login. GoatCounter limits logins to 20 a
# minute per address itself; this is the cheaper gate before its Go handler.
limit_req_zone $binary_remote_addr zone=dashboard:5m rate=120r/m;
