# The WebSocket upgrade map, for the Open Wall's frame channel.
#
# nginx has to be told, per connection, whether to pass the Upgrade through:
# `Connection: upgrade` when the client asked for one, `Connection: close`
# otherwise. Hard-coding `Connection "upgrade"` instead would break every
# ordinary request that happens to reach the same location.
#
# Nothing in this configuration proxied a WebSocket before 2026-09-23 -- no
# `proxy_http_version 1.1` anywhere, so every upstream connection spoke
# HTTP/1.0, which cannot carry an Upgrade at all.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
