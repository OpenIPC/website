    "~^[A-Z]+ /fonts/"                                                                                        "page";  # public/fonts
    "~^[A-Z]+ /assets/"                                                                                       "410";  # the asset pipeline
    "~^[A-Z]+ /assets(?:\\b|/*$|/)"                                                                           "410";  # ANY /assets
    "~^[A-Z]+ /api/v1/wall/socket/*$"                                                                         "page";  # the frame socket
