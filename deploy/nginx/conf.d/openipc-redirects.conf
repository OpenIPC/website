# The site's route table for everything that is not a page or a service
# address: redirects, retired addresses and the catch-all (#302, #304).
# Maintained here by hand; service/deploytest checks it.
#
# For the vhosts' `location @fallback` to answer. Keyed on "$request_method $uri",
# first match wins, in the router's own order.
#
#   page      a page the static bundle serves; reaching the fallback means
#             the bundle does not hold it, which is a 404
#   301 302   a redirect to $openipc_route_target
#   410       retired
#   catchall  nothing claims it: 302 to the home page in its language

map "$request_method $uri" $openipc_route_action {
