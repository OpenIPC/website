# The Open Wall scraper's address space, refused at the edge.
#
# WHAT THIS IS. A fleet that fetches snapshot PAGES -- not the pictures. Over
# eight hours on 2026-09-22 it made 9,623 requests from 272 addresses: 9,352
# snapshot pages, 171 other pages, 51 images, one stylesheet and one JavaScript
# file. At a mean 68 KB a page that is about 620 MB of HTML, and the show page
# alone was 617 MB of the roughly 1.7 GB the site served in that window -- the
# largest single item on it.
#
# HOW IT IS RECOGNISED. Not by user agent: its three commonest are the SAME
# string -- Chrome/133.0.0.0 -- on macOS, Windows and Linux, at 2,087 / 2,071 /
# 2,022 requests, an even three-way split no real audience produces. What it
# cannot disguise is where it runs from. Every range below is Microsoft Azure,
# and the figure beside each is its requests in that window.
#
# WHY IT IS SAFE. The beacon is the test. Across fourteen days of log, not one
# of these ranges has ever carried a client that executed the page JavaScript
# -- zero beacon hits from all 22 -- while the fleet itself managed four across
# its 272 addresses and none at all from Azure. Nobody browses a camera gallery
# from a datacentre. The ranges the fleet shares with real readers (104.238,
# 119.123, 187.19, 43.156, 45.138, 47.79 and eleven more, all residential) are
# deliberately NOT here; those are what the rate limit in
# openipc-snapshot-rate.conf is for.
#
# HOW TO EXTEND IT. Take a /16 from the log, check it against the beacon the
# same way -- if any address in it ever ran the script, it does not belong here
# -- and add a line. Removing one needs no more than the same check coming back
# the other way.
#
# Applied at server level in sites-available/org.openipc, not per location: the
# same fleet probes /.git/config, so this is not a statement about the gallery.
geo $openipc_datacentre_client {
    default 0;

    20.245.0.0/16  1;  # 1,755
    20.237.0.0/16  1;  #   940
    172.184.0.0/16 1;  #   583
    20.253.0.0/16  1;  #   483
    104.42.0.0/16  1;  #   399
    172.185.0.0/16 1;  #   377
    52.190.0.0/16  1;  #   302
    20.66.0.0/16   1;  #   288
    20.228.0.0/16  1;  #   270
    20.59.0.0/16   1;  #   207
    52.225.0.0/16  1;  #   192
    168.62.0.0/16  1;  #   191
    52.160.0.0/16  1;  #   116
    68.220.0.0/16  1;  #    99
    20.168.0.0/16  1;  #    97
    157.56.0.0/16  1;  #    84
    104.210.0.0/16 1;  #    73
    52.241.0.0/16  1;  #    68
    23.100.0.0/16  1;  #    64
    104.40.0.0/16  1;  #    62
    13.83.0.0/16   1;  #    60
    40.112.0.0/16  1;  #    57
}

# What the vhost refuses: a datacentre client, except where the caller is CI.
#
# GitHub-hosted runners are Azure too, and every range above overlaps the
# Actions ranges GitHub publishes. The build push (service/internal/builds/
# PUSH.md) comes from whichever runner the report job lands on, so the block
# refused it at random -- nightly-20260927-60d4cbe from 68.220.61.2 got nginx's
# own 403 while the two pushes the day before, from 20.169 and 172.215, landed.
# That endpoint verifies a GitHub Actions OIDC token itself; the address says
# nothing it does not already know.
#
# Owner reports are sent by AI agents as well as people, and an agent may run
# in a cloud; the upload is limited per address by the web role itself.
#
# An exact key wins over a regex in a map, so the push is looked up first.
map "$openipc_datacentre_client:$uri" $openipc_datacentre_refused {
    default 0;

    "1:/api/v1/builds" 0;
    "1:/api/v1/reports" 0;
    "1:/api/v1/boards/identify" 0;
    # ipctool's release job pushes from a GitHub runner, which is Azure too.
    "1:/api/v1/tools/ipctool" 0;
    "1:/api/v1/tools/ipctool-mips32" 0;
    "1:/api/v1/tools/ipctool-arm64" 0;
    ~^1: 1;
}
