# Per-address rate on the snapshot pages (#261).
#
# WHAT IT DOES AND DOES NOT DO. It bounds what any ONE address can walk. It
# does not separate the Azure fleet from readers and was never going to: that
# fleet sits at 14-16 pages a minute per address, which is BELOW the busiest
# real reader measured in the same window. Distributed crawling is what
# openipc-datacentre-block.conf is for; this is the floor under everything
# else -- the single aggressive address, and whatever URL space the next walk
# picks once the ids change again.
#
# THE NUMBER. Snapshot PAGE requests per address per minute over eight hours on
# 2026-09-22, counting only clients that executed the beacon, so only real
# browsers: p50 2, p90 11, p99 46, max 46. The first measurement of this said
# 399 and was wrong -- it matched `/snapshots/` in the Referer of the strip's
# images, which are requests to /wall/ and are governed by their own location.
# Count the request line, never the whole log line.
#
# So: burst 48 clears the busiest real minute (46) on its own with two to
# spare, and the 1 r/s behind it caps a sustained walk at 3,600 an hour per
# address instead of the 15,000 one address managed unthrottled. Keyed on $binary_remote_addr, which is the
# reader and not the mirror -- set_real_ip_from in nginx.conf rewrites it for
# openipc.ru and openipc.cloud before this is evaluated. Without that this
# would pool every mirror visitor onto one key and shed them as a crowd.
#
# 10m of zone is about 160k addresses; the wall saw 16,731 distinct ones in
# eight hours, so this holds a day of them with room.
limit_req_zone $binary_remote_addr zone=snapshot_pages:10m rate=60r/m;
