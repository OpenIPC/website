# Microcache absorbing the 2026-08-30 DDoS of the Open Wall: same anonymous
# pages re-requested ~100x/30min from ~1500 rotating IPs. 60s of staleness on
# a gallery that changes every few minutes is invisible, and one body serves
# every reader instead of one render each.
proxy_cache_path /var/cache/nginx/openipc_micro levels=1:2
                 keys_zone=openipc_micro:10m max_size=500m
                 inactive=10m use_temp_path=off;

# Locale carried in the query, normalised, for the cache key.
#
# /snapshots/<id> has no locale-prefixed form -- the snapshot routes are
# deliberately outside `scope "(:locale)"`, because positional route helpers
# break under it -- so ?locale= is still the only way to carry a language into
# one, and the Open Wall mosaic emits exactly that. Meanwhile that location
# keys its cache on $uri, dropping the query, because the 2026-09-03 flood
# iterated ids with a rotating locale param and keying on the full URI never
# hit.
#
# Those two facts together served the Russian page to English visitors:
#
#   /snapshots/3589409?locale=ru  Accept-Language: en  ->  lang="ru"  MISS
#   /snapshots/3589409            Accept-Language: en  ->  lang="ru"  HIT
#
# The key that uses this must delimit it. Appended straight onto the path,
# /snapshots/123ru with no parameter and /snapshots/123?locale=ru produce the
# same string -- and the first resolves, because the location regex is not
# anchored at the end and MySQL casts "123ru" to 123 -- so anyone could seed
# the Russian entry with an English render. Reproduced on production before
# the delimiters went in. $locale_key comes first and is bracketed, which is
# unambiguous whatever the path contains.
#
# Vary cannot see a query parameter, so honouring it does not help here.
# Normalising to the supported set bounds the key at four variants per id --
# keying on $arg_locale raw would let ?locale=<anything> fragment the cache
# without bound, which is the flood the $uri key was protecting against.
map $arg_locale $locale_key {
    default   "";
    ~^(ru|zh|en)$  $arg_locale;
}
