# Cap concurrent in-flight requests on the per-snapshot pages. A cache hit
# holds a slot for a millisecond, so this only really binds on cache misses:
# at most this many Rails renders run at once, and a botnet stampede gets an
# instant 429 instead of a queue that starves the whole site (2026-09-03).
limit_conn_zone $server_name zone=snapshot_conc:1m;

# Site-wide cap on in-flight proxied requests (2026-09-03, after the second
# flood). Same principle as snapshot_conc: fast responses (assets, cache
# hits) hold a slot for milliseconds, so this binds on expensive renders --
# whatever URL space the next enumeration targets, Rails sees a bounded
# number of concurrent requests and the overflow gets an instant 429.
limit_conn_zone $server_name zone=site_conc:1m;

# Separate pool for the image/gallery URL space (2026-09-19). site_conc was
# keyed on $server_name, i.e. ONE global pool of 20 shared by location /, the
# open-wall/snapshots/ActiveStorage block and download_full_image. The gallery
# space is 165k req/day and bursts; it drained the pool and the front page was
# shed as collateral -- 1.5% of all / requests answered 429, every day, which
# is what the external probe finally caught. Splitting it off bounds the burst
# to its own URL space. Sizing: media_conc 12 + site_conc 10 + snapshot_conc 10
# = 32 = Puma capacity here (2 workers x 16 threads), so the pools together can
# saturate Rails exactly once and never over-subscribe it.
limit_conn_zone $server_name zone=media_conc:1m;

# The frame channel's connection pool (2026-09-23).
#
# Keyed on $binary_remote_addr, NOT on $server_name like the three above. That
# difference is the whole point: those are global pools sized so the three
# together sum to Puma's 32 threads, and a WebSocket holds its slot for the
# life of the connection -- so ten readers on a global pool of ten would 429
# the entire site. Per address, a reader needs one socket and nothing
# legitimate needs four.
#
# 10m holds roughly 160,000 addresses. The wall saw 16,731 distinct ones in
# eight hours, so this holds a day of them with room.
limit_conn_zone $binary_remote_addr zone=wall_sockets:10m;
