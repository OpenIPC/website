# A board's older address goes to its own page.
#
# A board had no address but `?model=<id>` on the catalogue's, and the
# catalogue's canonical named the catalogue: to a search engine every board
# was /cameras/boards. Each now has a page of its own, /cameras/boards/<id>
# (service/internal/boards/page.go), and the links already out there -- forum
# posts, issues, the site's own pages before the change -- get a 301 to it, so
# what they earned moves with them.
#
# Built like conf.d/openipc-locale-param.conf: from $request_uri and $args
# rather than the decoded $uri, an id only of the characters an id has, and
# the rest of the query kept (a search, its scope, the console line a link
# pointed at). Two `model=` mean no one board, and stay where they are.

# The catalogue's address, in whichever language, when the query follows it.
map $request_uri $openipc_bm_path {
    default                                                     "";
    "~^(?<openipc_bm_p>/(?:(?:ru|zh)/)?cameras/boards)/?\?"     $openipc_bm_p;
}

# The query without its model=.
map $args $openipc_bm_args {
    default                                                             "?$args";
    "~^model=[^&]*$"                                                    "";
    "~^model=[^&]*&(?<openipc_bm_rest>.+)$"                             "?$openipc_bm_rest";
    "~^(?<openipc_bm_pre>.*?)&model=[^&]*(?<openipc_bm_post>&.*)?$"     "?$openipc_bm_pre$openipc_bm_post";
}

map $args $openipc_bm_once {
    default                                 1;
    "~(?:^|&)model=[^&]*&(?:.*&)?model="    "";
}

map "$request_method:$openipc_bm_once:$arg_model:$openipc_bm_path" $openipc_board_model_target {
    default                                                                                 "";
    "~^(?:GET|HEAD):1:(?<openipc_bm_id>[a-z0-9][a-z0-9-]{0,127}):(?<openipc_bm_base>/.+)$"  "$openipc_bm_base/$openipc_bm_id$openipc_bm_args";
}
