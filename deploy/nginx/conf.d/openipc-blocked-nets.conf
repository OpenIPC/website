# Networks that cannot reach the origin intact, sent to the mirror.
#
# WHAT HAPPENS TO THEM. In Russia the TSPU freezes a TLS connection to this
# host's network after the first 20-odd kilobytes. Captured here on 2026-10-03,
# four camera uploads from Rostelecom, KES and SOVAM addresses: handshake
# complete, 22.8-24.9 KB of the picture received and acknowledged, then nothing
# in either direction -- the FIN nginx sent at its 60 s body timeout was
# retransmitted seven times and never acknowledged. 561 uploads ended that way
# on 2026-10-02. In the same period every upload that arrived through
# openipc.ru, which proxies this site from a host inside Russia, was stored:
# 552 of 552, plus eight 429s.
#
# WHAT THEY GET. A 301 to the same address on https://openipc.ru, before
# anything else is read. The answer is a few hundred bytes, so it arrives
# before the freeze does. Which networks, and from what, is decided here and
# nowhere else: a client carries openipc.org and follows a redirect, and never
# names a mirror itself.
#
# WHO THEY ARE. Every network announced by an AS registered in Russia, in
# openipc-blocked-nets.list -- generated by deploy/blocked-nets.py, committed,
# and refreshed by rerunning it.
#
# KEYED ON THE PEER, $realip_remote_addr, not on $remote_addr. A mirror's
# X-Forwarded-For is trusted (nginx.conf, set_real_ip_from), so behind
# openipc.ru $remote_addr IS a Russian reader -- and a rule keyed on it would
# send the mirror's own request back to the mirror, round and round. The peer
# is the host that connected. And openipc.ru's host is itself in a Russian AS
# (197695, REG.RU), so each mirror is listed below as not blocked, the more
# specific entry winning as it always does in a geo block. service/deploytest
# fails if an address in set_real_ip_from is missing here.
#
# Applied in sites-available/org.openipc's HTTPS server only. Port 80 is left
# alone: stock camera firmware fetches ipctool and sends its report there in
# plain HTTP, because it has no TLS to follow a redirect into.
geo $realip_remote_addr $openipc_blocked_net {
    default 0;
    include /etc/nginx/conf.d/openipc-blocked-nets.list;

    194.58.109.202/32  0;  # openipc.ru, опенипц.рф
    194.238.42.216/32  0;  # openipc.kz, openipc.cloud
}
