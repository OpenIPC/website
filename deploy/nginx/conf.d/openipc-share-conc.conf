# The share hosts' connection budget (cloud.openipc.share).
#
# Every camera with a live share holds one WebSocket to the relay for as long
# as it has one, and every guest page holds one while it sets up. nginx's
# workers are shared with every other site on this host, so the share hosts get
# a bound of their own: 1500 sockets in all -- each is two worker connections,
# one each way -- and 50 from any one address, which a site with many cameras
# behind one NAT stays under. The relay closes a camera socket that registers
# nothing, so what holds a slot here is a camera that is sharing.
limit_conn_zone $binary_remote_addr zone=share_perip:10m;
limit_conn_zone $server_name zone=share_total:1m;
