# openipc.org — production and dev/staging containers.
#
# nginx and PostgreSQL stay on the host. These containers publish only on
# loopback; nginx terminates TLS and proxies to them.
#
# Tags come from deploy/.env (written by deploy.sh), never edited by hand.

# The Go containers' shared settings. Small and bounded: the whole of what
# they do is a few thousand requests a day.
x-go-common: &go-common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"
  mem_limit: 384m

x-go-health: &go-health
  interval: 30s
  timeout: 5s
  start_period: 10s
  retries: 3

services:
  # One image, ghcr.io/openipc/website-go (#287, #304); two roles per
  # environment.
  #
  #   web       :3002 prod / :3012 dev   uploads, variants, the wall JSON and
  #                                      socket, /up
  #   firmware  :3003 prod / :3013 dev   full images, one version each, their
  #                                      stats, and the catalogue's availability
  #
  # Their settings are /srv/www/.env.go-<env>, written by
  # deploy/install-go-service.sh. PostgreSQL is reached over its bind-mounted
  # socket.

  go-web-prod:
    <<: *go-common
    container_name: openipc-go-web-prod
    image: ghcr.io/openipc/website-go:${GO_PROD_TAG:-none}
    command: ["serve", "--role", "web"]
    env_file:
      - path: /srv/www/.env.go-prod
        format: raw
    ports:
      - "127.0.0.1:3002:3002"
    healthcheck:
      <<: *go-health
      test: ["CMD", "curl", "-fsS", "http://localhost:3002/up"]
    volumes:
      - /var/run/postgresql:/var/run/postgresql
      - /srv/www/shared/wall:/srv/wall
      - /srv/www/shared/boards:/srv/boards
      - /srv/www/shared/owner-reports:/srv/owner-reports
      - /srv/www/shared/tools:/srv/tools

  go-firmware-prod:
    <<: *go-common
    container_name: openipc-go-firmware-prod
    image: ghcr.io/openipc/website-go:${GO_PROD_TAG:-none}
    command: ["serve", "--role", "firmware"]
    env_file:
      - path: /srv/www/.env.go-prod
        format: raw
    ports:
      - "127.0.0.1:3003:3003"
    healthcheck:
      <<: *go-health
      test: ["CMD", "curl", "-fsS", "http://localhost:3003/up"]
    volumes:
      - /var/run/postgresql:/var/run/postgresql
      - /srv/www/shared/firmware:/srv/firmware
      - /srv/www/shared/go-release-cache:/srv/release-cache

  # ipctool's builds, read-only over NFS, for a camera on stock firmware:
  # `mount -o nolock openipc.org:/ipctool /tmp/o` (internal/nfsro). One per
  # host -- the portmapper has to be on 111 and NFS on 2049 -- so it runs
  # production's image and production's tools directory, and nothing else:
  # no database, no settings file.
  go-nfs:
    <<: *go-common
    container_name: openipc-go-nfs
    image: ghcr.io/openipc/website-go:${GO_PROD_TAG:-none}
    command: ["serve", "--role", "nfs"]
    mem_limit: 64m
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    ports:
      - "111:111/udp"
      - "111:111/tcp"
      - "2049:2049/udp"
      - "2049:2049/tcp"
    healthcheck:
      <<: *go-health
      test: ["CMD", "curl", "-fsS", "http://localhost:3004/up"]
    volumes:
      - /srv/www/shared/tools:/srv/tools:ro

  go-web-dev:
    <<: *go-common
    container_name: openipc-go-web-dev
    image: ghcr.io/openipc/website-go:${GO_DEV_TAG:-none}
    command: ["serve", "--role", "web"]
    env_file:
      - path: /srv/www/.env.go-dev
        format: raw
    ports:
      - "127.0.0.1:3012:3002"
    healthcheck:
      <<: *go-health
      test: ["CMD", "curl", "-fsS", "http://localhost:3002/up"]
    volumes:
      - /var/run/postgresql:/var/run/postgresql
      - /srv/www/shared/dev-wall:/srv/wall
      - /srv/www/shared/dev-boards:/srv/boards
      - /srv/www/shared/dev-owner-reports:/srv/owner-reports
      - /srv/www/shared/dev-tools:/srv/tools

  go-firmware-dev:
    <<: *go-common
    container_name: openipc-go-firmware-dev
    image: ghcr.io/openipc/website-go:${GO_DEV_TAG:-none}
    command: ["serve", "--role", "firmware"]
    env_file:
      - path: /srv/www/.env.go-dev
        format: raw
    ports:
      - "127.0.0.1:3013:3003"
    healthcheck:
      <<: *go-health
      test: ["CMD", "curl", "-fsS", "http://localhost:3003/up"]
    volumes:
      - /var/run/postgresql:/var/run/postgresql
      - /srv/www/shared/dev-firmware:/srv/firmware
      - /srv/www/shared/dev-go-release-cache:/srv/release-cache
