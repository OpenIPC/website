name: Build image

# Every branch is built, not just master: deploying a branch to
# dev.openipc.org needs an image for it.
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # Never cancel on the default branch. Rollback addresses images by commit
  # SHA, so a cancelled master build leaves a hole in the rollback history --
  # exactly the release you want back may have no image. Feature branches can
  # be superseded freely.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Runs alongside build rather than gating it: a broken test should not stop an
  # image existing for a branch, but it must stop the merge. Add "test" to the
  # required status checks on master once this has been green for a few runs.
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
      # The Go service's database (#292): its unit tests and the conformance
      # suite's Go target each make a database of their own on it.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=10

    env:
      RAILS_ENV: test
      OPENIPC_DATABASE_HOST: 127.0.0.1
      OPENIPC_DATABASE_PORT: 3306
      # The test group, not the development one: rubocop and i18n-tasks are
      # development gems and nothing here runs them, so installing them only
      # costs time. This used to be load-bearing as well, because the
      # development group pinned error_highlight at a version Ruby 3.1 could not
      # activate; that gem is gone from the Gemfile now, so this is only speed.
      BUNDLE_WITHOUT: development

    steps:
      - uses: actions/checkout@v4

      # Before setup-ruby, because bundler-cache runs bundle install and mysql2
      # needs libmysqlclient headers to compile. It passes today only because
      # the hosted runner happens to ship them; the Dockerfile installs the OS
      # packages first for the same reason and this now matches that order.
      - name: Install libraries the gems bind to
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            default-libmysqlclient-dev libvips42 libheif1

      # Matches the Dockerfile, so a gem that compiles there compiles here.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.12'
          bundler-cache: true

      # app/assets/builds/ is gitignored, so a fresh checkout has no
      # application.js and sprockets raises "the asset is not present in the
      # asset pipeline" for any test that renders a page through the layout.
      # Until this step existed the suite could only test redirects and
      # exceptions. Node 20 + corepack + `yarn install --immutable` is what the
      # Dockerfile does, so what builds here builds in the image.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the assets the layout references
        run: |
          corepack enable
          yarn install --immutable
          yarn build
          yarn build:css

      # database.yml authenticates as www/www. Grant it globally rather than on
      # one schema: test_helper parallelizes, and each worker creates its own
      # openipc_test-N database.
      - name: Create the test database user
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "
            CREATE USER IF NOT EXISTS 'www'@'%' IDENTIFIED BY 'www';
            GRANT ALL PRIVILEGES ON *.* TO 'www'@'%' WITH GRANT OPTION;
            FLUSH PRIVILEGES;"

      # Create explicitly (db:test:prepare assumes the database exists), load
      # db/schema.rb, then migrate.
      #
      # The migrate is not redundant: db/schema.rb is pinned at
      # 2022_08_06_130659 while db/migrate/ runs to 2023_05_07_193639, so five
      # migrations were never dumped into it and loading the schema alone leaves
      # the suite refusing to start with "Migrations are pending". Regenerating
      # schema.rb is the real fix and belongs in its own change.
      - name: Prepare schema
        run: bin/rails db:create db:schema:load db:migrate

      - name: Run tests
        run: bin/rails test

      # The black-box conformance suite (#291), against this checkout booted in
      # production mode -- the mode the cameras talk to, and the one where
      # forgery protection is on. The suite drives it over HTTP and reads its
      # database, and nothing is loaded in-process.
      - name: Conformance suite
        run: bin/conformance

      # The check on the check: six ways a port could break the upload, each
      # applied to the tree in turn. Every one must turn the suite red, or it
      # does not cover what it claims to.
      - name: Conformance suite fails against a broken server
        run: bin/conformance --mutations

      # --- the Go service (#287) ---------------------------------------------
      # Steps in this job, not a job of their own: branch protection requires
      # exactly `build` and `test`, and a third job would report without gating.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: service/go.sum

      - name: Go vet and tests
        working-directory: service
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          go vet ./...
          go test -count=1 ./...

      - name: The conformance suite against the Go service
        run: |
          (cd service && CGO_ENABLED=0 go build -trimpath -o bin/openipc ./cmd/openipc)
          CONFORMANCE_PG_URL='postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable' \
            bin/conformance --target go

      # --- the component library (#158) -----------------------------------
      # Steps in this job rather than a job of their own, for the same reason
      # the static bundle's steps live in `build`: branch protection on master
      # requires exactly the contexts `build` and `test`, so a third job would
      # report without gating, and a library whose type-check is red has to be
      # able to block a merge.
      #
      # `if: always()` so a red Rails suite does not hide the frontend result,
      # and the other way round. Either failing fails the job.
      #
      # Node 24, not the 20 above: the toolchain the library came with
      # (vite 8, eslint 10, storybook 10) needs it, and the Rails asset build
      # must keep matching what the Dockerfile installs.
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend workspace
        if: always()
        working-directory: frontend
        run: npm ci

      # --workspaces, so @openipc/site (#159) is covered by the same three
      # commands the moment it exists. Its type-check is `astro check`, which
      # reads the .astro files as well as the .ts, and its tests build the
      # site first and then assert against the built tree -- three locale
      # trees, the components rendered into them, the tokens carried over.
      - name: Lint the frontend
        if: always()
        working-directory: frontend
        run: npm run lint

      - name: Type-check the frontend
        if: always()
        working-directory: frontend
        run: npm run typecheck

      - name: Test the frontend
        if: always()
        working-directory: frontend
        run: npm test

      # Never built upstream: fancyweb-ng's vite.config.ts threw
      # "Unknown config modifiers" for mode='production'. It is a gate here so
      # it cannot quietly stop building again.
      - name: Build Storybook
        if: always()
        working-directory: frontend/packages/ui
        run: npm run storybook:build

      # Packs the tarball npm would publish, installs it into an empty project
      # and renders through it -- the difference between "the bundler is happy"
      # and "a consumer can use this".
      - name: Check @openipc/ui is consumable from outside the repo
        if: always()
        working-directory: frontend/packages/ui
        run: sh scripts/verify-consumable.sh

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The full SHA is the tag deploy.sh and rollback address images by.
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      # No RAILS_MASTER_KEY here, and none is needed: production.rb relaxes
      # require_master_key when SECRET_KEY_BASE_DUMMY is set, which the
      # Dockerfile sets for assets:precompile only.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Go service's image, from the same commit, so one SHA names both
      # halves of a release: openipc-deploy pulls website:<sha> and
      # website-go:<sha> together.
      - name: Derive Go image tags
        id: go-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-go
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push the Go service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: service/Dockerfile
          push: true
          build-args: REVISION=${{ github.sha }}
          tags: ${{ steps.go-meta.outputs.tags }}
          labels: ${{ steps.go-meta.outputs.labels }}
          cache-from: type=gha,scope=go
          cache-to: type=gha,mode=max,scope=go

      # --- the static bundle (#157, filled by #159) -------------------------
      # Steps in this job rather than a job of their own. Branch protection on
      # master requires exactly the contexts `build` and `test`; a third job
      # would report without gating, and a bundle that could shadow a Rails route has
      # to be able to block a merge.
      #
      # The bundle is the Astro build now, so this job needs Node. The origin
      # does not and never will: #142 ships a tarball built here, and
      # webber-eu has 157 MiB free.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend workspace
        working-directory: frontend
        run: npm ci

      # build.sh runs the Astro build itself when node_modules is present, so
      # this is the same command a developer runs locally.
      - name: Build the static bundle
        run: deploy/static/build.sh dist

      # build.sh runs this too. Repeated as its own step so a bundle that would
      # shadow a Rails route fails with its own red line here rather than
      # inside a build log.
      - name: Refuse a bundle that would shadow Rails
        run: deploy/static/check-bundle.sh dist/site

      - name: Derive bundle tags
        id: static-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-static
          # The same scheme as the image above: the full SHA is what
          # openipc-static installs and rolls back by.
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Publish the static bundle
        uses: docker/build-push-action@v6
        with:
          # dist, not '.' -- see the comment in deploy/static/Dockerfile.
          context: dist
          file: deploy/static/Dockerfile
          push: true
          # A plain manifest rather than buildx's default attestation index.
          # deploy/static.sh reads the revision label with `docker image
          # inspect`, and one indirection fewer there is worth more than
          # provenance on what is a tarball of HTML.
          provenance: false
          tags: ${{ steps.static-meta.outputs.tags }}
          labels: ${{ steps.static-meta.outputs.labels }}

      - name: Summary
        run: |
          echo "### Image built" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy with: \`openipc-deploy prod ${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Static bundle: \`openipc-static prod ${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
