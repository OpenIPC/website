<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Shared camera · OpenIPC</title>
<style>
  :root { --bg: #f6f7f9; --fg: #1d2330; --muted: #626b7a; --bar: #ffffff; --line: #dfe3ea; --accent: #0b6bcb; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111418; --fg: #e8ebf0; --muted: #9aa3b2; --bar: #1a1f25; --line: #2a313a; --accent: #5aa7ff; --bad: #ff8a80; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  header[hidden] { display: none; }
  /* The camera's page asked for the whole screen (window.__share.fill). */
  body.share-fill > header { display: none; }
  /* One row, always: every pixel this bar takes is a pixel off the picture,
     and on a phone the wrapped version was three rows -- a fifth of the
     screen -- above the camera's own navbar. Narrow, the name gives way
     (ellipsis), the scope moves into the name's tooltip, and Diagnostics and
     Disconnect fold into one menu. */
  header { position: relative; display: flex; gap: 12px; align-items: center; min-height: 44px; padding: 0 4px 0 16px; background: var(--bar); border-bottom: 1px solid var(--line); white-space: nowrap; }
  header b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto; }
  header .muted { color: var(--muted); }
  header .grow { flex: 1; }
  header .acts { display: flex; gap: 8px; padding-right: 12px; }
  header button { font: inherit; padding: 4px 12px; border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 6px; cursor: pointer; }
  header .more { display: none; width: 44px; height: 44px; padding: 0; border: 0; font-size: 20px; line-height: 1; }
  header .narrow { display: none; }
  @media (max-width: 640px) {
    header { gap: 8px; }
    header #scope, header .wide { display: none; }
    header .narrow { display: inline; }
    header #left { flex: none; }
    header .more { display: block; }
    header .acts { display: none; position: absolute; right: 8px; top: calc(100% + 4px); z-index: 20; flex-direction: column; gap: 0; padding: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.2); }
    header .acts.open { display: flex; }
    header .acts button { border: 0; text-align: left; min-height: 44px; padding: 0 16px; }
  }
  header button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  main { flex: 1; position: relative; min-height: 0; }
  iframe { border: 0; width: 100%; height: 100%; display: block; background: #fff; }
  .player { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; }
  .player { position: relative; }
  .player img, .player video { max-width: 100%; max-height: 100%; }
  .player video { width: 100%; height: 100%; object-fit: contain; }
  .player-note { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); max-width: min(560px, calc(100% - 32px)); padding: 8px 12px; border-radius: 8px; background: rgba(0,0,0,.7); color: #fff; text-align: center; }
  .player-controls { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .player-controls button { font: inherit; min-height: 36px; padding: 6px 12px; border: 1px solid rgba(255,255,255,.35); border-radius: 6px; background: rgba(0,0,0,.55); color: #fff; cursor: pointer; }
  .player-controls button:disabled { opacity: .6; cursor: default; }
  [hidden] { display: none !important; }
  .notice { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; text-align: center; }
  .notice h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .notice p { margin: 0; color: var(--muted); max-width: 420px; }
  .notice.bad h1 { color: var(--bad); }
  /* A failure's verdict: what a screenshot of this screen has to carry, so it
     sits above everything that scrolls (diag.js verdict). */
  .verdict { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 6px 0 0; width: min(560px, 100%); text-align: left; font-size: 13px; line-height: 1.35; }
  .verdict dt { color: var(--muted); white-space: nowrap; }
  .verdict dd { margin: 0; overflow-wrap: anywhere; }
  .verdict .ref { font: 13px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .spin { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s 0.9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .diag { margin-top: 12px; text-align: left; max-width: min(860px, 100%); width: 100%; }
  .diag > button, .diag div > button { font: inherit; padding: 4px 12px; border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 6px; cursor: pointer; }
  .diag > button { display: block; margin: 0 auto; }
  .diag pre { max-height: 40vh; overflow: auto; background: var(--bar); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; word-break: break-all; }
  .diag p { color: var(--muted); margin: 8px 0; text-align: left; }
  .popover { position: absolute; right: 16px; top: 8px; z-index: 10; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; width: min(860px, calc(100% - 32px)); box-shadow: 0 8px 24px rgba(0,0,0,.2); }
</style>
</head>
<body>
<header hidden id="bar">
  <b id="camera">Shared camera</b>
  <span class="muted" id="scope"></span>
  <span class="grow"></span>
  <span class="muted" id="left"></span>
  <button class="more" id="more" type="button" aria-label="More" aria-haspopup="true" aria-expanded="false" aria-controls="acts">⋯</button>
  <span class="acts" id="acts">
    <button id="diag-open" type="button">Diagnostics</button>
    <button id="leave" type="button">Disconnect</button>
  </span>
</header>
<main id="main">
  <div class="notice" id="notice"><div class="spin"></div><h1>Connecting to the camera…</h1><p>The connection goes straight to the camera. This page never sees your camera's password.</p></div>
</main>
<script type="module" src="/__share/shell.js"></script>
</body>
</html>
