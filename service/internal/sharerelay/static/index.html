<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Shared camera · OpenIPC</title>
<style>
  :root { --bg: #f6f7f9; --fg: #1d2330; --muted: #626b7a; --bar: #ffffff; --line: #dfe3ea; --accent: #0b6bcb; --bad: #b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111418; --fg: #e8ebf0; --muted: #9aa3b2; --bar: #1a1f25; --line: #2a313a; --accent: #5aa7ff; --bad: #ff8a80; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  header[hidden] { display: none; }
  header { display: flex; gap: 12px; align-items: center; padding: 8px 16px; background: var(--bar); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header b { font-weight: 600; }
  header .muted { color: var(--muted); }
  header .grow { flex: 1; }
  header button { font: inherit; padding: 4px 12px; border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 6px; cursor: pointer; }
  main { flex: 1; position: relative; min-height: 0; }
  iframe { border: 0; width: 100%; height: 100%; display: block; background: #fff; }
  .player { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; }
  .player img { max-width: 100%; max-height: 100%; }
  .notice { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; text-align: center; }
  .notice h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .notice p { margin: 0; color: var(--muted); max-width: 420px; }
  .notice.bad h1 { color: var(--bad); }
  .spin { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s 0.9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header hidden id="bar">
  <b>Shared camera</b>
  <span class="muted" id="scope"></span>
  <span class="grow"></span>
  <span class="muted" id="left"></span>
  <button id="leave" type="button">Disconnect</button>
</header>
<main id="main">
  <div class="notice" id="notice"><div class="spin"></div><h1>Connecting to the camera…</h1><p>The connection goes straight to the camera. This page never sees your camera's password.</p></div>
</main>
<script type="module" src="/__share/shell.js"></script>
</body>
</html>
