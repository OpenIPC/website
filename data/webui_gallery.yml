# The WebUI screenshot gallery shown on /web-interface.
#
# One entry per screenshot, in the order the page lays them out. Two things read
# this file and they must not drift apart:
#
#   * the site, through `npm run export -w @openipc/site`, to build the tiles
#     of frontend/apps/site/src/components/pages/WebInterface.astro;
#   * tools/webui-gallery, to know which pages of a camera to photograph.
#
# Adding a screenshot is therefore one edit here plus a run of the tool. See
# tools/webui-gallery/README.md.
#
#   slug     basename of the pair in frontend/apps/site/src/assets/webui/ --
#            <slug>.webp is the full 2560px capture, <slug>-thumb.webp the tile.
#   caption  the page's name as the camera prints it -- the word in the nav
#            bar, prefixed by its menu where it has one, exactly as the page's
#            own browser title reads. Deliberately not translated: the WebUI is
#            English-only, so quoting it is what a reader can match against on
#            the device.
#   cgi      the page under /cgi-bin/ to photograph.
#   settle   milliseconds to wait after the page has loaded before the shutter.
#            Pages that fetch and render their own content need more: the log
#            viewer and the settings form build themselves from API calls, and
#            the player needs time to negotiate a stream and paint a frame.
#   scene    true if the page shows live video. Whatever the camera is pointed
#            at goes on the public site, so the tool lays a still picture over
#            the player -- and fails the run if it cannot find one to cover,
#            rather than quietly photographing the camera's own view when the
#            WebUI changes shape. A file name instead of true takes that
#            picture from tools/webui-gallery/scene/ for this page alone.
#   analytics  a fixture in tools/webui-gallery/scene/: the boxes of the people
#            in this page's scene, answered on /ws/analytics in place of the
#            camera, so the WebUI's own overlay draws them. A staged screen --
#            the page that shows it says so.
screens:
  - slug: dashboard
    caption: Dashboard
    cgi: dashboard.cgi
    # The graphs are drawn from samples the page takes while it is open, over
    # a two-minute window: shot sooner, they are empty axes.
    settle: 100000

  - slug: live
    caption: Live
    cgi: live.cgi
    # The pan/tilt pad shows only on a camera with a head to turn, so this one
    # is shot from such a camera, on its own:
    #   tools/webui-gallery/run.sh --camera <ptz camera> --only live
    settle: 14000
    scene: true

  - slug: recordings
    caption: Recordings
    cgi: recordings.cgi
    settle: 9000
    scene: true

  - slug: motion-detection
    caption: Camera - Settings - Motion detection
    cgi: camera.cgi?tab=motionDetect
    settle: 9000
    scene: street.jpg
    analytics: street.json

  - slug: camera-settings
    caption: Camera - Settings
    cgi: camera.cgi
    settle: 6000
    scene: true

  - slug: stream-urls
    caption: Camera - Stream URLs
    cgi: stream-urls.cgi
    settle: 3000

  - slug: config-file
    caption: Camera - Config file
    cgi: config.cgi
    settle: 3000

  - slug: sd-card
    caption: System - SD Card
    cgi: sdcard.cgi
    settle: 4000

  - slug: logs
    caption: System - Logs
    cgi: logs.cgi
    settle: 6000

  - slug: network
    caption: System - Network
    cgi: network.cgi
    settle: 3000

  - slug: time
    caption: System - Time
    cgi: time.cgi
    settle: 3500

  - slug: firmware-update
    caption: System - Update
    cgi: update.cgi
    settle: 8000

  - slug: console
    caption: System - Console
    cgi: console.cgi
    settle: 5000

  - slug: file-manager
    caption: System - File Manager
    cgi: files.cgi
    settle: 4000

  - slug: telegram
    caption: Services - Telegram
    cgi: telegram.cgi
    settle: 3000

  - slug: openwall
    caption: Services - OpenWall
    cgi: openwall.cgi
    settle: 3000
