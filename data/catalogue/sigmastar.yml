  urlname: ssc377
  build_status_url: https://github.com/OpenIPC/firmware/actions/workflows/build.yml/badge.svg
  featured: true
  segment: null
  community_notes:
    by: Tino Darkness
    points:
    - text: "SSC377 is a single-core Cortex-A35, up to 1 GHz according to various Chinese sites."
      sources:
      - https://t.me/c/1809358416/140933
      - https://t.me/c/1809358416/140920
      - https://t.me/c/1166652144/73003
    - text: "The plain SSC377 has 64 MB of DDR2 (SSC377D[E] has 128 MB and SSC377Q[E] 256 MB); a boot log from an SSC377 shows Memory: 32588K/38720K available."
      sources:
      - https://t.me/c/1166652144/117255
      - https://t.me/c/1166652144/114004
      - https://t.me/c/1166652144/73003
    - text: "SSC377 looks like a new SSC335/337 but is a different family, I6C, and as Tino recalls uses a 5.x kernel, while 335/337 are I6B0. In 2023-09 all new Anjoy devices used the 377."
      sources:
      - https://t.me/c/1166652144/72878
      - https://t.me/c/1166652144/72871
    - text: "Tino guessed the chip ID would be 0xF9 (249), INFINITY6C SSC027A-S01A."
      sources:
      - https://t.me/c/1166652144/73026
    - text: "With 64 MB DDR, not much should be expected from SSC377: it looks like an updated SSC335, more like SSC335 with extras, and Tino compares it to the 335/337."
      sources:
      - https://t.me/c/1809358416/67981
      - https://t.me/c/1166652144/79789
      - https://t.me/c/1809358416/231098
    - text: "His rough ranking (IMHO), weakest to strongest: ssc335/377, ssc335de, ssc337DE, ssc378DE, ssc30kd, ssc30kq, ssc338q, ssc339g, ssc359."
      sources:
      - https://t.me/c/1166652144/78861
    - text: "As of 2024-03-26, SSC377 was not yet supported by OpenIPC."
      sources:
      - https://t.me/c/1809358416/67977
