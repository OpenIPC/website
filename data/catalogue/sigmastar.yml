    by: Tino Darkness
    points:
    - text: "SSC338D/Q is a dual Cortex-A7 according to the SigmaStar datasheet, and two CPU cores are visible in Linux on the SSC338Q."
      sources:
      - https://t.me/c/1809358416/75988
      - https://t.me/c/1809358416/133338
    - text: "As Tino recalls, SSC338D and SSC338Q are the same chip, with 1Gb vs 2Gb DDR."
      sources:
      - https://t.me/c/1166652144/78898
    - text: "A single-core Dhrystone run on an SSC338Q (MC800S module) gives 1695 DMIPS, against 830 for SSC30KQ, 1455 for SSC359G and 1200 for an RPi Zero W; with two cores the 338Q has about 4x the DMIPS of a 30KQ."
      sources:
      - https://t.me/c/1809358416/133287
      - https://t.me/c/1809358416/82277
      - https://t.me/c/1809358416/53241
    - text: "Tino calls the SSC338 an RPi Zero-level processor according to Dhrystone and says it is not that powerful for such tasks (2024-02). By DMIPS he put the SSC338Q on par with a 1 GHz Pentium III in 2024-06, and called it roughly a Pentium II in 2025-05."
      sources:
      - https://t.me/c/1809358416/55594
      - https://t.me/c/1809358416/87315
      - https://t.me/c/1809358416/224026
    - text: "The SSC338Q encoder tops out at 4K (8 MP) at 20 fps, which is an encoder limitation; lower resolutions allow more fps (Tino cited Igor's 1080p@90). For 4K/8 MP at 30 fps use SSC339G."
      sources:
      - https://t.me/c/1809358416/46087
      - https://t.me/c/1809358416/143312
      - https://t.me/c/1809358416/29867
    - text: "As Tino recalls, you can get 720p@120 from an SSC338Q with an IMX415."
      sources:
      - https://t.me/c/1809358416/29904
    - text: "As he recalls, the SSC338 has 3 encoding channels, e.g. one 4K stream for SD recording and one downscaled stream for broadcast."
      sources:
      - https://t.me/c/1809358416/46118
    - text: "As far as Tino understands, SigmaStar engineers would be taken aback to learn how their SDK, with its 60 fps encoder limit, was patched (and what is done with the sensor); in his opinion, if SigmaStar forbids the encoder to exceed e.g. 60 fps at SDK level, they do it for a reason based on their knowledge of this SoC's limitations."
      sources:
      - https://t.me/c/1809358416/139536
      - https://t.me/c/1809358416/139538
    - text: "Tino highly doubts the SSC338/339 can do 12 MP (e.g. with an IMX477 sensor board)."
      sources:
      - https://t.me/c/1809358416/81162
    - text: "The SSC338 is a camera SoC with encoder only: no video decoder (VDEC), no VDISP and no video output of any kind."
      sources:
      - https://t.me/c/1809358416/61972
      - https://t.me/c/1809358416/138869
    - text: "There is no ADC / TV input on SSC3XX chips, so the SSC338 cannot handle analog video directly; an analog camera needs a special converter chip, and the SSC338 cannot output an analog signal either."
      sources:
      - https://t.me/c/1809358416/131366
      - https://t.me/c/1809358416/147200
      - https://t.me/c/1809358416/147198
    - text: "SSC338 with an IMX415 already uses a 4-lane MIPI sensor interface. Chips like the SSC338Q were designed for MIPI/DVP sensors, not as general-purpose SoCs with USB3 like the RK3588."
      sources:
      - https://t.me/c/1166652144/94213
      - https://t.me/EZWBC/25228
    - text: "The SSC338Q has an integrated eMAC/ePHY, so Ethernet can be wired directly to a router or PC; a transformer/MagJack is preferable for longer distances."
      sources:
      - https://t.me/c/1809358416/275242
    - text: "The I2C bus from the SSC338Q datasheet is an I2C-SPI debug bridge that users should not need, and even if usable it would interfere with PM-UART; to read I2C devices (e.g. an INA219), hang something like an RP2040 on the SSC338's USB."
      sources:
      - https://t.me/c/1166652144/110708
    - text: "On an Anjoy MC800S (SSC338Q), md.w 0x1f003c00 in u-boot returns 00f1, and the device tree machine model reads \"INFINITY6E SSC012B-S01A\". On that board u-boot is not locked."
      sources:
      - https://t.me/c/1166652144/19512
      - https://t.me/c/1166652144/19514
    - text: "A BROM dump of the SSC338 (md.b 0x0 0x8000) ends with the signature MVX4######gce02feaI6e_ROM####XVM."
      sources:
      - https://t.me/c/1166652144/19576
    - text: "Tino says that if an adapter used an FT2232 plus some TTL chips like the original MStar/SigmaStar debug adapter, an SSC338 could be recovered without a CH341A flash programmer in addition to UART."
      sources:
      - https://t.me/c/1809358416/89997
    - text: "Any SSC chip, the SSC338 included, can do secure boot via fuses, but not many vendors make use of it."
      sources:
      - https://t.me/c/1809358416/291246
    - text: "On stock firmware the CPU runs at 1.0 GHz (scaling_max_freq 1000000, performance governor) with a 900 mV core voltage. Writing 1200000 to /sys/devices/system/cpu/cpu0/cpufreq/scaling_max_freq overclocks it to 1.2 GHz (reads back 1200000)."
      sources:
      - https://t.me/c/1809358416/53260
      - https://t.me/c/1809358416/50705
    - text: "The SSC338Q IPU (NPU) clock defaults to 800 MHz and is rated up to 900 MHz; it is set with devmem writes to 0x1F206B80/0x1F206B84. In Tino's notes 1000 MHz is an overclock that passed 50/50 without a voltage bump but may fail under load, and 1100 MHz risks silent computation errors."
      sources:
      - https://t.me/c/1809358416/284390
    - text: "The SSC338 NPU is the IPU100 IP block, a \"Deep Learning Accelerator (DLA)\" usable for recognition; Tino says the original Jetson Nano has about the same TOPS."
      sources:
      - https://t.me/c/1809358416/289698
      - https://t.me/c/1809358416/42387
      - https://t.me/c/1809358416/242501
    - text: "Tino's NPU figures vary: 'several TOPS' (2024-06), 0.5 or 1 TOPS (2025-03), and an old 0.5 TOPS part (2026-06)."
      sources:
      - https://t.me/c/1166652144/117616
      - https://t.me/c/1809358416/188108
      - https://t.me/c/1809358416/290228
    - text: "Tino thinks the SigmaStar NPU needs a separate NDA."
      sources:
      - https://t.me/c/1809358416/53241
    - text: "There are not many spare CPU resources on SSC338/30KQ, so using NEON for anything is justified, especially for heavy stuff like WFB; running encoder, router and WFB all on an SSC338 can be done but may run short of resources."
      sources:
      - https://t.me/rubydigitalfpvvideolink/42110
      - https://t.me/rubydigitalfpvvideolink/50286
    - text: "Tino thinks the SSC338 (or SSC339) is powerful enough to run OpenCV on its own."
      sources:
      - https://t.me/c/1809358416/44334
    - text: "Typical consumption of an SSC338 module is about 12 V / 0.1-0.2 A, though Tino says this should be measured. A 12 V supply is a requirement of a specific board, not of the 338Q itself; SSC chips are used in 5 V baby-monitor cameras."
      sources:
      - https://t.me/c/1809358416/53246
      - https://t.me/c/1166652144/83209
    - text: "Tino calls SSC338/339 power-hungry chips, and notes that even in CCTV, powerful SoCs like the 338 are put on a separate board because they get hot."
      sources:
      - https://t.me/c/1809358416/29988
      - https://t.me/c/1809358416/162611
    - text: "As Tino recalls, the SSC338 LDC does only Y-correction, while X/Y correction is on more expensive SoCs (he says he could be wrong)."
      sources:
      - https://t.me/c/1809358416/136835
    - text: "The SSC338 is not a BGA package."
      sources:
      - https://t.me/c/1809358416/75081
    - text: "In the OpenIPC build configuration the SSC338Q belongs to infinity6e. As Tino recalls, Majestic on SSC338 could already produce slices as of 2024-04, and as of 2026-02 Ruby/Onyx still depend on the third-party Majestic for SSC338."
      sources:
      - https://t.me/c/1809358416/185337
      - https://t.me/c/1809358416/69294
      - https://t.me/rubydigitalfpvvideolink/58217
    - text: "Tino referred to legal documentation for the SSC338/30KQ Pudding SDK. Besides Linux, SigmaStar has an RTOS for the 338Q that avoids kernel-userland ping-pong but is hard to program (for enthusiasts or pros)."
      sources:
      - https://t.me/c/1809358416/241332
      - https://t.me/c/1809358416/279898
    - text: "Tino's rough ranking, weakest to strongest: ssc335/377, ssc335de, ssc337DE, ssc378DE, ssc30kd, ssc30kq, ssc338q, ssc339g, ssc359. As he recalls, one SSC338 core has about twice the DMIPS of one SSC30KQ core."
      sources:
      - https://t.me/c/1166652144/78861
      - https://t.me/c/1809358416/133271
    - text: "The 338 is a Cortex-A7 while SSC377/378 are Cortex-A35, and the newer chips should be just as good, in some ways better, and not more expensive. Tino would compare the SSC378 to the 30KQ/338 (and 377 to 335/337, 379 to 339)."
      sources:
      - https://t.me/c/1809358416/142497
      - https://t.me/c/1809358416/231098
    - text: "There is no MSC338Q; the chip is the SigmaStar SSC338Q. SigmaStar is the former MStar, now a division of MediaTek."
      sources:
      - https://t.me/c/1809358416/78889
    - text: "The bare SSC338Q chip was about 55 CNY on Taobao in 2025-09; the datasheet, SDK and the rest are under NDA."
      sources:
      - https://t.me/c/1809358416/254746
    - text: "As of 2024-03 SSC30KQ/338 could not always be found on AliExpress, and Tino expects the 338 to become harder to find than newer chips (as happened with MSC313E); for a new custom module he advises the newer SSC377/378."
      sources:
      - https://t.me/c/1809358416/65405
      - https://t.me/c/1809358416/142395
      - https://t.me/c/1809358416/53241
    - text: "Tino sees the 338 as an ordinary, conservative CCTV SoC and thinks it would likely have been discontinued long ago without the surge in sales caused by OpenIPC."
      sources:
      - https://t.me/c/1809358416/298128
      - https://t.me/c/1809358416/139545
- family: INFINITY6E
  model: SSC339G
  version: null
  status: neq
  load_address: '0x21000000'
  sdk: null
  kernel: null
  uboot_filename: ''
  linux_filename: ''
  notes: Infinity6e (SSC33X), SDK name - Pudding; also marked MSC339G
  urlname: ssc339g
  build_status_url: https://github.com/OpenIPC/firmware/actions/workflows/ssc338q_images.yml/badge.svg
  featured: false
  segment: null
  community_notes:
    by: Tino Darkness
    points:
    - text: "SSC339G is the same I6E family as SSC338 but with external memory (RAM); it is BGA with external DDR."
      sources:
      - https://t.me/c/1809358416/29939
      - https://t.me/c/1809358416/71751
      - https://t.me/c/1809358416/280375
    - text: "G-suffix chips (338G/359G/379G) are BGA with external memory, usually NAND, a slightly better encoder (30 fps vs 20), the same Pudding SDK as the 338, and maybe VDEC."
      sources:
      - https://t.me/c/1809358416/239683
    - text: "SSC339G encodes 4K at 30 fps where SSC338 is limited to 4K at 20 fps; the Anjoy MC800G uses SSC339G with external DDR."
      sources:
      - https://t.me/c/1809358416/71735
      - https://t.me/c/1809358416/46087
      - https://t.me/c/1166652144/78898
    - text: "SSC339G encodes 8MP at 30 fps vs 8MP at 20 fps on SSC338Q (2024-12)."
      sources:
      - https://t.me/c/1809358416/143312
      - https://t.me/c/1809358416/142773
    - text: "Since SSC339G can do 4K@30, Tino thinks it may also manage 1080p@120, but it looks untested (2023-10). As he recalls, the 339G encoder can do 60 fps vs 30 fps on 338Q."
      sources:
      - https://t.me/c/1809358416/29904
      - https://t.me/c/1809358416/55792
    - text: "Because SSC339 does 4K 30 fps vs 20 on SSC338, Tino reasons its memory and MIPI frequencies should be higher; he also says 339 has slightly better ISP bandwidth, and on G-suffix SoCs (SSC338G, 339G) the bus runs at a higher frequency in standard mode, which is not an overclock."
      sources:
      - https://t.me/c/1809358416/60207
      - https://t.me/c/1809358416/121061
      - https://t.me/c/1809358416/290932
    - text: "In 2024-03 Tino said OpenIPC may work on SSC339G because it is the same I6E family as SSC338, if you are brave enough to flash the NAND on an MC800G; by 2024-09 he said Majestic supports SSC339G."
      sources:
      - https://t.me/c/1166652144/107783
      - https://t.me/c/1809358416/112254
    - text: "As of 2026-06, SSC339G/338G still use the old Pudding SDK, while Maruko is gradually taking over."
      sources:
      - https://t.me/c/1809358416/291215
    - text: "His rough ranking (IMHO), weakest to strongest: ssc335/377, ssc335de, ssc337DE, ssc378DE, ssc30kd, ssc30kq, ssc338q, ssc339g, ssc359; he compares SSC379 to the 339."
      sources:
      - https://t.me/c/1166652144/78861
      - https://t.me/c/1809358416/231098
    - text: "Per the SSD268 docs, SSC339 is the same as the new SSC9381."
      sources:
      - https://t.me/c/1166652144/20377
- family: MERCURY6
  model: SSC359G
  version: ''
  status: neq
  load_address: ''
  sdk: ''
  kernel: ''
  uboot_filename: ''
  linux_filename: ''
  notes: Mercury6, as an Anjoy Vision MC-H12S boot log shows (512 MB DDR, SPI NAND); also marked MSC359G; no OpenIPC build yet
  urlname: ssc359g
  build_status_url: https://img.shields.io/static/v1?label=SSC359G&message=%20&logo=github
  featured: false
  segment: null
  community_notes:
    by: Tino Darkness
    points:
    - text: "SSC359/SSC359G is Mercury6 (M6), not an Infinity6 chip, and is in the Mercury6 SDK family."
      sources:
      - https://t.me/c/1809358416/291748
      - https://t.me/c/1809358416/51875
      - https://t.me/c/1809358416/51143
    - text: "Tino's core description changed: on 2024-12-10 he said SSC359G is 2x Cortex-A35 up to 1.2 GHz, and on 2024-12-16 he corrected that to 2x Cortex-A53 (with SSC379G being 4x Cortex-A53)."
      sources:
      - https://t.me/c/1809358416/140934
      - https://t.me/c/1809358416/143329
    - text: "Single-core Dhrystone gives SSC359G 1455 DMIPS, less than SSC338Q's 1695 (Tino calls these abstract numbers that may be inaccurate because of over/underclocking), so SSC359 has fewer DMIPS than SSC338 but a better encoder in terms of resolution."
      sources:
      - https://t.me/c/1809358416/141148
      - https://t.me/c/1809358416/82277
      - https://t.me/c/1809358416/82136
    - text: "An SSC359G boot log shows 512MB of DDR (MCP1866_4X, miupll_468MHz)."
      sources:
      - https://t.me/c/1166652144/75062
    - text: "SSC359G can encode 12MP@25 plus D1@25 in H.26x, and has MIPI RX at up to 1.5 Gbps, plus MIPI TX and video outputs."
      sources:
      - https://t.me/c/1809358416/143320
    - text: "SSC359 has both VENC and VDEC, but it is BGA, relatively expensive, and its image quality can be worse than I6E. On encoder performance it is even better than SSC339G, though he won't vouch for the colours."
      sources:
      - https://t.me/c/1809358416/61972
      - https://t.me/c/1809358416/80448
    - text: "The SSC359G (Mercury6) signature string is MVX4######ga2f5884M6_ROM#####XVM. On the MC-H12S, /sys/class/mstar/msys/CHIP_ID reports Chip_ID 0xF4 and md.w 0x1f003c00 in U-Boot reads 00f4."
      sources:
      - https://t.me/c/1809358416/75106
      - https://t.me/c/1809358416/75088
    - text: "Tino said SSC359 (with IMX577 modules) was not supported by OpenIPC in 2023-10, and again in 2024-05 said it was not (yet?) supported."
      sources:
      - https://t.me/c/1809358416/29959
      - https://t.me/c/1809358416/80333
    - text: "SSC359G (used in some Anjia/Anjoy 12MP modules) is a Mercury-family chip; the M6 SDK codename is Tiramisu."
      sources:
      - https://t.me/c/1166652144/75061
    - text: "The MC-H12S pairs SSC359 (M6) with a 12MP Sony Starvis2 IMX577. In 2024-05 SSC359 + IMX577 modules were about $60 without lens (about $80 with a 3.6-11mm 4x optical zoom)."
      sources:
      - https://t.me/c/1809358416/80333
      - https://t.me/c/1809358416/51874
    - text: "As Tino recalls, SSC359 and SSC369G are completely different families, Mercury6 vs Infinity7, and he had not yet seen SSC369 in consumer OEM/ODM modules (2024-01)."
      sources:
      - https://t.me/c/1809358416/51881
    - text: "His rough ranking (IMHO), weakest to strongest: ssc335/377, ssc335de, ssc337DE, ssc378DE, ssc30kd, ssc30kq, ssc338q, ssc339g, ssc359."
      sources:
      - https://t.me/c/1166652144/78861
