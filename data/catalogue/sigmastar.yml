  build_status_url: https://github.com/OpenIPC/firmware/actions/workflows/ssc338q_images.yml/badge.svg
  featured: false
  segment: null
  community_notes:
    by: Tino Darkness
    points:
    - text: "SSC338G is the external-DDR variant of SSC338; perhaps it behaves a bit differently while still remaining the same I6E."
      sources:
      - https://t.me/c/1809358416/181307
      - https://t.me/c/1809358416/117054
    - text: "'G'-suffix chips such as 338G/359G/379G are BGA with external memory (usually NAND, as Tino puts it) and a bit better encoder (30 fps vs 20); the 338G uses the same Pudding SDK as the 338, maybe with VDEC. There may be more differences he does not remember."
      sources:
      - https://t.me/c/1809358416/239683
    - text: "Tino has said different things about 338G encoder speed: on 2026-06-17 he said even the G (external DDR) stays at 338 level, so on a full scan most likely <= 20 fps; on 2026-06-25 he said external DDR gives 30 fps on VENC at full frame, not 20, maybe something else as well."
      sources:
      - https://t.me/c/1809358416/290261
      - https://t.me/c/1809358416/290918
    - text: "With external DDR (338G) you can run the DDR at a higher clock with a heatsink, and on G-suffix SoCs (SSC338G, 339G) the bus can run at a higher frequency in standard mode, which is not an overclock."
      sources:
      - https://t.me/c/1809358416/290932
      - https://t.me/c/1809358416/290920
    - text: "As of 2026-06, SSC339G/338G still use the old Pudding SDK, while Maruko is gradually taking over."
      sources:
      - https://t.me/c/1809358416/291215
    - text: "Anjoy's H12F CCTV module uses SSC338G with an OS12D40 sensor (not Sony), and in 2024-09 he saw a 2-board 338G/IMX347 camera on Taobao."
      sources:
      - https://t.me/c/1809358416/181307
      - https://t.me/c/1809358416/117054
