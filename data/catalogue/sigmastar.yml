    by: Tino Darkness
    points:
    - text: "SSC378DE is an I6C-family chip with a Cortex-A35 core (versus Cortex-A7 in older parts)."
      sources:
      - https://t.me/c/1166652144/74857
      - https://t.me/c/1809358416/103329
      - https://t.me/c/1809358416/220061
    - text: "A single-core Dhrystone run on an SSC378DE mini board gives 1591 DMIPS (Tino marked it with a question mark), on kernel 5.10.61 with uClibc."
      sources:
      - https://t.me/c/1809358416/141148
    - text: "SSC378DE looks like the I6C replacement for the SSC337DE. His rough ranking (IMHO), weakest to strongest: ssc335/377, ssc335de, ssc337DE, ssc378DE, ssc30kd, ssc30kq, ssc338q, ssc339g, ssc359."
      sources:
      - https://t.me/c/1166652144/73971
      - https://t.me/c/1166652144/78861
    - text: "OpenIPC rootfs.squashfs.ssc378de already contains sensor_imx335_mipi.ko (2025-01). As of 2025-04-29 there is no majestic-fpv or FPV-optimised Divinus for I6C (SSC378DE)."
      sources:
      - https://t.me/c/1809358416/148761
      - https://t.me/c/1809358416/212922
    - text: "It looks like the decoder on SSD201/SSR621Q understands the SSC378 encoder's stream much better."
      sources:
      - https://t.me/c/1809358416/221262
    - text: "Modules with SSC378DE include MC-J86 (SC850SL), MC-A81 (SC830AI) and MC-A85 (GC8?); the MC800S5 uses SSC378QE/IMX415 instead."
      sources:
      - https://t.me/c/1809358416/217588
