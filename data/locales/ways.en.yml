    ask_text: "People answer every day. Post these three and someone will usually know the board:"
    ask_title: "Not found? Ask the community"
    ask_when: "Anytime"
    buy_cta: "See all manufacturers and integrators"
    buy_home_cta: "See who sells them"
    buy_home_text: "Cameras that ship with OpenIPC, from the manufacturers and integrators we work with."
    buy_more: "+{count} more"
    buy_short: "Buy one ready"
    buy_tag: "No tools"
    buy_text: "These manufacturers and integrators ship cameras with OpenIPC on them. Plug one in and open its web interface."
    buy_title: "Buy one with OpenIPC already installed"
    buy_when: "Easiest · no tools"
    experts_html: "<strong>Reverse engineering a new camera?</strong> Get a shell on it and run <a href=\"https://github.com/OpenIPC/ipctool\">ipctool</a>, or have an AI coding agent dig through the vendor firmware, then <a href=\"/community\">send us the report</a>. That is how new boards reach this list."
    home_all: "All supported hardware"
    home_lede: "You don’t need to know what a SoC is, and none of these needs a soldering iron."
    home_title: "Four ways to get started, easiest first"
    lede: "Four ways, easiest first. The first two need no tools at all, and none of them needs a soldering iron."
    nav_label: "Four ways to get OpenIPC"
    open_chip_html: "The chip is the largest square one, often under a metal plate. Its top line reads like <code>SSC335</code>, <code>T31X</code> or <code>Hi3516EV300</code>."
    open_home_cta: "Identify my board"
    open_home_text: "Match the board against more than a thousand photographed ones, or read the chip."
    open_label: "Board code or chip marking"
    open_placeholder: "53H20-S, SSC335"
    open_search: "Search"
    open_short: "Open up your camera"
    open_tag: "Screwdriver"
    open_text: "Unplug it and take the front off. Match the board against more than a thousand photographed boards, or read the chip itself."
    open_title: "Open up the camera you have"
    open_when: "Screwdriver · 20 minutes"
    ota_check: "Check"
    ota_cta: "Browse OpenIPC-ready models"
    ota_device_help_html: "The device ID is the 4th part of the <strong>System version</strong> in the camera’s app or web interface: V5.00.R02.<code>00001532</code>.10010…"
    ota_device_label: "Device ID"
    ota_device_placeholder: "00001532"
    ota_home_cta: "Is mine one of them?"
    ota_home_text: "Many Xiongmai-based cameras take OpenIPC through their own Upgrade button."
    ota_short: "Switch over the air"
    ota_tag: "No tools"
    ota_text_html: "Many cameras built on Xiongmai boards switch from their factory firmware to OpenIPC through their own <em>Upgrade</em> button, with a <a href=\"https://github.com/OpenIPC/coupler\">Coupler</a> image. Buy one of them, or check the one you have."
    ota_title: "Switch a camera over the air"
    ota_when: "No tools · 10 minutes"
    title: "Get a camera running OpenIPC"
