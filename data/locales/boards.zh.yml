zh:
  pages:
    boards:
      title: 摄像头主板
      heading: 你的主板很可能就在这里
      lede: '摄像机和录像机主板：照片、UART 引脚图、规格参数，以及（如有）出厂闪存转储和 U-Boot 控制台输出。先找到与你手中 PCB 相同的主板，再在它的 SoC 上安装 OpenIPC。'
    report:
      title: "提交电路板"
      eyebrow: "电路板目录"
      lede: "一台还没人报告过的摄像头，只需一份报告就能进入目录：ipctool 从板子上读到的信息；如果您愿意帮助移植 OpenIPC，再附上出厂闪存。"
      shell_title: "您能进入摄像头的 shell"
      shell_lede_html: "通过 telnet 进入原厂固件，或使用 UART 控制台。原厂固件没有 curl，所以 ipctool 由 <a href=\"https://github.com/OpenIPC/uget\">uget</a> 通过普通 HTTP 从本站下载：uget 是一个 5 KB 的下载器，以文本形式粘贴进去即可。"
      step_uget: "1. 把 uget 粘贴到 telnet 会话中"
      step_fetch: "2. 下载 ipctool 并发送报告"
      wget_title: "固件带 wget（busybox）：无需 uget"
      wget_hint_html: "wget 会跟随重定向，所以在 uget 无法使用的地方也能用。<code>-mips32</code> 和 <code>-arm64</code> 版本在同一地址。"
      nfs_title: "固件带 NFS 客户端（大多数雄迈固件都有）"
      nfs_hint_html: "其他途径（UART、TFTP 或 SD 卡）：见 <a href=\"https://github.com/OpenIPC/ipctool#alternative-launch-methods\">ipctool 的 README</a>。"
      flag_upload: "硬件报告：SoC、传感器、闪存分区、固件版本"
      flag_backup: "附带整个闪存，仅 OpenIPC 维护者可见。ipctool 会先要求您输入 yes。"
      flag_public: "审核后，备份随报告一起公开"
      flag_note: "购买渠道和销售名称"
      flag_club: "你在 OpenIPC 俱乐部（openipc.org/club）获取的一次性代码：报告归你所有，与你发送的照片关联，并可获得星星"
      agent_title: "由 AI 编程代理来分析"
      agent_lede: "把这个页面交给它。它会先查目录，再把发现的内容作为单独的报告发送。"
      agent_prompt: "Read https://openipc.org/agents.md and follow it to identify this camera and send openipc.org a report."
      agent_step1_html: "用 ipctool 的输出请求 <code>POST /api/v1/boards/identify</code>：如果电路板已知，就到此为止，直接使用它的固件。"
      agent_step2: "收集启动日志、U-Boot 环境变量，并在所有者同意后读取闪存。"
      agent_step3_html: "全部发送到 <code>POST /api/v1/reports</code>，并把回执交给您。"
      fact1_title: "先审核，后公开"
      fact1: "OpenIPC 维护者会审核每份报告并归到对应的电路板下。在此之前，只有您能通过回执查看。"
      fact2_title: "您的摄像头保持匿名"
      fact2: "在所有公开内容中（报告和日志），MAC、芯片序列号和云 ID 都会被替换为哈希值。"
      fact3_title: "备份默认不公开"
      fact3_html: "备份包含摄像头存储的一切，包括 Wi-Fi 密钥和密码。只有使用 <code>--public</code> 发送时才会公开。"
      new_title: "无法进入摄像头的命令行？发送照片"
    club:
      eyebrow: 'OpenIPC 俱乐部'
      title: 'OpenIPC 俱乐部'
      lede: '登录后可跟踪你提交到电路板目录的内容、让固件转储保持私密、绑定你在 Open Wall 上的摄像头，并因此获得星星。'
    club_review:
      eyebrow: 'OpenIPC 俱乐部'
      title: '审核队列'
      lede: '等待维护者审核的用户报告。'
    club_leaderboard:
      eyebrow: 'OpenIPC 俱乐部'
      title: '贡献排行'
      lede: '为记录摄像头电路板和让摄像头持续出现在 Open Wall 上获得的星星，仅列出选择公开的成员。'
