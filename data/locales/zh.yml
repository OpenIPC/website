      licence_volume_ask: 需要为多块板子构建固件？
      licence_volume_link: 免费沟通需求
      lock_caveat_html: "<code>sf lock 0</code> 用于清除某些厂商在闪存状态寄存器中设置的块保护，它是 OpenIPC U-Boot 自带的子命令：由上游 U-Boot 编译的原厂引导程序只有 <code>sf protect</code> 而没有 <code>lock</code>，因此只会输出 <code>sf</code> 的用法说明。这并没有改动任何东西，而且大多数芯片本就没有加保护——请照原样继续输入本段其余的命令，刷写会正常完成。如果确实有 <code>sf protect</code>，可以用与下面 <code>sf erase</code> 相同的偏移和长度试一次，但多数芯片会回答不支持。无论哪种情况，失去的都是一道检查：仍处于保护状态的闪存会悄悄丢弃擦除和写入，却依然报告成功——每条命令都显示 OK、摄像机却仍然启动原厂固件，就是这种情况。该引导程序无法解除这道保护：请用外部编程器烧录芯片，或通过您已经连接的串口使用 <a href=\"https://github.com/OpenIPC/defib\">defib</a>，它的写入代理会自行解锁。"
      mac_record_caveat_html: "请把这个地址和备份一起记下来。完整镜像会擦除整片闪存，原厂 MAC 也会随之消失：首次启动时，摄像机会保留它已有的地址，其次查找仍留在闪存中的原厂地址，只有两者都找不到时才会自行生成一个——而整片擦除之后已经无处可找。如果引导程序回答 <code>ethaddr</code> 未定义，该地址就印在摄像机自己的标签上。无论哪种情况，之后都可以在摄像机上用 <code>set_mac aa:bb:cc:dd:ee:ff</code> 把它设置回去。"
