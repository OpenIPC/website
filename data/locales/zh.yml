    installation:
      mac_record_stock_caveat_html: "请把这个地址和备份一起记下来。出厂 MAC 保存在闪存里，任何擦除芯片的操作都会把它一起抹掉：首次启动时摄像机会保留自己已有的地址，然后到闪存里找出厂地址，两者都找不到时才会自己生成一个新的。如果引导程序提示 <code>ethaddr</code> 未定义，地址就印在摄像机的标签上。无论哪种情况，之后都可以在摄像机上用 <code>set_mac aa:bb:cc:dd:ee:ff</code> 把它设回去。"
      stock_backup_info: "您即将覆盖摄像机出厂时自带的固件，没有备份就回不去了。请启动 TFTP 服务器，并在摄像机的引导程序命令行中执行下面这些命令——它们只用到板子上现有引导程序本来就有的功能。"
      stock_bundle_info_html: "把它解压到 TFTP 服务器的根目录。里面是 <code>%{kernel}</code>（内核）和 <code>%{rootfs}</code>（根文件系统）。"
      stock_bundle_title: "下载固件包"
      stock_info_html: "本站无法给出这两条命令。内核与根文件系统写到哪里，取决于您摄像机引导程序编译时使用的分区布局，而同一颗芯片的不同摄像机也可能不同——OpenIPC 自己的偏移量是随 OpenIPC 引导程序一起提供的，而这颗 SoC 没有。请用 <code>printenv bootargs</code> 和 <code>printenv mtdparts</code> 查看您的分区布局，然后按<a href=\"https://github.com/OpenIPC/wiki/blob/master/en/installation.md\">安装指南</a>写入这两个文件。如果指南没有涵盖您的摄像机，请<a href=\"/community\">到聊天群里询问</a>——这一步大家都是互相帮忙完成的。"
      stock_lede: "OpenIPC 为这颗 SoC 提供固件，但没有提供引导程序，因此向导式安装和现成的整片镜像都不在这里提供——它们都要先写入 OpenIPC 引导程序。您可以做的是用摄像机自带的引导程序来安装这份固件，而它的第一步在每台摄像机上都是一样的。"
      stock_title: "用摄像机自带的引导程序写入这两个文件"
      do_not_paste: "# 请逐行输入命令！不要一次复制粘贴多行！"
      attention: 注意！
      backup:
        info: OpenIPC U-Boot 会覆盖原始的加密分区，因此无法恢复为出厂固件，除非您拥有此特定摄像机的完整闪存备份！要创建完整的固件备份，请启动 TFTP 服务器并在引导加载程序 shell 中执行这些命令。
        more_info_html: 有关详细信息，请参阅项目 wiki 中的<a href="https://github.com/OpenIPC/wiki/blob/master/en/installation.md">安装说明</a>。
        shared_name: "上面的文件名对本型号、同种闪存的每台摄像机都是一样的，因此备份第二台时会覆盖第一台的备份——而这个文件是回到原厂固件的唯一途径。请给每台摄像机的备份取一个自己的名字，恢复时也使用同一个名字。或者在上面填写 MAC 地址：填写之后它会成为文件名的一部分。"
        subtitle: 备份您的原始固件，请不要跳过这个步骤！
        title: 保存原始固件
      backup_32: 请注意！在备份 32M 闪存之前，请确保摄像机至少有 64M 的 RAM。
      chat_blocked_html: 'Telegram 并非在所有网络下都能打开。如果你的网络打不开，请到<a href="https://github.com/OpenIPC/" data-event="download-step:chat:issues">问题追踪器</a>提问。'
      chat_lede: '就这块硬件提问：'
      compound_caveat_html: "如果引导程序输出的是命令用法说明而不是执行该行，说明它不支持 <code>&amp;&amp;</code>。该行由三条命令组成——传输、擦除，然后写入——三条都必须输入，每一条都要等前一条报告成功之后再执行，这正是 <code>&amp;&amp;</code> 替你做的检查。切勿省略擦除：向未擦除的闪存写入会存进乱码，却仍然报告成功，而位于 0 偏移处的那段乱码就是引导程序。"
