en:
  pages:
    boards:
      title: Camera boards
      heading: Your board is probably here
      lede: 'Camera and recorder boards with photos, UART pinouts, specifications and, where we have them, factory flash dumps and U-Boot consoles. Match the PCB in your hand, then install OpenIPC on its SoC.'
    report:
      title: "Send us a board"
      eyebrow: "Board catalogue"
      lede: "A camera nobody has reported yet reaches the catalogue from one report: what ipctool reads off the board and, if you want to help port OpenIPC to it, the flash it came with."
      shell_title: "You have a shell on the camera"
      shell_lede_html: "Telnet into the stock firmware, or a UART console. Stock firmware has no curl, so ipctool comes from this site over plain HTTP, fetched by <a href=\"https://github.com/OpenIPC/uget\">uget</a>: a 5 KB downloader you paste in as text."
      step_uget: "1. Paste uget into the telnet session"
      step_fetch: "2. Fetch ipctool and send the report"
      wget_title: "The firmware has wget (busybox): no uget needed"
      wget_hint_html: "wget follows a redirect, so it also works where uget cannot. The <code>-mips32</code> and <code>-arm64</code> builds are at the same address."
      nfs_title: "The firmware has an NFS client (most Xiongmai do)"
      nfs_hint_html: "Other ways in, over UART, TFTP or an SD card: <a href=\"https://github.com/OpenIPC/ipctool#alternative-launch-methods\">ipctool's README</a>."
      flag_upload: "the hardware report: SoC, sensor, flash layout, firmware versions"
      flag_backup: "adds the whole flash, kept private for OpenIPC's maintainers. ipctool asks you to type yes first."
      flag_public: "the backup is published with the report, once reviewed"
      flag_note: "where you bought it and what it is sold as"
      agent_title: "An AI coding agent is doing the digging"
      agent_lede: "Give it this page. It checks the catalogue first, then sends what it found as a report of its own."
      agent_prompt: "Read https://openipc.org/agents.md and follow it to identify this camera and send openipc.org a report."
      agent_step1_html: "Ask <code>POST /api/v1/boards/identify</code> with ipctool's output: if the board is known, stop there, with its firmware."
      agent_step2: "Collect the boot log, the U-Boot environment and, with the owner's say-so, a flash read."
      agent_step3_html: "Send it all to <code>POST /api/v1/reports</code> and pass the receipt back to you."
      fact1_title: "Read before it is shown"
      fact1: "OpenIPC's maintainers review each report and file it under its board. Until then, only you can see it, at its receipt."
      fact2_title: "Your camera stays anonymous"
      fact2: "The MAC, the chip's serial and the cloud ID are replaced with hashes in everything published, in the report and in any log."
      fact3_title: "A backup is private unless you say otherwise"
      fact3_html: "It holds everything the camera stores, including Wi-Fi keys and passwords. It is published only if you sent it with <code>--public</code>."
    club:
      eyebrow: 'OpenIPC Club'
      title: 'OpenIPC Club'
      lede: 'Sign in to follow what you sent to the board catalogue, keep your flash dumps private, link your cameras on the Open Wall, and collect stars for both.'
    club_review:
      eyebrow: 'OpenIPC Club'
      title: 'Review queue'
      lede: 'Owner reports waiting for a maintainer''s decision.'
    club_leaderboard:
      eyebrow: 'OpenIPC Club'
      title: 'Who helps the most'
      lede: 'Stars for documenting camera boards and for keeping cameras on the Open Wall, from the members who chose to be listed.'
