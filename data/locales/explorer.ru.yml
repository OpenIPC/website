    help_title: Обозреватель прошивок — справка
    help:
      what:
        title: Что это
        html: '<p>Просмотр того, из чего состоит каждая сборка OpenIPC: какие пакеты и модули ядра попадают в корневую файловую систему, сколько места занимает каждый, как это менялось по сохранённым сборкам и — если сборка опубликовала граф Kconfig — сколько сэкономит отказ от пакетов. Отсюда можно скопировать фрагмент defconfig для Buildroot или открыть запрос на сборку в <code>OpenIPC/builder</code>.</p><p>Всё показанное взято из отчёта о размерах и графа Kconfig, которые каждая ночная сборка <code>OpenIPC/firmware</code> и <code>OpenIPC/builder</code> присылает на openipc.org при публикации. Пока вы пользуетесь страницей, с GitHub ничего не загружается.</p>'
      first_look:
        title: С чего начать
        html: '<ol><li><strong>Источник.</strong> Firmware показывает платы и варианты (<code>hi3518ev300-lite</code>); Builder — устройства (<code>gk7205v200_lite_tiandy-tc-c321n</code>).</li><li><strong>Сборка.</strong> Выбрана самая новая. Идентификатор сборки имеет вид <code>nightly-ГГГГММДД-коммит</code>.</li><li><strong>Платформа.</strong> В списке только платформы, приславшие размеры для этой сборки.</li><li><strong>Вкладки.</strong> «Состав» — что занимает больше всего, «Пакеты» и «Модули ядра» — подробности, «Изменения» — сравнение с другой сборкой, «Динамика» — долгосрочная картина, «Что если…» — моделирование отказа от пакетов.</li></ol>'
      flash_map:
        title: Карта флеш-памяти и индикаторы
        html: '<p>Полоса — это чип в той разметке, которую использует сборка: U-Boot с окружением, раздел ядра, раздел корневой файловой системы и оверлей с вашими настройками, в масштабе лимитов, по которым сборка себя проверяет. Более тёмная часть раздела — то, что сборка занимает. Индикаторы показывают те же числа и состояние: <em>тесно</em> — свободно меньше 10%, <em>почти заполнено</em> — меньше 2%.</p>'
      tabs:
        title: Вкладки
        html: '<p><strong>Состав</strong> рисует каждый пакет прямоугольником, площадь которого равна устанавливаемому объёму, а цвет — его типу. <strong>Пакеты</strong> сортирует их; строка раскрывается до крупнейших файлов. <strong>Модули ядра</strong> перечисляет все <code>.ko</code> и показывает, загружаются ли они при старте; крупные модули «по требованию» — обычные кандидаты на удаление. <strong>Удалено при финализации</strong> — то, что хуки OpenIPC вырезают после установки. <strong>Изменения</strong> сравнивает две сборки одной платформы. <strong>Динамика</strong> следит за запасом места и самыми быстрорастущими пакетами по сохранённым сборкам и прогнозирует, когда место закончится, если тренд сохранится.</p>'
      what_if:
        title: Что если…
        html: '<p>В Kconfig Buildroot есть <code>depends on</code> и <code>select</code>. Отключение пакета отключает и то, что включает только он; если пакет выбран чем-то ещё включённым, он остаётся, и таблица показывает, что его удерживает. Экономия — это установленный объём уходящих пакетов по данным этой сборки. <em>Скопировать фрагмент defconfig</em> даёт строки вида <code># BR2_PACKAGE_FOO is not set</code> для добавления в defconfig платы; <em>Запросить такую сборку</em> открывает заполненный issue в <code>OpenIPC/builder</code>.</p>'
      links:
        title: Ссылки и история
        html: '<p>Адрес страницы хранит вид — <code>source</code>, <code>build</code>, <code>plat</code>, <code>compare</code>, <code>tab</code>, — так что любым видом можно поделиться. openipc.org хранит 90 последних сборок каждого источника, как и страницы релизов; платформа, не собравшаяся в какую-то ночь, отсутствует в этой сборке и оставляет пропуск в динамике.</p>'
