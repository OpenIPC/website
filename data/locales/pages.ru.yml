      bring1_title: 'Немодифицированная прошивка'
      bring2_text: 'Побайтово одинаковые результаты в разных процессах, с гейтом в CI: отказ, найденный в три ночи, воспроизводится в девять. Одна микросекунда разницы во входе видна как другой прогон.'
      bring2_title: 'Детерминированные прогоны'
      bring3_text: 'Видеодвижок — попиксельно, радио — бит в бит, контроллер — трасса в трассу. Согласие двойника с железом само есть тест, который запускается на каждый push.'
      bring3_title: 'Сверено с кремнием'
      bring4_text: 'Тысячи полётов, каналов или загрузок за ночь на одной машине, с инъекцией отказов, замираниями, столкновениями и шумом сенсоров, которые стенд не может запланировать.'
      bring4_title: 'Масштаб, находящий редкий отказ'
