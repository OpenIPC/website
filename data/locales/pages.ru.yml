      stats_source: 'Первые два работают в нашем CI на каждый push; третье измерено на нашей собственной настольной ИИ-системе.'
      step1_text: 'Фиксированная цена, пятнадцать рабочих дней. Вы присылаете образ прошивки или контроллер, железо — устройство или его документацию — и тест, который сегодня не можете запустить. Вы получаете свою прошивку, загружающуюся в первой модели, или контроллер, работающий в симуляторе, план сверки с кремнием и фиксированную цену полного двойника.'
      step1_title: 'Оценка двойника'
      step2_text: 'Строим двойник до точности, нужной тесту, сверяем с вашим железом и ставим в ваш CI с проверкой согласия как гейтом.'
