    isp_sensors:
      bring1_text: 'Шестьдесят кадров, биннинг, обрезанные скоростные окна. Мы выводим тайминги из даташита и проверяем их на интерфейсе, чтобы нужный режим существовал на вашей плате.'
      bring1_title: 'Режимы, которых вендор не поставил'
      bring2_text: 'Когда порт работает медленно, причина в последовательности инициализации или в конвейере, а не в сенсоре. Мы трассируем вендорскую прошивку регистр за регистром и перестраиваем путь, пока частота не совпадёт с возможностями кремния.'
      bring2_title: 'Возвращённая частота кадров'
      bring3_text: 'Мы знаем, какая статистика где измеряется — до или после dehaze, на raw или на цвете, — так что ваши контуры замыкаются на данных, на которые могут влиять. Отчёт с захватами «до» и «после».'
      bring3_title: 'Настройка, которая сходится'
      bring4_text: 'Генеалогия сенсоров — какие являются перемаркировкой каких — и руководство по портированию, сводящее восемь поколений платформ в пять ярусов драйверов: второй порт стоит долю от первого.'
      bring4_title: 'Один драйвер — много плат'
