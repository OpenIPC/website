      stat3_l: 'холоднее от одной правки последовательности питания — измерено на плате, а не прочитано в даташите'
      stat3_n: '4,5 °C'
      stats_source: 'Референсная линейка камер спроектирована нашим инженером-схемотехником и выпускается под брендом партнёра; измерения сделаны на наших платах.'
      step1_text: 'Фиксированная цена, десять рабочих дней. Вы присылаете, что продукт должен делать: оптика, разрешение и частота кадров, интерфейсы, канал, корпус, источник питания, целевая цена, объём. Вы получаете блок-схему, короткий список сенсор–SoC с измеренными бюджетами по кадрам и питанию, оценку спецификации компонентов, риски и график с фиксированной ценой первого прототипного тиража.'
      step1_title: 'Спринт определения продукта'
      step2_text: 'Схема, трассировка и прошивка в одной команде; прототипы измерены на стенде; пилотная партия с провижинингом и восстановлением до отгрузки первого устройства.'
      step2_title: 'Проект'
      step3_text: 'Файлы проекта, исходники прошивки и тестовая оснастка — ваши, с необязательным общим сопровождением в OpenIPC для того, что не специфично для вас.'
      step3_title: 'Сопровождение'
      title: 'Железо под ключ'
    utilities:
      paragraph1: Коллекция полезных программ и утилит.
      title: Утилиты
    video_encoding:
      bring1_text: 'Экономия накапливается всю жизнь потока: меньше байт на каждую секунду каждой камеры, каждый месяц — из настроек, которые путь по умолчанию никогда не открывает.'
      bring1_title: 'Биты, за которые вы перестаёте платить'
      bring2_text: 'Мы оцениваем композитом из трёх перцептивных метрик, а не одним числом, которое можно обмануть. Если конфигурация выигрывает, она выигрывает по всем трём — или мы объясняем, почему нет.'
      bring2_title: 'Качество, которое можно защитить'
      bring3_text: 'Без нового железа и без лицензий. Выигрыш даёт управление битрейтом, предпросмотр, карты квантования и выбор режимов — всё это простаивает в кодере, который у вас есть.'
      bring3_title: 'Кремний, который у вас уже есть'
      bring4_text: 'Кодер на пятидолларовом чипе камеры мы настраиваем с той же строгостью, что и GPU в дата-центре, включая слоистые потоки, где одно кодирование обслуживает и живой просмотр, и запись.'
      bring4_title: 'От камеры до облака'
      brings_intro: 'Четыре вещи, каждая измерена на железе.'
      brings_title: 'Что мы приносим'
      cta_note_html: 'Коммерческая поддержка, OEM-лицензирование и остальные услуги — на <a href="/business">странице для бизнеса</a>.'
      cta_primary: 'Написать на business@openipc.org'
      cta_secondary: 'Спросить в чате'
      cta_text: 'Одно письмо из четырёх строк: платформа и кодек, контент и разрешение, что хотите сократить, где забрать ролики. Отвечает инженер с планом, а не скрипт продаж.'
      cta_title: 'Пришлите три ролика. Через десять дней вы узнаете, что ваш кодер оставляет на столе.'
      engagement_title: 'Как устроена работа'
      eyebrow: 'Whitepaper · Видеокодирование · Аппаратные кодеры и современные кодеки'
      hero_cta_how: 'Как устроена работа'
      hero_cta_send: 'Пришлите нам три ролика'
      hero_lede: 'Ваш кодер уже оплачен, и большая его часть никогда не включалась. Мы настраиваем аппаратные кодеры на кремнии NVIDIA, Intel, Rockchip и HiSilicon — и на чипах камер выше по потоку, — чтобы вы отдавали то же качество при меньшем битрейте, измеренное на вашем контенте, а не на демо-ролике вендора.'
      hero_title: 'Тот же кодер, меньше бит — и картинка лучше.'
      meta_description: 'Оценка и настройка аппаратных видеокодеров на кремнии NVIDIA, Intel, Rockchip и HiSilicon и на чипах камер: то же качество при меньшем битрейте, измеренное на вашем собственном контенте.'
      pill1: 'NVIDIA'
      pill2: 'Intel'
      pill3: 'Rockchip'
      pill4: 'HiSilicon и Goke'
      pill5: 'SigmaStar'
      pill6: 'H.264 · HEVC · AV1'
      platforms_text: 'Аппаратные кодеры на настольном, серверном и встраиваемом кремнии; программные кодеры там, где они всё ещё выигрывают; кодеры на стороне камеры в прошивке OpenIPC. Оценка перцептивными метриками, сверенными с эталонной реализацией, на вашем контенте.'
      platforms_title: 'Что мы настраиваем'
      pull_quote: 'Сначала настройте базу — потом заявляйте, что её обошли.'
      res1_text: 'Встраиваемый кодер на 5 Вт обошёл настольный GPU на 8–13% битрейта в 4K в HEVC при на порядок меньшей цене. Его H.264 слабее, и мы говорим об этом прямо — правильный выбор зависит от декодеров, которые вы обслуживаете. Исследование опубликовано целиком, со всеми пресетами.'
      res1_title: 'Встраиваемые кодеры'
      res2_text: 'Кодеры NVIDIA и Intel измерены по пресетам низкой задержки и качества в H.264, HEVC и AV1 против программных кодеров, которые они призваны заменить, в базе сравнений, которую мы держим актуальной. К каждому результату приложен метод, чтобы ваша команда могла повторить его на своём контенте.'
      res2_title: 'Кодеры дата-центров'
      res3_text: 'На чипах камер, для которых мы делаем прошивку, одна лишь структура опорных кадров делает статичную сцену в 3,1 раза дешевле в передаче, а потерянный пакет стоит один кадр вместо целой группы. Мы знаем реальный потолок пиксельной скорости каждого чипа и реализовали временные слои на двух платформах, чтобы один поток обслуживал трёх потребителей.'
      res3_title: 'Кодеры камер'
      results_title: 'Результаты на реальном кремнии'
      scar_p1: 'Аппаратный кодер выбирают за кадры в секунду, а его настройки по умолчанию писались под демонстрацию, не под ваш контент. Каждый процент битрейта, который вы не вернули, оплачивается ежемесячно — трафиком, хранением, радиоканалом, роняющим кадр под нагрузкой, — пока живёт продукт.'
      scar_p2: 'Цифры вендоров вам не помогут: каждая измерена против плохо настроенного конкурента. Мы видели, как большая часть кажущегося выигрыша испарялась, стоило правильно настроить базовую конфигурацию. Вам нужен тот, кто сначала настроит вашу базу — и только потом скажет, что осталось на столе.'
      scar_title: 'Вы купили пропускную способность и смирились с качеством, которое к ней прилагалось'
      stat1_l: 'меньше бит, чем у настольного GPU в 4K, от встраиваемого кодера с потреблением 5 Вт'
      stat1_n: '8–13%'
      stat2_l: 'дешевле статичные сцены только за счёт структуры опорных кадров'
      stat2_n: '3,1×'
      stat3_l: 'до побитово точного восстановления после потерянного пакета, со структурой, которую мы поставляем'
      stat3_n: '1 кадр'
      stats_source: 'Измерено нами на серийном железе и на чипах камер, для которых мы делаем прошивку; работы по кодерам наши инженеры публикуют на vmetrix.tech.'
      step1_text: 'Фиксированная цена, десять рабочих дней. Вы присылаете три характерных ролика, платформу и настройки кодера и цель — битрейт, хранение или качество. Вы получаете настроенную и измеренную базу, рекомендованную конфигурацию и экономию при равном качестве на вашем контенте, с оценками, которые за ней стоят.'
      step1_title: 'Аудит кодера'
      step2_text: 'Внедряем в ваш конвейер: путь через API, управление битрейтом, карты квантования, временные слои — с проверкой на миксе контента вашего парка, на железе, которое у вас работает.'
      step2_title: 'Проект'
      step3_text: 'Настройки, измерительный стенд и отчёт — ваши. Перезапускайте при смене контента или железа; зовите нас, когда ответ удивит.'
      step3_title: 'Сопровождение'
      title: 'Видеокодирование'
