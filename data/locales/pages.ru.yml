      see_wiki: 'Majestic в вики'
      title: 'Majestic Endpoints'
      why: 'Там он собирается из реально работающей прошивки, чем страница на этом сайте быть не может:'
    our_team:
      contributors_link: Список всех участников GitHub
      paragraph1_html: 'OpenIPC — это проект с открытым исходным кодом, развиваемый сообществом: множество людей вносят свой вклад в код проекта, за что им огромное спасибо! Но есть основная команда разработчиков, которые усердно работают над расширением списка <a href="/supported-hardware">поддерживаемых платформ</a>, наращиванием функциональности и повышением стабильности встроенного ПО, проверкой присланного кода и координацией усилий сообщества. Познакомьтесь с членами команды и их спецализацией:'
      title: Наша команда
    qr_code_generator:
      alert_text: QR-код генерируется прямо в вашем браузере. Ваши данные никуда не отправляются и нигде не сохраняются.
      alert_title: Примечание
      generate_qr_code: Создать QR-код
      paragraph1_html: Создайте QR-код с учетными данными для доступа к вашей беспроводной сети.
      password: Пароль
      reset_form: Сбросить форму
      title: Генератор QR-кода беспроводной сети
    reverse_engineering:
      bring1_text: 'Ядерные драйверы и прошивки, которые можно собрать, пропатчить и перенести на следующее ядро. Мы заменяем бинарник функция за функцией и доказываем эквивалентность сравнением трасс.'
      bring1_title: 'Блобы становятся исходниками'
      bring2_text: 'Каждый результат приходит со своим оракулом: проверкой паритета регистров, эфирным свидетелем с положительным контролем, побайтово совпадающим выводом. Если утверждение нельзя проверить, мы так и говорим.'
      bring2_title: 'Доказательство, а не рассказ'
      bring3_text: 'Бинарные форматы моделей, зашифрованные SDK, изменённые веса. Мы восстанавливаем раскладки до карты регистров, а модификации — до точных изменённых слоёв, и передаём запуск команде Edge AI.'
      bring3_title: 'Нейросети — тоже'
      bring4_text: 'Декомпиляция с ИИ-ассистентом и собственный декомпилятор с восстановлением типов позволяют одному инженеру покрыть то, на что уходила команда. Последнее слово всё равно за железом.'
      bring4_title: 'Быстрее, чем раньше'
      brings_intro: 'Четыре вещи, каждая измерена на железе.'
      brings_title: 'Что мы приносим'
      cta_note_html: 'Коммерческая поддержка, OEM-лицензирование и остальные услуги — на <a href="/business">странице для бизнеса</a>.'
      cta_primary: 'Написать на business@openipc.org'
      cta_secondary: 'Спросить в чате'
      cta_text: 'Одно письмо из четырёх строк: что за цель, что от неё нужно, чем можете поделиться, срок. Под NDA с первого ответа. Отвечает инженер, а не скрипт продаж.'
      cta_title: 'Пришлите бинарник и вопрос. Через пять дней вы узнаете, можно ли доказать ответ.'
      engagement_title: 'Как устроена работа'
      eyebrow: 'Whitepaper · Реверс-инжиниринг · Железо, софт и нейросети'
      hero_cta_how: 'Как устроена работа'
      hero_cta_send: 'Пришлите нам бинарник и вопрос'
      hero_lede: 'Когда документации нет, вендор ушёл, а блоб и есть продукт, мы восстанавливаем то, что кремний делает на самом деле, — из дизассемблера, из трассировок, из эфира — и доказываем это стендом, который отвечает «да» или «нет». IDA мы используем с 1990-х; автоматизация новее, дисциплина — нет.'
      hero_title: 'Каждое утверждение проверено на железе. В этом весь метод.'
      meta_description: 'Реверс-инжиниринг железа, прошивок, протоколов и нейросетей с собственными стендами, доказывающими каждый восстановленный факт на целевом железе. IDA — с 1990-х; ИИ-ассистенты — там, где помогают.'
      pill1: 'Прошивки ARM и MIPS'
      pill2: 'Ядерные блобы'
      pill3: 'Wi-Fi и USB-устройства'
      pill4: 'NPU камер'
      pill5: 'Нейросетевые модели'
      platforms_text: 'Стенды, которые мы строим для доказательства работы: модели чипов, выполняющие вендорский код на настольной машине, пробы в ядре, USB-мониторы, оракулы паритета регистров, эфирные свидетели с положительным контролем и наборы проверок соответствия для протоколов, на которых говорит ваш продукт.'
      platforms_title: 'Цели и стенды'
      pull_quote: 'Декомпилятор говорит, что код мог бы делать. Стенд говорит, что он сделал.'
      res1_text: 'Два ядерных блоба видеокодера стали кодом на C — все 427 функций, — проверенным сравнением трасс на настольной модели чипа. Чистые драйверы для видео- и нейродвижков того же вендора вышли побайтно идентичными оригиналам, и прошивка собирает их на современном ядре.'
      res1_title: 'Кремний'
      res2_text: 'Протокол прошивки массового Wi-Fi-чипсета был описан по вендорским исходникам, проверен в эфире и теперь ведёт 18 типов адаптеров из пользовательского пространства. Незадокументированный протокол обновления камерного вендора — и спрятанная в нём учётная запись — стали письменной спецификацией. Тем же путём был восстановлен протокол моторизованного объектива — для автофокуса.'
      res2_title: 'Радио и протоколы'
      res3_text: 'Бинарный формат моделей камерного NPU разобран до карты регистров. Зашифрованный коммерческий SDK распознавания номеров отдал раскладку моделей из работающего контейнера. Изменённая языковая модель была сравнена вес за весом, и модификация восстановлена точно, до слоя.'
      res3_title: 'Модели'
      results_title: 'Что мы восстановили'
      scar_p1: 'Ядерный блоб, привязывающий вас к старому ядру. Прошивка радио с интерфейсом, который никто не задокументировал. Файл модели, который вендор не объяснит. Устройство, чьему пути обновления приходится верить. Ответ вендора — новый блоб или никакого ответа.'
      scar_p2: 'Реверс-инжиниринг инструментом, который угадывает, хуже, чем никакой. Мы видели, как языковая модель писала гладкую и неверную историю про бинарник. Поэтому каждый восстановленный факт сверяется с работающим железом — регистры сравнены, пакеты засвидетельствованы в эфире, выводы совпали побайтно — прежде чем попасть в отчёт.'
      scar_title: 'Вы зависите от того, чего не можете прочитать'
      stat1_l: 'функций ядерного модуля кодера заменены читаемым C и проверены сравнением трасс с оригиналом'
      stat1_n: '427 из 427'
      stat2_l: 'типов Wi-Fi-адаптеров работают из пользовательского пространства после того, как протокол прошивки одного чипсета был описан по исходникам и эфиру'
      stat2_n: '18'
      stat3_l: 'строк декомпиляции прочитано, чтобы восстановить протокол обновления одного вендора — и незадокументированную учётную запись внутри него'
      stat3_n: '30 000'
      stats_source: 'Каждый результат проверен на целевом железе или его побитово точной модели; стенды показываем на созвоне.'
      step1_text: 'Фиксированная цена, пять рабочих дней. Вы присылаете бинарник, образ прошивки или устройство и вопрос, на который нужен ответ. Вы получаете, что восстановимо, стенд, которым мы это докажем, риски и фиксированную цену восстановления.'
      step1_title: 'Оценка цели'
      step2_text: 'Сначала стенд, потом восстановление против него — драйвер, протокол, формат или модель, — где каждое утверждение прослеживается до теста, который ваша команда может перезапустить.'
      step2_title: 'Проект'
      step3_text: 'Исходники, спецификация, стенд и оракулы — ваши. После каждого изменения доказательство запускается снова.'
      step3_title: 'Сопровождение'
      title: 'Реверс-инжиниринг'
    stages_of_firmware_development:
      done_alt: 'Изображение: этап ВЫПОЛНЕНО'
      done_info: Сделано и сделано! Загрузчик загружается, загружается Linux, стример может транслировать видео и создавать моментальные снимки. Вы можете открыть рабочую платформу для доработок и дальнейших улучшений. Тем не менее, мы все еще ожидаем отзывов и исправлений от вас, ребята.
      hlp_alt: 'Изображение: этап HLP'
      hlp_info: Требуется помощь. У нас есть оборудование, у нас есть SDK, основные вещи изучены и сделаны. Но мы застряли. Именно здесь мы ищем помощи у опытных разработчиков встраиваемых систем, чтобы преодолеть препятствия и перейти к следующему этапу.
      mvp_alt: 'Изображение: MVP этапа'
      mvp_info: Минимально жизнеспособный продукт. Базовая система построена, платформа может производить видео, по крайней мере, на основном канале, но из-за нехватки человеческих ресурсов разработка задерживается или останавливается. Финансовые вливания могут подтолкнуть разработку к финальной стадии.
      neq_alt: 'Изображение: этап NEQ'
      neq_info_html: Нет оборудования. У нас есть SDK для платформы, но у нас нет конкретного оборудования для продолжения разработки, вы можете пожертвовать его нашим ребятам из R&D (особенно старые платы, которые прошли <abbr title="Конец жизни">EOL</abbr> и больше не могут быть куплены).
      paragraph1: После приобретения SDK для новой SoC мы добавляем SoC в таблицу поддерживаемого оборудования. Мы присваиваем либо статус NEQ (Нет оборудования), если у нас нет определенных аппаратных модулей, либо статус HLP (Требуется помощь), если у нас есть оборудование, но мы ищем разработчика, который возглавил бы разработку для этой SoC. Это считается официальным началом разработки.
      paragraph2: Нет причин иметь SoC в таблице без его SDK.
      paragraph3: По мере продвижения работы над SoC его статус постепенно меняется. Сначала в RND, потом в WIP, потом дальше в MVP и, наконец, в DONE.
      rnd_alt: 'Изображение: стадия НИОКР'
      rnd_info: Стадия исследований и разработок, когда у нас уже есть SDK платформы и, может быть, даже аппаратные платы, но мы начинаем возиться с платформой, изучая ее специфику и особенности. Впереди еще много работы.
      subtitle: Типичный жизненный цикл разработки
      title: Этапы разработки прошивки
      wip_alt: 'Изображение: этап WIP'
      wip_info: Работа в процессе. Мы многое узнали об аппаратном обеспечении платформы и кодовой базе, подготовили первую общедоступную бинарную сборку и ждем первых пользователей, которые протестируют ее на своих платах и предоставят отзывы, которые помогут нам двигаться вперед.
    teleoperation:
      bring_latency_text: Тот же стек, на котором FPV-пилоты летают на полной скорости, на камерах дешевле обеда. Открытая прошивка от сенсора до кодера, настроенная на кратчайший путь наружу.
      bring_latency_title: Десятки миллисекунд, проверено в воздухе
      bring_link_text: 'Видео вниз, управление вверх и никаких замираний между ними: без спаривания, без очереди повторных передач. Когда в эфире шумно, вы теряете кадр — но не робота.'
      bring_link_title: Канал, который теряет кадр, а не оператора
      bring_stream_text: Один закодированный поток, две скорости. Рекордер сохраняет каждый кадр, пока канал оператора несёт столько, сколько может, — без второго кодера и без второй камеры.
      bring_stream_title: Записывать всё, передавать то, что помещается
      bring_time_text: Каждый кадр получает метку времени в момент захвата сенсором, до того как его коснётся что-либо ещё. Все камеры робота сходятся с точностью до нескольких миллисекунд без триггерного кабеля — и датасет выстраивается ровно.
      bring_time_title: Время встроено в каждый кадр
      brings_intro: Четыре вещи, и каждая уже работает на камерах в поле.
      brings_title: Что OpenIPC добавляет в контур
      cta_note_html: Отвечает инженер, а не скрипт продаж. Инженерия камер и канала, которая поставляется уже сегодня, — на <a href="/business">странице для бизнеса</a>.
      cta_primary: Написать на business@openipc.org
      cta_secondary: Спросить в чате
      cta_text: 'Мы берём трёх партнёров по дизайну: робот, стенд и инженер с вашей стороны; прошивка камер, канал и наше время — с нашей. На выходе — контур телеуправления, измеренный на вашей машине, и, если захотите, ваш первый датасет.'
      cta_title: Приводите робота, кто бы его ни сделал. Глаза — за нами.
      eyebrow: Whitepaper · Физический ИИ · Данные телеуправления
      hero_art_alt: Оператор в VR-шлеме, чьи движения повторяет человекоподобный робот в затопленном промышленном цехе
      hero_cta_link: Как устроен видеолинк
      hero_cta_pilot: Обсудить пилот
      hero_lede: 'OpenIPC переносит открытый видеостек с ультранизкой задержкой, проверенный в FPV, в робототехнику с человеком в контуре: стенд под любого робота любого производителя, канал, который не замирает, метка времени на каждом кадре в момент съёмки, каждая сессия — датасет.'
      hero_title: Сотня гуманоидов вот-вот начнёт учиться у людей. Дайте им глаза, которые не отстают.
      landscape_p1: 'Все, кто строит универсального робота, уже выбрали, откуда брать обучающие данные. Figure ставит на видео с людьми, Tesla — на симуляцию, 1X и Unitree — на телеуправление с человеком в контуре: человек ведёт робота, сессия записывается, а политика обучается на данных, уже кинематически корректных для этого тела. Исследователи Amazon идут другим путём — пересчитывают захват движения человека в движения робота постфактум.'
      landscape_p2: Телеуправление побеждает, потому что закрывает разрыв воплощения у самого источника. Одна только Unitree выпустила около 18 000 двуногих роботов, и каждым из них будут управлять.
      landscape_p3: Что не определилось — так это стенд. Аватар Unitree водит робота Unitree. Остальным 43 производителям из списка и каждой лаборатории, где машин больше одного вида, нужен стенд телеуправления и сбора данных, который подходит любому роботу и любой камере.
      landscape_p4: 'И он обязан отвечать на вопрос, на который демо-ролики не отвечают никогда: какова задержка от объектива до экрана и как её измерили? Оператор хорош ровно настолько, насколько мала задержка, которую он чувствует, а датасет наследует каждое его промедление.'
      landscape_title: Стратегия сбора данных определилась. Стенд — ещё нет.
      loop_intro: 'Teleoperator — слой, который мы строим поверх стека: стенд с человеком в контуре для любого робота — гуманоида, колёсного или летающего, — управляемого из шлема, где каждая сессия записывается как датасет LeRobot, на которых открытое робототехническое сообщество уже обучает модели.'
      loop_return: Политика, обученная на датасете, ведёт робота следующей. Это и есть маховик.
      loop_title: От рук оператора до обучающей выборки
      meta_description: 'Открытое видео с ультранизкой задержкой для телеуправления роботами: стенд под любого робота, канал, который не замирает, метка времени на каждом кадре в момент съёмки, каждая сессия — датасет.'
      node_dataset_text: Эпизоды, готовые к обучению
      node_dataset_title: Датасет
      node_link_text: Видео вниз, намерение вверх
      node_link_title: Канал
      node_operator_text: Видит то, что видит робот; отслеживаются голова, руки или всё тело
      node_operator_title: Оператор
      node_recorder_text: Каждый кадр, каждая поза, одни часы
      node_recorder_title: Рекордер
      node_robot_text: 'Любого производителя: руки, ноги, колёса или винты'
      node_robot_title: Робот
      pilot1_text: Прошивка OpenIPC на камерах, которые уже стоят на вашем роботе, и канал между роботом и рабочим местом оператора.
      pilot1_title: Глаза на роботе
      pilot2_text: 'Оператор ведёт машину: голова и руки — из шлема, или всё тело — из костюма захвата движения, спроецированные на собственные суставы робота, с предохранителем, который останавливает его в момент, когда канал замолкает.'
      pilot2_title: Руки на управлении
      pilot3_text: 'Сложить бельё, загрузить холодильник, прибраться в комнате: каждый прогон записывается по одним часам — что видел оператор, что он делал, что чувствовал робот — как эпизоды LeRobot, готовые к обучению.'
      pilot3_title: Сессии в датасеты
      pilot_title: Как выглядит пилот
      pull_quote: Задержка — налог на каждый записанный эпизод.
      stat_latency_l: от объектива до экрана на стеке OpenIPC
      stat_latency_n: '~30 мс'
      stat_market_l: моделей гуманоидов от 44 китайских производителей
      stat_market_n: '100'
      stat_units_l: роботов ожидается к отгрузке в 2026 году, большинство — в лаборатории
      stat_units_n: '100 000'
      stats_source_html: 'Рыночные цифры: <a href="https://www.linkedin.com/posts/jens-peder-kristensen-0116b2_chinese-humanoid-and-legged-robot-companies-activity-7470567675631435776-UGdv">KeyResearch, сентябрь 2026</a>. Задержка: цифры, о которых сообщают люди, летающие на этом стеке, — на <a href="/low-latency">странице о низкой задержке</a>.'
      title: Телеуправление
      why1_text: Прошивки и инструменты для десятков семейств камерных чипов, в открытую, с сообществом, которое читает исходники и чинит то, что находит.
      why1_title: Открыты с 2019 года
      why2_text: FPV-пилоты летают на этом стеке каждый день, а RunCam и другие вендоры поставляют железо на OpenIPC из коробки. Рефлексы, проводящие дрон сквозь щель, — те же, что ведут робота на ринге, а канал уже прошёл худшие радиоусловия из существующих.
      why2_title: Проверено в воздухе
      why3_text: Без облака, без подписки, без платы за каждый экземпляр — и без зависимости от того, чьего робота вы купили. Когда чип снимают с производства, прошивка его переживает — и ваш робот тоже.
      why3_title: Не привязано к производителю робота
      why_title: Почему OpenIPC
    turnkey_hardware:
      bring1_text: 'Сенсор, SoC, радио и питание выбираются под софт, который на них должен работать, а не наоборот. Инженер прошивки сидит на ревью схемы.'
      bring1_title: 'Сбалансированный продукт'
      bring2_text: 'Платы загружают образ, который уже работает на десятках семейств чипов, — с путями восстановления, обновления и провижининга, которые понадобятся вашему парку с первого устройства.'
      bring2_title: 'Рабочая прошивка с первого дня'
      bring3_text: 'Слепой канал восстановления через слот карты и обслуживаемый путь обновления означают, что полевое устройство никогда не превращается в кирпич, а на производстве не нужен отладчик.'
      bring3_title: 'Восстановление заложено в дизайн'
      bring4_text: 'Бюджеты по питанию, теплу и частоте кадров измеряются на плате. Одна правка последовательности дала 4,5 °C; такое находят, только когда плата и прошивка на одном стенде.'
      bring4_title: 'Измерено, а не предположено'
      brings_intro: 'Четыре вещи, каждая измерена на железе.'
      brings_title: 'Что мы приносим'
      cta_note_html: 'Коммерческая поддержка, OEM-лицензирование и остальные услуги — на <a href="/business">странице для бизнеса</a>.'
      cta_primary: 'Написать на business@openipc.org'
      cta_secondary: 'Спросить в чате'
      cta_text: 'Одно письмо из четырёх строк: что делает продукт, требования к сенсору и каналу, питание, корпус и целевая цена, объём и сроки. Отвечает инженер с планом, а не скрипт продаж.'
      cta_title: 'Пришлите описание продукта. Через десять дней у вас будет плата, с которой команда прошивки уже согласна.'
      engagement_title: 'Как устроена работа'
      eyebrow: 'Whitepaper · Железо под ключ · Плата и прошивка от одной команды'
      hero_cta_how: 'Как устроена работа'
      hero_cta_send: 'Пришлите нам описание продукта'
      hero_lede: 'Втискивать софт в чужую плату — так продукты выходят с опозданием и с вычеркнутой функцией. Мы проектируем плату и прошивку как один продукт: сенсор, SoC, питание, радио, корпус и софт, которому в этом жить.'
      hero_title: 'Одна команда рисует плату и пишет прошивку — и ни одной не приходится извиняться за другую.'
      meta_description: 'Плата и прошивка от одной команды: сенсор, SoC, питание, радио и софт, которому в этом жить, — сбалансированный продукт вместо софта, втиснутого в чужое железо.'
      pill1: 'HiSilicon и Goke'
      pill2: 'SigmaStar'
      pill3: 'Ingenic'
      pill4: 'Rockchip'
      pill5: 'Аналоговое · IP · радиоканал'
      platforms_text: 'Камерные и периферийные платы вокруг SoC, на которых прошивка уже работает, сенсоры из каталога, который мы ведём, аналоговое, IP- и радиоканальное видео, малые и средние серии. Файлы проекта и исходники прошивки — результаты работы, а не лицензии.'
      platforms_title: 'Что мы проектируем'
      pull_quote: 'Ошибкой был провод. Нашёл её тот, кому этот провод был нужен.'
      res1_text: 'Наши референсные платы — это камеры аналогового видео 38 × 38 мм на недорогом SoC, в трёх вариантах, с распиновкой в ревизии 1.4 в этом сентябре. Они существуют потому, что плату и прошивку рисовали вместе, — и это образец для вашего продукта.'
      res1_title: 'Референсная линейка'
      res2_text: 'Запуск USB-устройства на камерном SoC вскрыл дыру в железе — отсутствующую линию sense, — которую не могла закрыть никакая прошивка. На ревью это провод; в поле — перевыпуск платы. Совместное проектирование переносит находку на ревью.'
      res2_title: 'Запуск'
      res3_text: 'Прошивка работает на десятках семейств SoC и сотнях сочетаний с сенсорами, с восстановлением через консоль и слот карты более чем для 120 чипов. Ваш продукт наследует стек стриминга, восстановления и обновления и команду, которая его сопровождает. Специфичное для вас остаётся вашим.'
      res3_title: 'Софт для парка'
      results_title: 'Что мы построили'
      scar_p1: 'У вас есть идея продукта и два предложения: контрактный производитель, который соберёт любую плату по вашей спецификации, и команда прошивки, которая заставит работать любую плату. Обе правы, а в щели между ними теряется график — линия sense, которую никто не развёл, сенсор, не достигающий своей частоты на этом SoC, тепловой бюджет, который съел корпус.'
      scar_p2: 'Мы были командой прошивки на том созвоне. Один запуск камеры встал из-за единственного отсутствующего провода: USB-порт никак не мог узнать, что его подключили, и никакой софт этого не прикрыл бы. Найдено поздно — это перевыпуск платы. Найдено на ревью схемы инженером, которому нужен этот провод, — стоит ноль.'
      scar_title: 'Два коммерческих предложения — и график падает в щель между ними'
      stat1_l: 'наша референсная линейка камерных плат, распиновка опубликована в ревизии 1.4'
      stat1_n: '38 × 38 мм'
      stat2_l: 'семейств SoC, на которых прошивка уже загружается, — новая плата работает с первого дня'
