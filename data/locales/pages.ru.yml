    get_started:
      cta_find_soc: Найти свой SoC
      editions_text: Lite помещается в 8 МБ флеш-памяти и покрывает базовые задачи. Ultimate добавляет облачные трансляции, туннели и дополнительные кодеки — ей нужно 16 МБ.
      editions_title: Две редакции
      hero_lede: От заводской прошивки до OpenIPC примерно за полчаса — с инструкцией, собранной под ваш конкретный чип.
      hero_title: Подарите камере вторую жизнь.
      step1_text_html: 'Запустите <a href="https://github.com/OpenIPC/ipctool">ipctool</a> на камере (telnet или консоль UART): он покажет SoC, сенсор и флеш-чип. Этикетка или поиск по FCC ID — запасной вариант.'
      step1_title: Определите железо
      step2_text: Найдите чип в таблице поддерживаемого оборудования. Мастер соберёт образ прошивки и пошаговую инструкцию установки под вашу конфигурацию прямо в браузере.
      step2_title: Найдите свой SoC
      step3_text: Следуйте сгенерированной инструкции. Она начинается с полной резервной копии заводской прошивки — не пропускайте этот шаг.
      step3_title: Бэкап, потом прошивка
      stuck_text_html: Сообщество отвечает на вопросы каждый день. <a href="/community">Спросите в чате</a> — укажите SoC, сенсор и, если есть, лог загрузки.
      stuck_title: Застряли?
      title: Начало работы
      wall_text_html: Одна настройка в веб-интерфейсе — и снимки вашей камеры появятся на нашей живой <a href="/open-wall">Открытой стене</a>. Передайте привет сообществу.
      wall_title: А потом — на Открытую стену
      warning_text_html: Прошивка может «окирпичить» камеру. Инструкция показывает, как сначала снять полный бэкап, а <a href="https://github.com/OpenIPC/coupler">Coupler</a> на поддерживаемых моделях делает всё безопасно. Сомневаетесь — <a href="/community">спросите в чате</a> до прошивки.
      warning_title: Честное предупреждение
      webui_title: Веб-интерфейс
      what_text: 'Чистый Linux со стримером Majestic: RTSP, ONVIF, WebRTC и HLS из коробки, веб-интерфейс и полный root-доступ. Ваша камера — действительно ваша.'
      what_title: Что вы получите
    green_life:
      paragraph1: OpenIPC вносит свой вклад в устойчивое развитие, в первую очередь предоставляя открытые микропрограммы для IP-камер, непосредственно участвуя в эффективном использовании и перепрофилировании существующего оборудования.
      paragraph2: Продлевая срок службы камер за счет настраиваемых обновлений микропрограммного обеспечения и функций, OpenIPC сокращает количество электронных отходов.
      paragraph3: Это соответствует целям устойчивого развития, поскольку способствует повторному использованию и перепрофилированию технологий, минимизируя воздействие на окружающую среду, связанное с производством и утилизацией электронных устройств.
      paragraph4: Кроме того, стремление OpenIPC к прозрачности и развитию на базе сообщества способствует совместной работе над технологиями, поощряя пользователей к активному участию в развитии проекта и его устойчивости.
      title: Зеленая жизнь
    high_resolution_timer:
      reload_to_reset: Время указано в миллисекундах. Перезагрузите страницу, чтобы сбросить счетчик.
      title: Таймер высокого разрешения
    home:
      business_cta: Связаться с командой
      business_text: Коммерческая поддержка, заказная разработка и OEM-лицензирование — от людей, которые делают платформу.
      business_title: Строите продукт на OpenIPC?
      cta_donate_html: Хотите поддержать проект напрямую? <a href="/donate">Пожертвовать</a>.
      cta_primary: Начать
      cta_secondary: Наш Telegram
      cta_title: Прошейте свою первую камеру в эти выходные.
      hero_cta_low_latency: Видео с низкой задержкой
      hero_cta_start: Начать
      hero_lede: 'Открытая прошивка и инструменты для глаз физического мира: IP-камеры, FPV-дроны и роботы, которые учатся ими пользоваться. Ваше железо подчиняется вам, а не облаку производителя.'
      hero_microline: 140+ репозиториев · десятки семейств SoC · с 2019 года
      hero_title: Открытая операционная система для машин, которые видят.
      partners_title: Нам доверяют производители, интеграторы и исследователи
      pillar_firmware_text_html: Открытая ОС на базе Buildroot для IP-камер на десятках семейств SoC, со стримером <a href="https://github.com/OpenIPC/wiki/blob/master/en/majestic-streamer.md">Majestic</a> в основе.
      pillar_firmware_title: Прошивка для камер
      pillar_longevity_text: 'Мы поддерживаем вендорские SDK на mainline-ядрах: исправления CVE и новые возможности спустя годы после ухода производителя.'
      pillar_longevity_title: Долголетие и безопасность
      pillar_low_latency_text: Открытый видеолинк для FPV-дронов, роботов и телеуправления. От ~30 мс «от стекла до стекла» на поддерживаемом железе.
      pillar_low_latency_title: Видеолинки с низкой задержкой
      pillar_tools_text: Проверка ONVIF, эмуляция камер, инспекция железа — бесплатные инструменты, которые мы сделали для себя и отдали всем.
      pillar_tools_title: Инструменты для инженеров
      pillars_lede: OpenIPC — больше, чем прошивка. Это экосистема, которую делают люди, использующие её на собственном железе.
      pillars_title: Одна платформа, четыре направления
      silicon_title: Работает на чипах
      stats_repos: открытых репозиториев
      stats_since: открытая разработка с
      stats_socs: поддерживаемых SoC
      stats_vendors: производителей чипов
      story_cta: Оживить камеру
      story_step1_text: Обновления прекращаются. Дыры в безопасности остаются. Приложение исчезает из магазина.
      story_step1_title: Производитель уходит
      story_step2_text: Серверы выключают, и исправная камера превращается в кусок пластика и кремния без дела.
      story_step2_title: Серверы замолкают
      story_step3_text: Камера загружает открытую, поддерживаемую систему — и подчиняется вам. Без бэкдоров. Без подписок. Меньше электронного мусора.
      story_step3_title: Вы прошиваете OpenIPC
      story_title: Камера не должна умирать вместе со своим облаком.
      title: Открытая платформа для встраиваемого видео
      wall_cta: "+ ваша камера здесь"
      wall_live: 'Прямо сейчас: камеры на OpenIPC по всему миру'
      wall_snapshot_alt: 'Изображение: живой снимок с камеры сообщества'
    low_latency:
      build_apfpv_name: apfpv
      build_apfpv_text: Обычный Wi-Fi вместо широковещания. Камера поднимает точку доступа, наземная станция подключается к ней — принять поток может любое устройство с Wi-Fi.
      build_fpv_name: fpv
      build_fpv_text: Родной линк OpenIPC, именно его настраивает руководство по сборке. wfb-ng вещает видео без пары и без ассоциации, а adaptive-link меняет битрейт вслед за сигналом.
      build_rubyfpv_name: rubyfpv
      build_rubyfpv_text: Для наземной станции RubyFPV. Вместо wfb-ng стоят собственные линк и телеметрия RubyFPV; со стороны камеры всё остальное то же самое.
      builds_lede: Три сборки для воздушной части. Отличаются радиолинком и больше ничем, а выбор определяется тем, что стоит на земле.
      builds_title: Выберите сборку под свою наземную станцию
      business_bridge_html: Строите продукт на этом линке? <a href="/business">Напишите нам</a> — мы делаем заказную разработку и OEM.
      credits_text_html: Радиолинк существует благодаря wfb-ng и devourer, а экосистема растёт вместе с друзьями — <a href="https://rubyfpv.com/">RubyFPV</a> и <a href="https://www.youtube.com/@mariofpv">Mario FPV</a>. Open source — командный спорт.
      credits_title: Стоим на открытых плечах
      cta_chat: FPV-чат
      cta_guide: Гайд по сборке
      fpv_text: 'Полностью открытая цифровая FPV-система: никакой закрытой экосистемы, никакого спаренного железа, никакого потолка прошивки. Соберите борт из поддерживаемой камеры, выберите наземную станцию и настройте каждый этап конвейера.'
      fpv_title: 'FPV: от объектива до очков'
      hardware_text_html: Борт собирается из поддерживаемых камер и AIO-плат — начните со <a href="/supported-hardware">списка поддерживаемого оборудования</a>. RunCam и другие вендоры выпускают FPV-железо на OpenIPC из коробки.
      hardware_title: Железо
      hero_lede: 'FPV-дроны, роботы, телеуправление: открытый видеотракт со сверхнизкой задержкой от камеры до экрана. От ~30 мс «от стекла до стекла» на поддерживаемом железе.'
      hero_title: Открытые видеолинки для машин, которые не умеют ждать.
      how_link_text_html: <a href="https://github.com/OpenIPC/devourer">devourer</a> несёт видео, телеметрию и управление поверх обычных Realtek-адаптеров прямо из userspace — без ассоциации, без пауз на повторную передачу, со скоростью, мощностью и каналом для каждого пакета.
      how_link_title: Радиолинк
      how_rx_text_html: <a href="https://github.com/OpenIPC/PixelPilot_rk">PixelPilot</a> превращает плату на Rockchip в выделенную наземную станцию — самый быстрый способ принимать. <a href="https://github.com/OpenIPC/aviateur">Aviateur</a> работает на том компьютере с Windows, Linux или macOS, который у вас уже есть.
      how_rx_title: RX — ваша сторона
      how_title: Как устроен линк
      how_tx_text_html: Камера с OpenIPC и энкодером <a href="https://github.com/OpenIPC/waybeam_venc">Waybeam</a> превращает картинку сенсора в поток и отдаёт его прямо в радиолинк. Заданная здесь частота кадров определяет большую часть бюджета задержки.
      how_tx_title: TX — борт
      latency_axis_unit: мс «от стекла до стекла»
      latency_intro: Задержку решает наземная станция, а вовсе не выбранное разрешение. Это цифры, которые присылают те, кто реально летает на этом стеке, на своём железе.
      latency_note: Из чатов OpenIPC и wfb-ng, а не наши замеры. Разрешение почти не влияет; решают частота кадров и частота обновления экрана — поменяйте только монитор, и та же камера сдвинется на 120 мс.
      latency_path_desktop: Ноутбук или десктоп
      latency_path_goggles: Очки со встроенным VRX
      latency_path_ground_station: Выделенная наземная станция
      latency_path_phone: Телефон или планшет
      latency_title: Насколько быстро на самом деле
      robotics_cta: Телеуправление роботами
      robotics_text1: Тот же линк несёт видео для промышленных роботов, AGV, инспекционных систем и удалённого управления — везде, где закрытая видеосистема привязала бы вас к вендору, а путь через облако добавил бы секунды.
      robotics_text2: На поддерживаемых SoC кадры несут метки времени, привязанные к началу кадра сенсора, — миллисекундная синхронизация многокамерных систем без дополнительного железа.
      robotics_title: 'Не только дроны: роботы и телеуправление'
      title: Видео с низкой задержкой
    majestic_endpoints:
      moved_html: 'Список эндпоинтов, которые отдаёт камера, теперь живёт в веб-интерфейсе самой камеры, в меню <b>Majestic &rarr; Endpoints</b>. Откройте в браузере <code>http://&lt;адрес-камеры&gt;/</code> и выберите этот пункт.'
