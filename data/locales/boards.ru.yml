ru:
  pages:
    boards:
      title: Платы камер
      heading: Ваша плата, скорее всего, уже здесь
      lede: 'Платы камер и регистраторов: фотографии, распиновка UART, характеристики, а где они есть — заводские дампы флеш-памяти и консоль U-Boot. Найдите плату, которая у вас в руках, и установите OpenIPC на её SoC.'
    report:
      title: "Прислать плату"
      eyebrow: "Каталог плат"
      lede: "Камера, о которой ещё никто не сообщил, попадает в каталог по одному отчёту: что ipctool прочитал с платы, а если хотите помочь с портированием OpenIPC — ещё и заводская прошивка с флеша."
      shell_title: "У вас есть shell на камере"
      shell_lede_html: "Telnet в заводскую прошивку или консоль UART. В заводских прошивках нет curl, поэтому ipctool скачивается с этого сайта по обычному HTTP утилитой <a href=\"https://github.com/OpenIPC/uget\">uget</a>: это загрузчик на 5 КБ, который вставляется в сессию как текст."
      step_uget: "1. Вставьте uget в telnet-сессию"
      step_fetch: "2. Скачайте ipctool и отправьте отчёт"
      wget_title: "В прошивке есть wget (busybox): uget не нужен"
      wget_hint_html: "wget следует перенаправлениям, поэтому работает и там, где не справляется uget. Сборки <code>-mips32</code> и <code>-arm64</code> лежат по тому же адресу."
      nfs_title: "В прошивке есть NFS-клиент (у большинства Xiongmai есть)"
      nfs_hint_html: "Другие способы — через UART, TFTP или SD-карту: <a href=\"https://github.com/OpenIPC/ipctool#alternative-launch-methods\">README ipctool</a>."
      flag_upload: "отчёт о железе: SoC, сенсор, разметка флеша, версии прошивки"
      flag_backup: "добавляет весь флеш, доступный только мейнтейнерам OpenIPC. Сначала ipctool попросит ввести yes."
      flag_public: "бэкап публикуется вместе с отчётом после проверки"
      flag_note: "где куплена камера и под каким названием продаётся"
      flag_club: "ваш одноразовый код из клуба OpenIPC (openipc.org/club): отчёт станет вашим, привяжется к отправленным фото и принесёт звёзды"
      agent_title: "Разбирается ИИ-агент для программирования"
      agent_lede: "Дайте ему эту страницу. Он сначала проверит каталог, а потом пришлёт найденное отдельным отчётом."
      agent_prompt: "Read https://openipc.org/agents.md and follow it to identify this camera and send openipc.org a report."
      agent_step1_html: "Спросить <code>POST /api/v1/boards/identify</code> с выводом ipctool: если плата известна — остановиться и взять её прошивку."
      agent_step2: "Собрать лог загрузки, окружение U-Boot и, с согласия владельца, чтение флеша."
      agent_step3_html: "Отправить всё в <code>POST /api/v1/reports</code> и вернуть вам квитанцию."
      fact1_title: "Проверяется до публикации"
      fact1: "Мейнтейнеры OpenIPC просматривают каждый отчёт и привязывают его к плате. До этого он виден только вам — по квитанции."
      fact2_title: "Ваша камера остаётся анонимной"
      fact2: "MAC, серийный номер чипа и облачный ID во всём опубликованном заменены хешами — и в отчёте, и в логах."
      fact3_title: "Бэкап закрыт, если вы не решите иначе"
      fact3_html: "В нём всё, что хранит камера, включая ключи Wi-Fi и пароли. Он публикуется, только если вы отправили его с <code>--public</code>."
      new_title: "Нет доступа к консоли камеры? Пришлите фото"
    club:
      eyebrow: 'Клуб OpenIPC'
      title: 'Клуб OpenIPC'
      lede: 'Войдите, чтобы следить за тем, что вы прислали в каталог плат, держать дампы флеш-памяти закрытыми, привязать свои камеры на Open Wall и получать звёзды за то и другое.'
    club_review:
      eyebrow: 'Клуб OpenIPC'
      title: 'Очередь проверки'
      lede: 'Отчёты владельцев, которые ждут решения мейнтейнера.'
    club_leaderboard:
      eyebrow: 'Клуб OpenIPC'
      title: 'Кто помогает больше всех'
      lede: 'Звёзды за описанные платы камер и за камеры на Open Wall — у участников, которые согласились попасть в список.'
    club_crashes:
      eyebrow: 'Клуб OpenIPC'
      title: 'Разбор падений'
      lede: 'Падения ядра, присланные камерами, — сначала самые тяжёлые, с тем, что нужно, чтобы воспроизвести каждое.'
    crashes:
      eyebrow: 'Прошивка OpenIPC'
      title: 'Падения ядра с реальных камер'
      lede: 'Когда камера с OpenIPC падает, она сохраняет последние слова ядра и предлагает их владельцу. Присланные сюда, одинаковые падения со многих камер становятся одной строкой, отсортированной по тому, насколько тяжело и насколько широко они бьют, — чтобы их можно было исправить.'
