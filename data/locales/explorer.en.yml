    help_title: Firmware explorer — help
    help:
      what:
        title: What this is
        html: '<p>A read-only view of what goes into every OpenIPC build: which packages and kernel modules ship in the root filesystem, how much space each takes, how that has moved over the retained builds, and — where the build published its Kconfig graph — what leaving packages out would save. From there you can copy a Buildroot defconfig fragment or open a build request on <code>OpenIPC/builder</code>.</p><p>Everything shown comes from the size report and Kconfig graph each nightly build of <code>OpenIPC/firmware</code> and <code>OpenIPC/builder</code> sends to openipc.org when it publishes. Nothing is fetched from GitHub while you use the page.</p>'
      first_look:
        title: First look
        html: '<ol><li><strong>Source.</strong> Firmware lists boards and variants (<code>hi3518ev300-lite</code>); Builder lists devices (<code>gk7205v200_lite_tiandy-tc-c321n</code>).</li><li><strong>Build.</strong> The newest is selected. Build IDs read <code>nightly-YYYYMMDD-shortsha</code>.</li><li><strong>Platform.</strong> Only platforms that reported sizes for that build are listed.</li><li><strong>Tabs.</strong> Composition for what dominates, Packages and Kernel modules for detail, Drift against another build, Trends for the long view, What if… to model removals.</li></ol>'
      flash_map:
        title: The flash map and the meters
        html: '<p>The bar is the chip as the build lays it out: U-Boot and its environment, the kernel partition, the root filesystem partition and the overlay that keeps your settings, drawn to the caps the build checks against. The darker part of each partition is what the build uses. The meters give the same numbers and a state: <em>tight</em> under 10% free, <em>almost full</em> under 2%.</p>'
      tabs:
        title: The tabs
        html: '<p><strong>Composition</strong> draws each package as a rectangle whose area is the bytes it installs, coloured by kind. <strong>Packages</strong> sorts them; a row opens to its largest files. <strong>Kernel modules</strong> lists every <code>.ko</code> and whether it loads at boot; large on-demand modules are the usual candidates to drop. <strong>Removed by finalize</strong> lists what OpenIPC''s hooks strip after install. <strong>Drift</strong> compares two builds of the same platform. <strong>Trends</strong> follows headroom and the fastest-growing packages over the retained builds, and projects when headroom runs out if the trend continues.</p>'
      what_if:
        title: What if…
        html: '<p>Buildroot''s Kconfig has <code>depends on</code> and <code>select</code>. Switching off a package also switches off what only it selects; if something still enabled selects a package, it stays on and the table says what holds it. Savings are the installed bytes of the packages that go, measured by this build. <em>Copy defconfig fragment</em> gives lines of the form <code># BR2_PACKAGE_FOO is not set</code> to append to a board defconfig; <em>Request this build</em> opens a pre-filled issue on <code>OpenIPC/builder</code>.</p>'
      links:
        title: Links and history
        html: '<p>The address carries the view — <code>source</code>, <code>build</code>, <code>plat</code>, <code>compare</code>, <code>tab</code> — so any view can be shared. openipc.org keeps the newest 90 builds of each source, as the release pages do; a platform that failed to build one night is missing from that build and leaves a gap in its trends.</p>'
