    low_latency:
      business_bridge_html: Building a product on this link? <a href="/business">Talk to us</a> — we do custom development and OEM work.
      credits_text_html: The radio link exists thanks to wfb-ng and devourer, and the ecosystem grows with friends like <a href="https://rubyfpv.com/">RubyFPV</a> and <a href="https://www.youtube.com/@mariofpv">Mario FPV</a>. Open source is a team sport.
      credits_title: Standing on open shoulders
      cta_chat: Join the FPV chat
      cta_guide: Read the build guide
      fpv_text: 'A fully open digital FPV system: no locked ecosystem, no paired hardware, no firmware ceiling. Build the air unit from a supported camera, pick your ground station, and tune every stage of the pipeline.'
      fpv_title: 'FPV: from lens to goggles'
      hardware_text_html: Air units are built from supported cameras and AIO boards — start from the <a href="/supported-hardware">supported hardware list</a>. RunCam and other vendors ship OpenIPC-based FPV hardware out of the box.
      hardware_title: Hardware
      hero_lede: 'FPV drones, robots, teleoperation: an open ultra-low-latency video stack from camera to screen. Glass-to-glass from about 30 ms on supported hardware.'
      hero_title: Open video links for machines that can't wait.
      how_link_text_html: <a href="https://github.com/OpenIPC/devourer">devourer</a> carries video, telemetry, and control over commodity Realtek adapters, straight from userspace — no association, no retransmit stalls, and rate, power and channel set per frame.
      how_link_title: The radio link
      how_rx_text_html: <a href="https://github.com/OpenIPC/PixelPilot_rk">PixelPilot</a> turns a Rockchip board into a dedicated ground station — the fastest way to receive. <a href="https://github.com/OpenIPC/aviateur">Aviateur</a> runs on the Windows, Linux, or macOS machine you already own.
      how_rx_title: RX — your side
      how_title: How the link works
      how_tx_text_html: An OpenIPC camera runs the <a href="https://github.com/OpenIPC/waybeam_venc">Waybeam</a> encoder, turning the sensor into a stream and handing it straight to the radio. The frame rate set here decides most of your latency budget.
      how_tx_title: TX — the air side
      latency_axis_unit: ms glass-to-glass
      latency_intro: What decides your number is the ground station, far more than the resolution you pick. These are figures people report from flying this stack on their own hardware.
      latency_note: Reported in the OpenIPC and wfb-ng chats, not measured by us. Resolution barely moves the number; frame rate and screen refresh decide it — change nothing but the monitor and the same camera shifts by 120 ms.
      latency_path_desktop: Laptop or desktop
      latency_path_goggles: Goggles with a built-in VRX
      latency_path_ground_station: Dedicated ground station
      latency_path_phone: Phone or tablet
      latency_title: How fast, really
      robotics_text1: The same link carries video for industrial robots, AGVs, inspection rigs, and remote operation — anywhere a closed video system would lock you in or a cloud hop would add seconds.
      robotics_text2: On supported SoCs, frames carry wall-clock timestamps tied to the sensor frame start — millisecond-class synchronization for multi-camera rigs without extra hardware.
      robotics_title: 'Beyond drones: robots and teleoperation'
      title: Low-Latency Video
