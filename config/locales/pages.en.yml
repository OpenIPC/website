      how1: You write to us with the product and the problem.
      how2: A scoping call with an engineer.
      how3: A pilot with clear deliverables.
      how4: Ongoing support or development, sized to your needs.
      how_title: How an engagement works
      licensing_html: The core of the platform is MIT-licensed — commercial use is welcome. The Majestic streamer is distributed in binary form under the Prosperity license; commercial terms are available. The use of OpenIPC and its components for military purposes is not permitted.
      licensing_title: Licensing, plainly
      offer1_text: Priority fixes, guaranteed response times, and long-term maintenance of the platforms your product depends on.
      offer1_title: Commercial support
      offer2_text: SoC bring-up, sensor tuning, NPU features, custom video links, white-label firmware — built to your specification by the people who know the stack best.
      offer2_title: Custom development
      offer3_text: Commercial licensing for Majestic, branded builds, and integration help for manufacturers shipping OpenIPC-based products.
      offer3_title: OEM & licensing
      partners_title: Companies already building on OpenIPC
      title: For Business
      why1_text: Vendor SDKs give you a kernel and a demo. OpenIPC gives you a shipping firmware with streaming, web interface, and updates — you start from 90%, not from zero.
      why1_title: Faster than a raw SDK
      why2_text: Our mainline-kernel work keeps platforms maintained after vendors abandon them. Your product's lifespan is not capped by a vendor's roadmap.
      why2_title: Survives silicon EOL
      why3_text: Devices work without our servers — or anyone's. Your cost structure stays yours.
      why3_title: No per-unit cloud tax
      why4_text: The core is open. Whatever happens to any company, including ours, your product keeps building.
      why4_title: Open source is your escrow
      why_title: Why companies build on OpenIPC
