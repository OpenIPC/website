      section_core_text: The operating system, the streamer, and the tools that get you from stock firmware to OpenIPC.
      section_core_title: Core firmware
      section_longevity_text: 'Vendor SDKs assume vendor kernels: ancient, unpatched, abandoned. We port them to mainline — CVE fixes and modern kernel features long after end-of-life.'
      section_longevity_title: Longevity & security
      section_lowlat_text_html: The open video link for drones, robots, and teleoperation. <a href="/low-latency">Read the overview</a>.
      section_lowlat_title: Low latency & URLLC
      section_tools_text: Free tools for camera and media engineers — useful even if you never flash our firmware.
      section_tools_title: Pro tools
