    ecosystem:
      contribute_cta_html: Pick a project and make it better. <a href="/community">Start here</a>.
      hero_lede: 'OpenIPC is an ecosystem of more than a hundred open repositories: the firmware itself, the video pipeline, the tools around it, and the research that keeps old silicon alive.'
      hero_title: More than firmware.
      proj_aviateur: 'Cross-platform receiver: watch the link on Windows, Linux, or macOS.'
      proj_burn: Unbricks HiSilicon devices over serial.
      proj_coupler: The smooth migration path from vendor firmware to OpenIPC and back. No soldering, no special skills.
      proj_devourer: 'The link itself: a userspace driver for Realtek Wi-Fi adapters, setting rate, power, and channel packet by packet.'
      proj_divinus: An open-source streamer for a growing set of platforms.
      proj_firmware: Universal, Buildroot-based firmware for IP cameras — replaces abandoned vendor systems on dozens of SoC families.
      proj_ipctool: Identifies the SoC, sensor, and flash chip of nearly any camera — and backs up the stock firmware before you change anything.
      proj_majestic: 'The streamer at the heart of the firmware: RTSP, ONVIF, WebRTC, HLS, audio, night modes. Distributed as a binary under the Prosperity license; commercial terms available.'
      proj_microbe: The web interface of the firmware.
      proj_onvif_tt: 'An ONVIF conformance test tool: verify what a camera actually implements. Free.'
      proj_openhisilicon: Keeps the HiSilicon vendor SDK alive on mainline kernels — CVE fixes and modern features after the vendor walks away.
      proj_openxiongmai: 'The same idea for Xiongmai SoCs: an open SDK replacement.'
      proj_pixelpilot: 'The RX side: turns a Rockchip board into a dedicated ground station with display output.'
      proj_qemu: A full HiSilicon IP camera emulator on QEMU — develop and test firmware without hardware on your desk.
      proj_rnd_player: 'A player built for media engineers: inspect streams the way a developer needs to.'
      proj_smolrtsp: An embeddable RTSP 1.0 server library for cameras and other constrained devices. TCP and UDP, any payload format.
      proj_waybeam: 'The TX side of the link: a flexible video encoder for FPV drones and URLLC devices.'
      proj_yamlcli: A small console tool for editing YAML configs from scripts.
      section_community_text_html: User-made hardware, mounts, and accessories — like the 3D-printable models tagged <a href="https://www.printables.com/search/models?q=tag%3Aopenipc">openipc on Printables</a>.
