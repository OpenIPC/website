      img_majestic_alt: 'Image: Majestic streamer logo'
      img_openipc_alt: 'Image: OpenIPC Community logo'
      paragraph1: OpenIPC is an open source operating system from the open community targeting for IP cameras with ARM and MIPS processors from several manufacturers in order to replace that closed, opaque, insecure, often abandoned and unsupported firmware pre-installed by a vendor.
      paragraph2_html: OpenIPC Firmware comes as binary pre-compiled files for easy installation by end-user. Also, we provide full access to the source files for further development and improvement by any capable programmer willing to contribute to the project. OpenIPC source code is released under one of the most simple open source license agreements, <a href="https://opensource.org/licenses/MIT">MIT License</a>, giving users express permission to reuse code for any purpose, even as part of a proprietary software. We only ask you politely to contribute your improvements back to us and also be sure to contact us if you use our project for <a href="/support-open-source">commercial purposes</a>. We would be grateful for any feedback and suggestions. The use of the OpenIPC project and its components for military purposes is not permitted.
      paragraph3_html: OpenIPC Firmware uses <a href="https://buildroot.org/">Buildroot</a> to build its Linux distro, and utilizes either <a href="https://github.com/OpenIPC/majestic">Majestic</a>, <a href="https://github.com/OpenIPC/divinus">Divinus</a>, <a href="https://github.com/OpenIPC/mini">Mini</a> or <a href="https://github.com/OpenIPC/silicon_research">Venc</a> streamer.
      paragraph4_html: The Majestic streamer is distributed only in binary form under the <a href="https://github.com/OpenIPC/majestic/blob/master/LICENSE.md">Prosperity Public License 3.0.0</a>.
      paragraph5: First of all, OpenIPC Firmware brings you freedom. With OpenIPC on your camera you are the master of your streams. You have full access to the system and can control what, where, and how you want your camera to behave. There are no backdoors, no botnets, no crypto-mining malware, no keyloggers, no password sniffers, nothing you could possibly expect in a closed binary system with no access to its source code.
      paragraph6: As for the Firmware capabilities, we strive to provide universal support for a wide range of cameras, thus we are focused on basic functionality first, allowing end-users to upgrade their cameras' firmware and stream video and audio (where supported) without too much hassle.
      paragraph7: We have some interesting bits though. Our Firmware supports external IPEYE cloud storage, streaming video to Youtube and Telegram, using SOCKS5 proxy, setting up a Virtual Tunnel, and more.
      paragraph8: There are also several projects focused on specialized equipment, such as a camera to be mounted on a drone, for mounting on construction helmets, for use in surveying tools, for medical research of the organs of vision, underwater fishing, etc.
      subtitle1: OpenIPC is an alternative open firmware for your IP camera.
      subtitle2: Why OpenIPC Firmware?
