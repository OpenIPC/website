    get_started:
      cta_find_soc: 查找你的 SoC
      editions_text: Lite 版适配 8 MB 闪存，覆盖基本功能。Ultimate 版增加了云推流、隧道和更多编解码器等扩展功能，需要 16 MB 闪存。
      editions_title: 两个版本
      hero_lede: 从原厂固件到 OpenIPC，大约半小时——并附上为你的具体芯片生成的指南。
      hero_title: 给你的摄像机第二次生命。
      step1_text_html: 在摄像机上运行 <a href="https://github.com/OpenIPC/ipctool">ipctool</a>（通过 telnet 或串口终端），确认 SoC、传感器和闪存芯片。查看标签或搜索 FCC ID 也可以作为备选办法。
      step1_title: 确认你的硬件
      step2_text: 在支持硬件列表中查找你的芯片。向导会直接在浏览器里为你的具体配置组装固件镜像并生成分步安装指南。
      step2_title: 找到你的 SoC
      step3_text: 按生成的指南操作。第一步就是完整备份原厂固件——不要跳过。
      step3_title: 先备份，再刷机
      stuck_text_html: 社区每天都在回答问题。<a href="/community">到聊天群里提问</a>——请附上你的 SoC、传感器，以及启动日志（如果有）。
      stuck_title: 卡住了？
      title: 快速上手
      wall_text_html: 在 Web 界面里打开一个开关，你的摄像机快照就会出现在我们的实时<a href="/open-wall">开放墙</a>上——来和社区打个招呼。
      wall_title: 然后加入开放墙
      warning_text_html: 刷机有可能让摄像机变砖。指南会先教你做完整备份，在受支持的型号上 <a href="https://github.com/OpenIPC/coupler">Coupler</a> 也能走更安全的路径。如果没有把握，请在刷机前<a href="/community">到聊天群里问一问</a>。
      warning_title: 老实提醒
      webui_title: Web 界面
      what_text: '一套干净的 Linux 系统，搭配 Majestic 推流器：开箱即用的 RTSP、ONVIF、WebRTC 和 HLS，一个 Web 界面，以及完整的 root 权限。你的摄像机，真正属于你。'
      what_title: 你会得到什么
    green_life:
      paragraph1: OpenIPC 主要为 IP 摄像机提供开放式固件，直接参与现有硬件的有效利用和再利用，从而为可持续发展做出贡献。
      paragraph2: 通过可定制的固件更新和功能，OpenIPC 延长了摄像机的使用寿命，减少了电子垃圾。
      paragraph3: 这符合可持续发展的目标，即促进技术的再利用和再利用，最大限度地减少与电子设备的生产和处置相关的环境影响。
      paragraph4: 此外，OpenIPC 对透明度和社区驱动开发的承诺促进了技术合作，鼓励用户积极参与并为项目的发展和可持续发展做出贡献。
      title: 绿色生活
