      why1_text: 原厂 SDK 给你的是一个内核和一个演示程序。OpenIPC 给你的是一套可出货的固件，包含推流、Web 界面和更新——你从 90% 起步，而不是从零开始。
      why1_title: 比原始 SDK 更快
      why2_text: 我们在主线内核上的工作让原厂放弃后的平台继续得到维护。你的产品寿命不再受原厂路线图的限制。
      why2_title: 芯片停产后依然可用
      why3_text: 设备无需依赖我们的服务器，也不依赖任何人的服务器。你的成本结构仍然由你掌握。
      why3_title: 没有按台收取的云费用
      why4_text: 核心是开放的。无论任何公司（包括我们）发生什么，你的产品都能继续构建。
      why4_title: 开源就是你的托管保障
      why_title: 企业为什么选择 OpenIPC
