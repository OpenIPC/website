    ecosystem:
      contribute_cta_html: 选一个项目，把它做得更好。<a href="/community">从这里开始</a>。
      hero_lede: 'OpenIPC 是一个由一百多个开放仓库组成的生态：固件本身、视频管线、周边工具，以及让老芯片继续存活的研究工作。'
      hero_title: 不只是固件。
      proj_aviateur: '跨平台接收端：在 Windows、Linux 或 macOS 上观看链路画面。'
      proj_burn: 通过串口解救变砖的海思设备。
      proj_coupler: 在原厂固件与 OpenIPC 之间平滑迁移、并可回退的方案。无需焊接，也不需要特殊技能。
      proj_devourer: '链路本身：用户态的 Realtek Wi-Fi 网卡驱动，逐包设定速率、功率与信道。'
      proj_divinus: 面向不断增加的平台的开源推流器。
      proj_firmware: 基于 Buildroot 的通用 IP 摄像机固件——在数十个 SoC 系列上取代已被弃用的原厂系统。
      proj_ipctool: 识别几乎任何摄像机的 SoC、传感器和闪存芯片——并在你做任何改动之前备份原厂固件。
      proj_majestic: '固件核心中的推流器：RTSP、ONVIF、WebRTC、HLS、音频、夜视模式。以二进制形式在 Prosperity 许可证下分发，可另行商谈商业条款。'
      proj_microbe: 固件的 Web 界面。
      proj_onvif_tt: 'ONVIF 一致性测试工具：验证一台摄像机究竟实现了哪些功能。免费。'
      proj_openhisilicon: 让海思原厂 SDK 在主线内核上继续存活——在厂商撒手之后，仍能获得 CVE 修复与现代特性。
      proj_openxiongmai: '面向雄迈 SoC 的同类工作：一套开放的 SDK 替代方案。'
      proj_pixelpilot: '接收端：把一块 Rockchip 板子变成带显示输出的专用地面站。'
      proj_qemu: 基于 QEMU 的完整海思 IP 摄像机模拟器——桌面上没有硬件也能开发和测试固件。
      proj_rnd_player: '为媒体工程师打造的播放器：以开发者需要的方式检视码流。'
      proj_smolrtsp: 可嵌入的 RTSP 1.0 服务端库，适用于摄像机等资源受限设备。支持 TCP 与 UDP，任意负载格式。
      proj_waybeam: '链路的发送端：面向 FPV 无人机与 URLLC 设备的灵活视频编码器。'
      proj_yamlcli: 一个用于在脚本中编辑 YAML 配置的小型命令行工具。
      section_community_text_html: 社区自制的硬件、支架与配件——例如在 <a href="https://www.printables.com/search/models?q=tag%3Aopenipc">Printables 上标记为 openipc</a> 的可 3D 打印模型。
      section_community_title: 社区项目
      section_core_text: 操作系统、推流器，以及把你从原厂固件带到 OpenIPC 的各种工具。
      section_core_title: 核心固件
      section_longevity_text: '原厂 SDK 默认搭配原厂内核：陈旧、未打补丁、无人维护。我们把它们移植到主线内核——在停产很久之后仍能获得 CVE 修复与现代内核特性。'
      section_longevity_title: 长期维护与安全
      section_lowlat_text_html: 面向无人机、机器人与遥操作的开放视频链路。<a href="/low-latency">阅读概览</a>。
      section_lowlat_title: 低延迟与 URLLC
      section_tools_text: 为摄像机与媒体工程师提供的免费工具——即使你从不刷入我们的固件，它们同样有用。
      section_tools_title: 专业工具
      stage_legend_html: 每个项目都带有诚实的状态标记——与我们用于固件平台的是同一套说法。<a href="/stages-of-firmware-development">各阶段是怎么划分的</a>。
      title: 生态
