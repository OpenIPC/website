      proj_aviateur: '跨平台接收端：在 Windows、Linux 或 macOS 上观看链路画面。'
      proj_burn: 通过串口解救变砖的海思设备。
      proj_coupler: 在原厂固件与 OpenIPC 之间平滑迁移、并可回退的方案。无需焊接，也不需要特殊技能。
      proj_devourer: 基于廉价 Wi-Fi 硬件构建类 SDR 接收端的开放基础。
      proj_divinus: 面向不断增加的平台的开源推流器。
      proj_firmware: 基于 Buildroot 的通用 IP 摄像机固件——在数十个 SoC 系列上取代已被弃用的原厂系统。
      proj_ipctool: 识别几乎任何摄像机的 SoC、传感器和闪存芯片——并在你做任何改动之前备份原厂固件。
      proj_majestic: '固件核心中的推流器：RTSP、ONVIF、WebRTC、HLS、音频、夜视模式。以二进制形式在 Prosperity 许可证下分发，可另行商谈商业条款。'
      proj_microbe: 固件的 Web 界面。
      proj_onvif_tt: 'ONVIF 一致性测试工具：验证一台摄像机究竟实现了哪些功能。免费。'
      proj_openhisilicon: 让海思原厂 SDK 在主线内核上继续存活——在厂商撒手之后，仍能获得 CVE 修复与现代特性。
      proj_openxiongmai: '面向雄迈 SoC 的同类工作：一套开放的 SDK 替代方案。'
      proj_pixelpilot: '接收端：把一块 Rockchip 板子变成带显示输出的专用地面站。'
      proj_qemu: 基于 QEMU 的完整海思 IP 摄像机模拟器——桌面上没有硬件也能开发和测试固件。
      proj_rnd_player: '为媒体工程师打造的播放器：以开发者需要的方式检视码流。'
      proj_smolrtsp: 可嵌入的 RTSP 1.0 服务端库，适用于摄像机等资源受限设备。支持 TCP 与 UDP，任意负载格式。
      proj_telemetry: 在飞控与地面之间桥接遥测数据。
