    low_latency:
      business_bridge_html: 想基于这条链路做产品？<a href="/business">和我们谈谈</a>——我们承接定制开发与 OEM 合作。
      credits_text_html: 这条无线链路得益于 wfb-ng 与 devourer，整个生态也在 <a href="https://rubyfpv.com/">RubyFPV</a>、<a href="https://www.youtube.com/@mariofpv">Mario FPV</a> 等伙伴的参与下不断成长。开源是一项团队运动。
      credits_title: 站在开放的肩膀上
      cta_chat: 加入 FPV 聊天群
      cta_guide: 阅读搭建指南
      fpv_text: '一套完全开放的数字 FPV 系统：没有封闭生态，没有配对绑定的硬件，也没有固件上限。用受支持的摄像机搭建天空端，挑选你的地面站，并可调节管线的每一个环节。'
      fpv_title: 'FPV：从镜头到眼镜'
      hardware_text_html: 天空端由受支持的摄像机和 AIO 板搭建——请从<a href="/supported-hardware">支持硬件列表</a>开始。RunCam 等厂商出厂即提供基于 OpenIPC 的 FPV 硬件。
      hardware_title: 硬件
      hero_lede: 'FPV 无人机、机器人、遥操作：一套从摄像机到屏幕的开放超低延迟视频方案。在受支持的硬件上，端到端延迟低至约 30 毫秒。'
      hero_title: 为等不起的机器提供开放视频链路。
      how_link_text_html: <a href="https://github.com/OpenIPC/devourer">devourer</a> 直接在用户态承载视频、遥测与控制信号，运行于常见的 Realtek 网卡——无需关联，不会因重传而卡顿，速率、功率与信道逐包设定。
      how_link_title: 无线链路
      how_rx_text_html: <a href="https://github.com/OpenIPC/PixelPilot_rk">PixelPilot</a> 把一块 Rockchip 板子变成专用地面站——这是最快的接收方式。<a href="https://github.com/OpenIPC/aviateur">Aviateur</a> 则直接跑在你已有的 Windows、Linux 或 macOS 电脑上。
      how_rx_title: 接收端——你这一侧
      how_title: 这条链路是怎么工作的
      how_tx_text_html: 装有 <a href="https://github.com/OpenIPC/waybeam_venc">Waybeam</a> 编码器的 OpenIPC 摄像机把传感器画面变成码流，直接送入无线链路。在这里设定的帧率决定了延迟预算的大部分。
      how_tx_title: 发送端——天空这一侧
      latency_axis_unit: ms 端到端延迟
      latency_intro: 真正决定这个数字的是地面站，而不是你选的分辨率。以下是真正在用这套方案飞行的人，在自己硬件上报告的结果。
      latency_note: 来自 OpenIPC 与 wfb-ng 社区聊天，而非我们自己的实测。分辨率几乎不影响这个数字，真正决定它的是帧率和屏幕刷新率——只换一台显示器，同一台摄像机就会相差 120 毫秒。
      latency_path_desktop: 笔记本或台式机
      latency_path_goggles: 内置 VRX 的眼镜
      latency_path_ground_station: 专用地面站
      latency_path_phone: 手机或平板
      latency_title: 到底有多快
      robotics_text1: 同一条链路也为工业机器人、AGV、巡检设备和远程操作传输视频——凡是封闭视频系统会把你锁死、或者绕行云端会带来数秒延迟的场合，都用得上。
      robotics_text2: 在受支持的 SoC 上，画面帧会携带与传感器曝光起始对齐的挂钟时间戳——无需额外硬件即可实现多摄像机毫秒级同步。
      robotics_title: '不止于无人机：机器人与遥操作'
      title: 低延迟视频
