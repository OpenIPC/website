      why1_title: Быстрее, чем голый SDK
      why2_text: Наша работа с mainline-ядрами сохраняет платформы живыми после ухода вендора. Срок жизни вашего продукта не ограничен чужим роадмапом.
      why2_title: Переживает EOL кремния
      why3_text: Устройства работают без наших серверов — и вообще без чьих-либо. Ваша структура затрат остаётся вашей.
