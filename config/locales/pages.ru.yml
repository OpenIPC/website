    low_latency:
      business_bridge_html: Строите продукт на этом линке? <a href="/business">Напишите нам</a> — мы делаем заказную разработку и OEM.
      credits_text: Радиолинк существует благодаря wfb-ng, а экосистема растёт вместе с друзьями — RubyFPV и Mario FPV. Open source — командный спорт.
      credits_title: Стоим на открытых плечах
      cta_chat: FPV-чат
      cta_guide: Гайд по сборке
      fpv_text: 'Полностью открытая цифровая FPV-система: никакой закрытой экосистемы, никакого спаренного железа, никакого потолка прошивки. Соберите борт из поддерживаемой камеры, выберите наземную станцию и настройте каждый этап конвейера.'
      fpv_title: 'FPV: от объектива до очков'
      hardware_text_html: Борт собирается из поддерживаемых камер и AIO-плат — начните со <a href="/supported-hardware">списка поддерживаемого оборудования</a>. RunCam и EMAX выпускают FPV-железо на OpenIPC из коробки.
      hardware_title: Железо
      hero_lede: 'FPV-дроны, роботы, телеуправление: открытый видеотракт со сверхнизкой задержкой от камеры до экрана. От ~60 мс «от стекла до стекла» на поддерживаемом железе.'
      hero_title: Открытые видеолинки для машин, которые не умеют ждать.
      how_link_text_html: <a href="https://github.com/svpcom/wfb-ng">wfb-ng</a> вещает видео, телеметрию и управление поверх обычного Wi-Fi-железа — без ассоциации и без пауз на повторную передачу.
      how_link_title: Радиолинк
      how_rx_text_html: <a href="https://github.com/OpenIPC/PixelPilot_rk">PixelPilot</a> превращает плату на Rockchip в выделенную наземную станцию, а <a href="https://github.com/OpenIPC/aviateur">Aviateur</a> принимает на Windows, Linux и macOS.
      how_rx_title: RX — ваша сторона
      how_title: Как устроен линк
      how_tx_text_html: Камера с OpenIPC и энкодером <a href="https://github.com/OpenIPC/waybeam_venc">Waybeam</a> формирует поток и отдаёт его в радиолинк.
      how_tx_title: TX — борт
      latency_1080p30: 1080p30
      latency_1080p60: 1080p60
      latency_720p60: 720p60
      latency_column_config: Конфигурация
      latency_column_g2g: Типичная задержка «стекло-стекло»
      latency_intro: 'Цифры зависят от SoC, сенсора, разрешения, экспозиции и нагрева. Это типичные значения из наших собственных измерений, а не лучший случай из маркетинга:'
      latency_note: Измерено нашим собственным открытым аппаратным измерителем задержки, сделанным ровно для этой задачи.
      latency_title: Честно про задержку
      robotics_text1: Тот же линк несёт видео для промышленных роботов, AGV, инспекционных систем и удалённого управления — везде, где закрытая видеосистема привязала бы вас к вендору, а путь через облако добавил бы секунды.
      robotics_text2: На поддерживаемых SoC кадры несут метки времени, привязанные к началу кадра сенсора, — миллисекундная синхронизация многокамерных систем без дополнительного железа.
      robotics_title: 'Не только дроны: роботы и телеуправление'
      title: Видео с низкой задержкой
