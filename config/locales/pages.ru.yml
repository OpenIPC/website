      contrib1_title: Сообщайте об ошибках
      contrib2_text: Форкните код, внесите улучшение, пришлите pull request. Маленькие исправления приветствуются — большинство из нас так и начинало.
      contrib2_title: Улучшайте код
      contrib3_text: Запускайте WIP-сборки на своём железе и рассказывайте, что сломалось. Именно первые пользователи двигают платформу от WIP к DONE.
      contrib3_title: Тестируйте ранние сборки
