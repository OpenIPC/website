    donate:
      # Russia-only, and deliberately absent from pages.en.yml and pages.zh.yml
      # (#201). Open Collective cannot be paid with a card issued in Russia, so
      # the Russian section of the old site sent those visitors to PayWall
      # instead. The August 2026 relaunch dropped the fork and nothing has
      # mentioned PayWall since -- the site sent 9, 3, 11 and 7 subscribers a
      # year from 2022 to 2025, and none after the relaunch, because the link
      # stopped existing.
      #
      # Roubles only, and three tiers mirroring Open Collective's shape:
      # 100 / 250 / 500 ₽. The fork exists because a card issued in Russia
      # cannot pay Open Collective, so offering dollars and euros here would be
      # offering the same problem in a second place.
      #
      # "Разовый платёж" is described as paying one month and cancelling
      # because that is what the service offers -- there is no one-off button,
      # and the project's own figures say half of all PayWall subscriptions
      # have been used exactly that way.
      #
      # The tiers are listed and none is steered towards. PayWall has no
      # default tier and no per-tier address -- /openipc/R-250 answers 404 and
      # ?tier=R-250 is ignored -- but that is not why: the amount someone gives
      # is theirs to choose, and a default or a recommendation is a nudge this
      # project does not want to make even where the platform would allow it.
      #
      # data-event on the fallback link is not decoration (#183). Without it
      # this click would be counted as ext:opencollective.com while the same
      # click on the English page is oc-checkout, and the two donation routes
      # #201 exists to compare would be measured in different units.
      #
      # THESE AMOUNTS DESCRIBE THE PAYWALL PROJECT PAGE. They must match what
      # https://paywall.pw/openipc actually offers, and nothing in this
      # repository can enforce that -- the tiers live in the service, not here.
      paywall_title: PayWall — для карт, выпущенных в России
      paywall_text_html: Open Collective не принимает карты, выпущенные в России, — PayWall принимает.
      paywall_monthly_html: "Ежемесячно — 100, 250 или 500 ₽. Списывается раз в месяц, отменить можно когда угодно."
      paywall_once_html: "Разово — оплатите один месяц и сразу отмените подписку. Так поступала половина всех, кто поддерживал нас через PayWall."
      paywall_button: Поддержать через PayWall
      paywall_oc_fallback_html: Если у вас карта, выпущенная за пределами России, удобнее будет <a href="https://opencollective.com/openipc/contribute/backer-14335/checkout" data-event="oc-checkout">Open Collective</a> — там же публичная отчётность.
      business_band_html: Если ваша компания зависит от OpenIPC, самый устойчивый способ поддержать проект — коммерческое сотрудничество. <a href="/business">Что мы предлагаем</a>.
      accounting: Мы стремимся к открытому и прозрачному учету и благодарны за любую поддержку, которую вы можете оказать нашим усилиям по продвижению OpenIPC и нашей миссии по обеспечению устойчивого будущего.
      hero_lede: OpenIPC бесплатен в использовании и дорог в производстве. Пожертвования покупают камеры для новых платформ, оплачивают работу мейнтейнеров и держат свет включённым.
      hero_title: Поддержите работу.
      oc_button: Пожертвовать на Open Collective
      oc_text_html: Разово или регулярно, с открытой и прозрачной бухгалтерией. Постоянные спонсоры навсегда попадают в раздел Sponsors на нашей странице GitHub.
      oc_title: Open Collective
      thanks: Спасибо. Это значит больше, чем кажется.
      title: Поддержать
      where_text: Члены основной команды тратят собственные деньги на камеры и доступ к SDK, чтобы расширять поддержку железа. Средства снимают эту нагрузку, оплачивают работу мейнтейнеров и поездки на выставки, где и случаются договорённости с производителями.
      where_title: Куда идут деньги
    ecosystem:
      contribute_cta_html: Выберите проект и сделайте его лучше. <a href="/community">Начните здесь</a>.
      hero_lede: 'OpenIPC — это экосистема из более чем сотни открытых репозиториев: сама прошивка, видеотракт, инструменты вокруг и исследования, которые не дают умереть старому кремнию.'
      hero_title: Больше, чем прошивка.
      proj_aviateur: 'Кроссплатформенный приёмник: смотрите линк на Windows, Linux и macOS.'
      proj_burn: Восстанавливает «окирпиченные» устройства HiSilicon через последовательный порт.
      proj_coupler: Плавный переход с вендорской прошивки на OpenIPC и обратно. Без пайки и специальных навыков.
      proj_devourer: 'Сам линк: драйвер Wi-Fi-адаптеров Realtek в userspace, задающий скорость, мощность и канал для каждого пакета.'
      proj_divinus: Стример с открытым кодом для растущего набора платформ.
      proj_firmware: Универсальная прошивка на базе Buildroot для IP-камер — заменяет заброшенные вендорские системы на десятках семейств SoC.
      proj_ipctool: Определяет SoC, сенсор и флеш-чип почти любой камеры — и снимает бэкап заводской прошивки до того, как вы что-то измените.
      proj_majestic: 'Стример в сердце прошивки: RTSP, ONVIF, WebRTC, HLS, звук, ночные режимы. Распространяется в бинарном виде под лицензией Prosperity; коммерческие условия доступны.'
      proj_microbe: Веб-интерфейс прошивки.
      proj_onvif_tt: 'Инструмент проверки соответствия ONVIF: узнайте, что камера реализует на самом деле. Бесплатно.'
      proj_openhisilicon: Поддерживает вендорский SDK HiSilicon на mainline-ядрах — исправления CVE и новые возможности после ухода производителя.
      proj_openxiongmai: 'Та же идея для SoC Xiongmai: открытая замена SDK.'
      proj_pixelpilot: 'Сторона RX: превращает плату на Rockchip в выделенную наземную станцию с выводом на экран.'
      proj_qemu: Полный эмулятор IP-камер HiSilicon на QEMU — разрабатывайте и тестируйте прошивку без железа на столе.
      proj_rnd_player: 'Плеер для медиа-инженеров: разбирайте потоки так, как нужно разработчику.'
      proj_smolrtsp: Встраиваемая библиотека RTSP 1.0 для камер и других ограниченных устройств. TCP и UDP, любой формат полезной нагрузки.
      proj_waybeam: 'Сторона TX: гибкий видеоэнкодер для FPV-дронов и URLLC-устройств.'
      proj_yamlcli: Маленький консольный инструмент для правки YAML-конфигов из скриптов.
      section_community_text_html: Самодельное железо, крепления и аксессуары — например, модели для 3D-печати с тегом <a href="https://www.printables.com/search/models?q=tag%3Aopenipc">openipc на Printables</a>.
      section_community_title: Проекты сообщества
      section_core_text: Операционная система, стример и инструменты, которые доведут вас от заводской прошивки до OpenIPC.
      section_core_title: Ядро платформы
      section_longevity_text: 'Вендорские SDK рассчитаны на вендорские ядра: древние, незакрытые, заброшенные. Мы переносим их на mainline — исправления CVE и современные возможности ядра спустя годы после EOL.'
      section_longevity_title: Долголетие и безопасность
      section_lowlat_text_html: Открытый видеолинк для дронов, роботов и телеуправления. <a href="/low-latency">Обзор</a>.
      section_lowlat_title: Низкая задержка и URLLC
      section_tools_text: Бесплатные инструменты для камерных и медиа-инженеров — полезны, даже если вы никогда не прошьёте нашу прошивку.
      section_tools_title: Инструменты для инженеров
      stage_legend_html: У каждого проекта — честный значок статуса, тот же словарь, что и у прошивочных платформ. <a href="/stages-of-firmware-development">Как работают стадии</a>.
      title: Экосистема
    edge_ai:
      bring_driver_text: Чистые ядерные драйверы для видео- и нейродвижков HiSilicon, написанные по дизассемблированию и трассировке ядра, побайтно идентичные вендорским — и устойчивее там, где вендорский тест зависает. Молчание вендора — не блокер.
      bring_driver_title: Где нет драйвера — мы его пишем
      bring_fit_text: 'Модели перестраиваются так, чтобы вся сеть шла на ускорителе, а не половина, и дообучаются на картинке самой камеры: её ракурс, её обработка изображения, её родной масштаб. Модель, перенесённая на новую камеру без этого шага, теряет десять–двадцать пунктов точности.'
      bring_fit_title: Подогнать модель под чип и камеру
      bring_map_text: 'Мы разметили четыре семейства NPU, запуская на них модели, а не читая PDF вендора: что выполняется на ускорителе, что тихо откатывается на CPU и что менять до того, как вы потратите спринт на выяснение.'
      bring_map_title: Мы знаем, что ваш NPU не умеет
      bring_proven_text: Видеодвижок работает в CI под нашим собственным QEMU, выверенным попиксельно против кремния. Каждое изменение за ночь проверяется на эмулированном железе, так что стенд — не узкое место, а ваша плата не лежит у нас на столе.
      bring_proven_title: Проверено до того, как коснётся платы
      brings_intro: Четыре вещи, каждая измерена на кремнии.
      brings_title: Что мы приносим
      cta_note_html: Прошивки камер, настройка сенсоров и кастомные видеолинки — на <a href="/business">странице для бизнеса</a>.
      cta_primary: Написать на business@openipc.org
      cta_secondary: Спросить в чате
      cta_text: 'Одно письмо из четырёх строк: модель и её формат, целевой SoC и версия SDK, ссылка на кадры с камеры, нужные fps и точность. Отвечает инженер с планом, а не скрипт продаж.'
      cta_title: Пришлите модель и SoC. Получите вердикт за неделю.
      engagement_title: Как устроена работа
      eyebrow: Whitepaper · Edge AI · Инференс на чипе камеры
      hero_art_alt: 'Ночная парковка: нейросеть сходится к двум автомобилям, номерные знаки которых обведены рамками'
      hero_cta_how: Как устроена работа
      hero_cta_send: Пришлите нам модель и SoC
      hero_lede: Инференс ИИ на NPU и видеодвижках камерных SoC — на той скорости, за которую продавали кремний, на железе, к которому никто не даёт инструментов. От команды, стоящей за OpenIPC.
      hero_title: У вас есть модель и чип. Мы заставим их работать вместе.
      meta_description: 'Инференс ИИ на NPU и видеодвижках камерных SoC: что умеют четыре семейства NPU, драйверы там, где вендорских нет, модели, подогнанные под чип и камеру, проверка в CI без платы.'
      platform_arm: ARM-ядра без NPU
      platform_hisi: HiSilicon и Goke
      platform_ingenic: Ingenic
      platform_rk: Rockchip
      platform_sstar: SigmaStar
      platforms_text: 'Мы поставляем прошивки на все из них и работаем под NDA с большинством производителей камерных SoC — включая тулчейны, которые не распространяются за пределами их домашнего рынка. Если вашего чипа нет в списке, спросите: ответ «да» или «нет» в течение 48 часов.'
      platforms_title: Платформы
      pull_quote: Стена — это тулчейн, а не ваша модель.
      res_cpu_text: На камерах вообще без ускорителя наш собственный целочисленный движок ускорил нейросетевой классификатор в пять раз на единственном ядре камеры, с теми же ответами, что у эталона. Детекция просыпается только когда аппаратный детектор движения что-то замечает, так что тихая сцена не стоит ничего.
      res_cpu_title: Нет NPU? Всё равно работает
      res_faces_text: Детекция и распознавание за восемь миллисекунд, целиком на ускорителе, моделью, достаточно маленькой, чтобы жить рядом с видеоконвейером, — и не уступающей на стандартном бенчмарке моделям во много раз крупнее.
      res_faces_title: Лица
      res_plates_text: 'Номера находятся и читаются быстрее восьмидесяти кадров в секунду на ускорителе чипа камеры, и ничем не пожертвовано ради того, чтобы модель поместилась. Обучена на картинке самой камеры, поэтому читает то, что действительно видит объектив: ночью, на парковке, под тем углом, под которым висит камера.'
      res_plates_title: Номерные знаки
      results_title: Результаты на реальном кремнии
      scar_p1: NPU камерного SoC — не GPU. Он выполняет свой короткий список операторов, квантует так, как решил его компилятор, а сам компилятор может быть вам недоступен — некоторые никогда не выходят за пределы домашнего рынка. Модель, обученная за ночь на кластере, встречает чип, который не может выполнить половину из неё, и драйвер, падающий на первом незнакомом слое.
      scar_p2: В даташите написано TOPS. Там не написано, какие части вашей модели тихо уйдут на CPU и что штатный драйвер выдаёт четверть скорости, на которую способен кремний. Эти ответы получают, запуская модели на чипе, — и мы делаем это с первых камерных SoC с видеодвижком, начиная с ARM-ядер без блока плавающей точки вообще.
      scar_title: Ваша модель здесь не запускается, и никто не скажет почему
      stat_fps_l: чтение номеров на чипе камеры, от кадра до результата
      stat_fps_n: 80 fps
      stat_gap_l: скорость, которую штатный драйвер оставляет на столе, — измерено на том же чипе
      stat_gap_n: 4×
      stat_loss_l: потерянной точности при подгонке модели под чип
      stat_loss_n: '0'
      stats_source: Измерено нами на кремнии RK3588 и HiSilicon, на моделях, которые мы подгоняли, и драйверах, которые мы написали.
      step1_text: Фиксированная цена, пять рабочих дней. Вы присылаете модель или её архитектуру, SoC и версию SDK, около пятидесяти кадров с реальной камеры и цифры, по которым вас оценивают. Вы получаете послойный вердикт, что запускается, какая точность стоит на кону при подгонке под чип и как её сохранить, ожидаемую скорость относительно наших измеренных базовых значений и фиксированную цену следующего шага.
      step1_title: Отчёт о реализуемости
      step2_text: Модель перестроена и дообучена на ваших кадрах, работает целиком на ускорителе в компактном нативном рантайме, измерена на вашей плате. Приёмка — цифры, согласованные в отчёте.
      step2_title: Портирование и подгонка
      step3_text: В OpenIPC или в вашу прошивку, CI под QEMU там, где чип поддержан, драйверы там, где стека нет, — и ретейнер на ту чехарду версий SDK, которая привязывает модели к версии прошивки.
      step3_title: Интеграция и сопровождение
      title: Edge AI
