      hero_title: "Что этот сайт записывает"
      hero_lede: "Мы измеряем openipc.org, чтобы понимать, работают ли его страницы. Эта страница говорит, что именно это значит. Она короткая: длинная — это обещание, которое никто не проверяет."
      counting_title: "Подсчёт посетителей"
      counting_lede: "Счётчик, который мы держим сами, на том же сервере, что и сайт. Никуда на сторону ничего не уходит."
      records_page_html: "Открытую вами страницу и сайт, с которого вы пришли, если браузер его сообщил."
      records_place_html: "Страну и язык, который запрашивает браузер."
      records_device_html: "Браузер и операционную систему, а также размер экрана."
      records_clicks_html: "Клики, уводящие с сайта: письмо нам, вход в чат, открытие страницы пожертвований или переход по внешней ссылке."
      records_tag_html: "Метку в адресе, например <code>?ref=tg-ru</code>, если ссылку опубликовали мы сами. Она учитывается один раз и затем убирается из адреса."
      never_cookies_html: "Никаких кук, никакого локального хранилища, никаких идентификаторов. В вашем браузере не остаётся ничего."
      never_individuals_html: "Никаких отдельных визитов. На диск попадают только дневные итоги — строки, которая была бы вами, нигде нет."
      never_region_html: "Ни региона, ни города. Для этого нужна более подробная база, которой у нас нет."
      sessions_html: "Чтобы один человек, прочитавший три страницы, считался одним визитом, а не тремя, счётчик выводит короткоживущий ключ из вашего адреса и браузера. Он существует в памяти не дольше восьми часов и никуда не записывается. Сам адрес счётчик не хранит вовсе."
      log_title: "Журнал сервера"
      log_lede: "Обычная запись, которую ведёт любой веб-сервер."
      log_text_html: "Каждый запрос попадает в журнал вместе с адресом, с которого он пришёл, страницей и результатом. Мы используем его, чтобы находить сбои, пресекать злоупотребления и понимать нагрузку. Он удаляется через 14 дней."
      wall_title: "Open Wall"
      wall_lede: "Камеры с OpenIPC могут отправлять на стену снимок. Этот раздел — о камере, а не о вас."
      wall_published_html: "<strong>Публикуется:</strong> сам снимок и то, что камера сообщает о себе, — чип, сенсор, прошивка, стример, время работы и температура чипа."
      wall_withheld_html: "<strong>Не публикуется:</strong> MAC- и IP-адреса камеры — оба видны только мейнтейнерам. По MAC решаются две вещи: одна камера может загружать снимок раз в 15 минут, а камера из списка блокировок получает отказ. Страница камеры называется токеном, который нельзя превратить обратно ни в один из адресов."
      wall_retention_html: "Ночная очистка удаляет снимки и присланные с ними описания, когда им исполняется 2 дня, — дольше 3 они не живут."
