    stages_of_firmware_development:
      done_alt: 'Изображение: этап ВЫПОЛНЕНО'
      done_info: Сделано и сделано! Загрузчик загружается, загружается Linux, стример может транслировать видео и создавать моментальные снимки. Вы можете открыть рабочую платформу для доработок и дальнейших улучшений. Тем не менее, мы все еще ожидаем отзывов и исправлений от вас, ребята.
      hlp_alt: 'Изображение: этап HLP'
      hlp_info: Требуется помощь. У нас есть оборудование, у нас есть SDK, основные вещи изучены и сделаны. Но мы застряли. Именно здесь мы ищем помощи у опытных разработчиков встраиваемых систем, чтобы преодолеть препятствия и перейти к следующему этапу.
      mvp_alt: 'Изображение: MVP этапа'
      mvp_info: Минимально жизнеспособный продукт. Базовая система построена, платформа может производить видео, по крайней мере, на основном канале, но из-за нехватки человеческих ресурсов разработка задерживается или останавливается. Финансовые вливания могут подтолкнуть разработку к финальной стадии.
      neq_alt: 'Изображение: этап NEQ'
      neq_info_html: Нет оборудования. У нас есть SDK для платформы, но у нас нет конкретного оборудования для продолжения разработки, вы можете пожертвовать его нашим ребятам из R&D (особенно старые платы, которые прошли <abbr title="Конец жизни">EOL</abbr> и больше не могут быть куплены).
      paragraph1: После приобретения SDK для новой SoC мы добавляем SoC в таблицу поддерживаемого оборудования. Мы присваиваем либо статус NEQ (Нет оборудования), если у нас нет определенных аппаратных модулей, либо статус HLP (Требуется помощь), если у нас есть оборудование, но мы ищем разработчика, который возглавил бы разработку для этой SoC. Это считается официальным началом разработки.
      paragraph2: Нет причин иметь SoC в таблице без его SDK.
      paragraph3: По мере продвижения работы над SoC его статус постепенно меняется. Сначала в RND, потом в WIP, потом дальше в MVP и, наконец, в DONE.
      rnd_alt: 'Изображение: стадия НИОКР'
      rnd_info: Стадия исследований и разработок, когда у нас уже есть SDK платформы и, может быть, даже аппаратные платы, но мы начинаем возиться с платформой, изучая ее специфику и особенности. Впереди еще много работы.
      subtitle: Типичный жизненный цикл разработки
      title: Этапы разработки прошивки
      wip_alt: 'Изображение: этап WIP'
      wip_info: Работа в процессе. Мы многое узнали об аппаратном обеспечении платформы и кодовой базе, подготовили первую общедоступную бинарную сборку и ждем первых пользователей, которые протестируют ее на своих платах и предоставят отзывы, которые помогут нам двигаться вперед.
    support_open_source:
      contribute: Способствовать
      contribute_how1: Сообщить о проблемах
      contribute_how1_text_html: Если вы обнаружили ошибку, сообщите о ней в <a href="https://github.com/OpenIPC/">соответствующий репозиторий на GitHub</a> .
      contribute_how2: Предлагайте новые идеи
      contribute_how2_text_html: Если вам кажется, что какая-то полезная функция отсутствует, вы можете отправить <a href="https://github.com/OpenIPC/firmware/issues">запрос на добавление этой функции на GitHub</a> .
      contribute_how3: Исправьте код
      contribute_how3_text_html: Создайте копию репозитория исходного кода, внесите улучшения и отправьте запрос на включение исправлений в наш репозиторий на GitHub.
      contribute_how4: Напишите документацию
      contribute_how4_text_html: Создавайте или расширьте документацию для наших проектов. Заполните <a href="https://github.com/OpenIPC/wiki">Wiki</a>, вычитайте и откорректируйте текст на веб-сайте.
      contribute_how5: Расскажите о проекте
      contribute_how5_text_html: Расскажите о своём опыте установки прошивки OpenIPC с другими. Напишите сообщение в блоге, снимите видео, создайте пост на Reddit, поделитесь им в Twitter, опубликуйте его в других социальных сетях...
      contribute_how6: Станьте спонсором
      contribute_how6_text_html: Помогите нам собрать достаточно средств для покрытия текщих расходов и для обеспечения долгосрочное обслуживания того, что мы стремимся сделать открытой платформой сетевых IP-камер для всех пользователей по всему миру. В знак признания вы будете добавлены в раздел «Спонсоры» на нашей странице на GitHub.
      contribute_text1: Открытый исходный код — это обмен, совместное создание чего-то великого и вклад во всеобщее благо! Всякий раз, когда вы делаете исправление, которое, по вашему мнению, может принести пользу кому-то другому, отправьте его обратно в проект.
      contribute_text2: 'Вы столкнулись с проблемой и не смогли найти ответ в документации, но смогли найти свое решение - расскажите нам о нем. Делитесь своим опытом, мыслями, идеями. Есть много способов внести свой вклад в проект, и вот несколько примеров:'
      contribute_text3: Мы стремимся к открытому и прозрачному учету и благодарны за любую поддержку, которую вы можете оказать нашим усилиям по продвижению OpenIPC и нашей миссии по обеспечению устойчивого будущего.
      donate_crypto: Пожертвовать криптовалюту
      if_you_like_donate_html: Если вам нравится наша работа, пожалуйста, поддержите нас на <a href="https://opencollective.com/openipc/contribute/backer-14335/checkout">Open Collective.</a>
      img1_alt: 'Изображение: Поддержка открытого исходного кода'
      oc_button_alt: 'Изображение: кнопка пожертвования OpenCollective'
      oc_button_title: Поддержите нашу команду
      paragraph1: Многие члены основной команды используют свое свободное время и свои знания для работы над проектом. Мы даже используем личные средства для покупки камер, чтобы расширять список поддерживаемого оборудования. Ваши пожертвования помогают нам облегчить нагрузку на личные финансы, в то же время обеспечивая доступ к новому оборудованию. Мы также используем собранные средства для оплаты работы специалистов и для участия в торговых выставках и общения с поставщиками оборудования, что позволяет отслеживать тенденции развития рынка камер. Так же мы оплачиваем доступ к SDK и вспомогательным материалы, которые стоят дорого. Ваш вклад помогает нам продолжать разработку и оказывать техническую поддержку сообществу.
      price_of_firmware: Цена прошивки
      price_of_firmware_p1_html: Право на использование прошивки OpenIPC и ее компонентов в большинстве случаев предоставляется всем пользователям бесплатно для личных и некоммерческих целей. Если вы заинтересованы в использовании OpenIPC для своих бизнес-проектов, пожалуйста, свяжитесь с <a href="/our-team">нашей командой</a> для получения подробной информации, так как некоторые компоненты прошивки могут иметь лицензию, отличную от <a href="https://opensource.org/licenses/MIT">MIT</a>.
      thank_you: Спасибо, это очень много значит для нас!
      title: Поддержите программирование с открытым исходным кодом
      tron_in_telegram_html: Используя криптовалюту TON, пожертвования можно делать прямо внутри Telegram с помощью <a href="https://t.me/wallet">@wallet</a> .
    utilities:
      paragraph1: Коллекция полезных программ и утилит.
      title: Утилиты
    web_interface:
      intro: 'Каждая камера с OpenIPC отдаёт этот интерфейс сама, по собственному адресу: ни облачного аккаунта, ни приложения-посредника. Ниже — страницы камеры с актуальной сборкой.'
      scene_credit_html: 'Пляж на снимках Camera Preview и Majestic Settings — это вид с камеры пользователя OpenIPC <a href="https://github.com/OpenIPC/majestic/issues/300#issuecomment-5405996706">@usa-</a>, опубликован с разрешения владельца.'
      title: Веб интерфейс
