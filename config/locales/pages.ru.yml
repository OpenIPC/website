    our_projects:
      community: Что-то связанное с OpenIPC. Контент, создаваемый пользователями.
      paragraph1_html: Включает всю информацию о создании и использовании комплектов FPV и программного обеспечения как для бортовых, так и для наземных устройств. Настоятельно рекомендуем вам прочитать <a href="https://github.com/OpenIPC/wiki/blob/master/en/fpv.md">основную статью</a> , перейти по ссылкам и посмотреть видео полетов.
      paragraph2: Проект активно развивается, присоединяйтесь!
      paragraph3: Это наш новый проект системы аудио- и видеосвязи, который находится на стадии проектирования.
      paragraph4: Мы работаем над созданием удобного конструктора прошивок OnLine, который позволит вам более гибко и сразу создавать их с нужными параметрами.
      paragraph5: Пожалуйста, следите за обновлениями на сайте!
