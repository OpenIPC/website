      contribute_cta_html: Выберите проект и сделайте его лучше. <a href="/community">Начните здесь</a>.
      hero_lede: 'OpenIPC — это экосистема из более чем сотни открытых репозиториев: сама прошивка, видеотракт, инструменты вокруг и исследования, которые не дают умереть старому кремнию.'
      hero_title: Больше, чем прошивка.
      proj_aviateur: 'Кроссплатформенный приёмник: смотрите линк на Windows, Linux и macOS.'
      proj_burn: Восстанавливает «окирпиченные» устройства HiSilicon через последовательный порт.
      proj_coupler: Плавный переход с вендорской прошивки на OpenIPC и обратно. Без пайки и специальных навыков.
      proj_devourer: Открытая основа для SDR-подобных приёмников на дешёвом Wi-Fi-железе.
      proj_divinus: Стример с открытым кодом для растущего набора платформ.
      proj_firmware: Универсальная прошивка на базе Buildroot для IP-камер — заменяет заброшенные вендорские системы на десятках семейств SoC.
      proj_ipctool: Определяет SoC, сенсор и флеш-чип почти любой камеры — и снимает бэкап заводской прошивки до того, как вы что-то измените.
      proj_majestic: 'Стример в сердце прошивки: RTSP, ONVIF, WebRTC, HLS, звук, ночные режимы. Распространяется в бинарном виде под лицензией Prosperity; коммерческие условия доступны.'
      proj_microbe: Веб-интерфейс прошивки.
      proj_onvif_tt: 'Инструмент проверки соответствия ONVIF: узнайте, что камера реализует на самом деле. Бесплатно.'
      proj_openhisilicon: Поддерживает вендорский SDK HiSilicon на mainline-ядрах — исправления CVE и новые возможности после ухода производителя.
      proj_openxiongmai: 'Та же идея для SoC Xiongmai: открытая замена SDK.'
      proj_pixelpilot: 'Сторона RX: превращает плату на Rockchip в выделенную наземную станцию с выводом на экран.'
      proj_qemu: Полный эмулятор IP-камер HiSilicon на QEMU — разрабатывайте и тестируйте прошивку без железа на столе.
      proj_rnd_player: 'Плеер для медиа-инженеров: разбирайте потоки так, как нужно разработчику.'
      proj_smolrtsp: Встраиваемая библиотека RTSP 1.0 для камер и других ограниченных устройств. TCP и UDP, любой формат полезной нагрузки.
      proj_telemetry: Мост телеметрии между полётными контроллерами и землёй.
      proj_waybeam: 'Сторона TX: гибкий видеоэнкодер для FPV-дронов и URLLC-устройств.'
      proj_yamlcli: Маленький консольный инструмент для правки YAML-конфигов из скриптов.
      section_community_text_html: Самодельное железо, крепления и аксессуары — например, модели для 3D-печати с тегом <a href="https://www.printables.com/search/models?q=tag%3Aopenipc">openipc на Printables</a>.
      section_community_title: Проекты сообщества
      section_core_text: Операционная система, стример и инструменты, которые доведут вас от заводской прошивки до OpenIPC.
      section_core_title: Ядро платформы
      section_longevity_text: 'Вендорские SDK рассчитаны на вендорские ядра: древние, незакрытые, заброшенные. Мы переносим их на mainline — исправления CVE и современные возможности ядра спустя годы после EOL.'
      section_longevity_title: Долголетие и безопасность
