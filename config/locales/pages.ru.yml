    stages_of_firmware_development:
      done_alt: 'Изображение: этап ВЫПОЛНЕНО'
      done_info: Сделано и сделано! Загрузчик загружается, загружается Linux, стример может транслировать видео и создавать моментальные снимки. Вы можете открыть рабочую платформу для доработок и дальнейших улучшений. Тем не менее, мы все еще ожидаем отзывов и исправлений от вас, ребята.
      hlp_alt: 'Изображение: этап HLP'
      hlp_info: Требуется помощь. У нас есть оборудование, у нас есть SDK, основные вещи изучены и сделаны. Но мы застряли. Именно здесь мы ищем помощи у опытных разработчиков встраиваемых систем, чтобы преодолеть препятствия и перейти к следующему этапу.
      mvp_alt: 'Изображение: MVP этапа'
      mvp_info: Минимально жизнеспособный продукт. Базовая система построена, платформа может производить видео, по крайней мере, на основном канале, но из-за нехватки человеческих ресурсов разработка задерживается или останавливается. Финансовые вливания могут подтолкнуть разработку к финальной стадии.
      neq_alt: 'Изображение: этап NEQ'
      neq_info_html: Нет оборудования. У нас есть SDK для платформы, но у нас нет конкретного оборудования для продолжения разработки, вы можете пожертвовать его нашим ребятам из R&D (особенно старые платы, которые прошли <abbr title="Конец жизни">EOL</abbr> и больше не могут быть куплены).
      paragraph1: После приобретения SDK для новой SoC мы добавляем SoC в таблицу поддерживаемого оборудования. Мы присваиваем либо статус NEQ (Нет оборудования), если у нас нет определенных аппаратных модулей, либо статус HLP (Требуется помощь), если у нас есть оборудование, но мы ищем разработчика, который возглавил бы разработку для этой SoC. Это считается официальным началом разработки.
      paragraph2: Нет причин иметь SoC в таблице без его SDK.
      paragraph3: По мере продвижения работы над SoC его статус постепенно меняется. Сначала в RND, потом в WIP, потом дальше в MVP и, наконец, в DONE.
      rnd_alt: 'Изображение: стадия НИОКР'
      rnd_info: Стадия исследований и разработок, когда у нас уже есть SDK платформы и, может быть, даже аппаратные платы, но мы начинаем возиться с платформой, изучая ее специфику и особенности. Впереди еще много работы.
      subtitle: Типичный жизненный цикл разработки
      title: Этапы разработки прошивки
      wip_alt: 'Изображение: этап WIP'
      wip_info: Работа в процессе. Мы многое узнали об аппаратном обеспечении платформы и кодовой базе, подготовили первую общедоступную бинарную сборку и ждем первых пользователей, которые протестируют ее на своих платах и предоставят отзывы, которые помогут нам двигаться вперед.
    teleoperation:
      bring_latency_text: Тот же стек, на котором FPV-пилоты летают на полной скорости, на камерах дешевле обеда. Открытая прошивка от сенсора до кодера, настроенная на кратчайший путь наружу.
      bring_latency_title: Десятки миллисекунд, проверено в воздухе
      bring_link_text: 'Видео вниз, управление вверх и никаких замираний между ними: без спаривания, без очереди повторных передач. Когда в эфире шумно, вы теряете кадр — но не робота.'
      bring_link_title: Канал, который теряет кадр, а не оператора
      bring_stream_text: Один закодированный поток, две скорости. Рекордер сохраняет каждый кадр, пока канал оператора несёт столько, сколько может, — без второго кодера и без второй камеры.
      bring_stream_title: Записывать всё, передавать то, что помещается
      bring_time_text: Каждый кадр получает метку времени в момент захвата сенсором, до того как его коснётся что-либо ещё. Все камеры робота сходятся с точностью до нескольких миллисекунд без триггерного кабеля — и датасет выстраивается ровно.
      bring_time_title: Время встроено в каждый кадр
      brings_intro: Четыре вещи, и каждая уже работает на камерах в поле.
      brings_title: Что OpenIPC добавляет в контур
      cta_note_html: Отвечает инженер, а не скрипт продаж. Инженерия камер и канала, которая поставляется уже сегодня, — на <a href="/business">странице для бизнеса</a>.
      cta_primary: Написать на business@openipc.org
      cta_secondary: Спросить в чате
      cta_text: 'Мы берём трёх партнёров по дизайну: робот, стенд и инженер с вашей стороны; прошивка камер, канал и наше время — с нашей. На выходе — контур телеуправления, измеренный на вашей машине, и, если захотите, ваш первый датасет.'
      cta_title: Приводите робота, кто бы его ни сделал. Глаза — за нами.
      eyebrow: Whitepaper · Физический ИИ · Данные телеуправления
      hero_art_alt: Оператор в VR-шлеме, чьи движения повторяет человекоподобный робот в затопленном промышленном цехе
      hero_cta_link: Как устроен видеолинк
      hero_cta_pilot: Обсудить пилот
      hero_lede: 'OpenIPC переносит открытый видеостек с ультранизкой задержкой, проверенный в FPV, в робототехнику с человеком в контуре: стенд под любого робота любого производителя, канал, который не замирает, метка времени на каждом кадре в момент съёмки, каждая сессия — датасет.'
      hero_title: Сотня гуманоидов вот-вот начнёт учиться у людей. Дайте им глаза, которые не отстают.
      landscape_p1: 'Все, кто строит универсального робота, уже выбрали, откуда брать обучающие данные. Figure ставит на видео с людьми, Tesla — на симуляцию, 1X и Unitree — на телеуправление с человеком в контуре: человек ведёт робота, сессия записывается, а политика обучается на данных, уже кинематически корректных для этого тела. Исследователи Amazon идут другим путём — пересчитывают захват движения человека в движения робота постфактум.'
      landscape_p2: Телеуправление побеждает, потому что закрывает разрыв воплощения у самого источника. Одна только Unitree выпустила около 18 000 двуногих роботов, и каждым из них будут управлять.
      landscape_p3: Что не определилось — так это стенд. Аватар Unitree водит робота Unitree. Остальным 43 производителям из списка и каждой лаборатории, где машин больше одного вида, нужен стенд телеуправления и сбора данных, который подходит любому роботу и любой камере.
      landscape_p4: 'И он обязан отвечать на вопрос, на который демо-ролики не отвечают никогда: какова задержка от объектива до экрана и как её измерили? Оператор хорош ровно настолько, насколько мала задержка, которую он чувствует, а датасет наследует каждое его промедление.'
      landscape_title: Стратегия сбора данных определилась. Стенд — ещё нет.
      loop_intro: 'Teleoperator — слой, который мы строим поверх стека: стенд с человеком в контуре для любого робота — гуманоида, колёсного или летающего, — управляемого из шлема, где каждая сессия записывается как датасет LeRobot, на которых открытое робототехническое сообщество уже обучает модели.'
      loop_return: Политика, обученная на датасете, ведёт робота следующей. Это и есть маховик.
      loop_title: От рук оператора до обучающей выборки
      meta_description: 'Открытое видео с ультранизкой задержкой для телеуправления роботами: стенд под любого робота, канал, который не замирает, метка времени на каждом кадре в момент съёмки, каждая сессия — датасет.'
      node_dataset_text: Эпизоды, готовые к обучению
      node_dataset_title: Датасет
      node_link_text: Видео вниз, намерение вверх
      node_link_title: Канал
      node_operator_text: Видит то, что видит робот; отслеживаются голова, руки или всё тело
      node_operator_title: Оператор
      node_recorder_text: Каждый кадр, каждая поза, одни часы
      node_recorder_title: Рекордер
      node_robot_text: 'Любого производителя: руки, ноги, колёса или винты'
      node_robot_title: Робот
      pilot1_text: Прошивка OpenIPC на камерах, которые уже стоят на вашем роботе, и канал между роботом и рабочим местом оператора.
      pilot1_title: Глаза на роботе
      pilot2_text: 'Оператор ведёт машину: голова и руки — из шлема, или всё тело — из костюма захвата движения, спроецированные на собственные суставы робота, с предохранителем, который останавливает его в момент, когда канал замолкает.'
      pilot2_title: Руки на управлении
      pilot3_text: 'Сложить бельё, загрузить холодильник, прибраться в комнате: каждый прогон записывается по одним часам — что видел оператор, что он делал, что чувствовал робот — как эпизоды LeRobot, готовые к обучению.'
      pilot3_title: Сессии в датасеты
      pilot_title: Как выглядит пилот
      pull_quote: Задержка — налог на каждый записанный эпизод.
      stat_latency_l: от объектива до экрана на стеке OpenIPC
      stat_latency_n: '~30 мс'
      stat_market_l: моделей гуманоидов от 44 китайских производителей
      stat_market_n: '100'
      stat_units_l: роботов ожидается к отгрузке в 2026 году, большинство — в лаборатории
      stat_units_n: '100 000'
      stats_source_html: 'Рыночные цифры: <a href="https://www.linkedin.com/posts/jens-peder-kristensen-0116b2_chinese-humanoid-and-legged-robot-companies-activity-7470567675631435776-UGdv">KeyResearch, сентябрь 2026</a>. Задержка: цифры, о которых сообщают люди, летающие на этом стеке, — на <a href="/low-latency">странице о низкой задержке</a>.'
      title: Телеуправление
      why1_text: Прошивки и инструменты для десятков семейств камерных чипов, в открытую, с сообществом, которое читает исходники и чинит то, что находит.
      why1_title: Открыты с 2019 года
      why2_text: FPV-пилоты летают на этом стеке каждый день, а RunCam и другие вендоры поставляют железо на OpenIPC из коробки. Рефлексы, проводящие дрон сквозь щель, — те же, что ведут робота на ринге, а канал уже прошёл худшие радиоусловия из существующих.
      why2_title: Проверено в воздухе
      why3_text: Без облака, без подписки, без платы за каждый экземпляр — и без зависимости от того, чьего робота вы купили. Когда чип снимают с производства, прошивка его переживает — и ваш робот тоже.
      why3_title: Не привязано к производителю робота
      why_title: Почему OpenIPC
    utilities:
      paragraph1: Коллекция полезных программ и утилит.
      title: Утилиты
    web_interface:
      intro: 'Каждая камера с OpenIPC отдаёт этот интерфейс сама, по собственному адресу: ни облачного аккаунта, ни приложения-посредника. Ниже — страницы камеры с актуальной сборкой.'
      scene_credit_html: 'Пляж на снимках Camera Preview и Majestic Settings — это вид с камеры пользователя OpenIPC <a href="https://github.com/OpenIPC/majestic/issues/300#issuecomment-5405996706">@usa-</a>, опубликован с разрешения владельца.'
      title: Веб интерфейс
